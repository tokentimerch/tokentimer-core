        description: GitLab Webhook Events
      - url: https://about.gitlab.com/releases/
        type: blog
        feed: https://about.gitlab.com/atom.xml
        description: GitLab Release Notes (RSS)
      - url: https://docs.gitlab.com/api/rest/deprecations/
        type: deprecation
        description: GitLab REST API Deprecations

  pagerduty:
    id: pagerduty
    name: PagerDuty
    description: Incident management integration for critical certificate expiration alerts
    code_locations:
      - path: apps/worker/src/pagerduty-incidents.js
        functions: [enqueuePagerDutyIncident, processPagerDutyIncident, reconcilePagerDutyIncidents]
      - path: apps/worker/src/notify/webhooks.js
        functions: [postJson, formatPayload]
    base_urls:
      - https://events.pagerduty.com
    endpoints:
      - pattern: /v2/enqueue
        method: POST
        description: Send event to PagerDuty (deprecated, use Events API v2)
      - pattern: /v2/change/enqueue
        method: POST
        description: Send change event
    api_version: Events API v2
    version_headers: []
    auth_method: Integration Key (routing_key in payload)
    sdks:
      - name: axios
        version: 1.20.0
        language: JavaScript
        location: apps/worker/package.json
    webhook_formats:
      sent:
        - type: PagerDuty Events API v2
          format: |
            {
              "routing_key": "<integration-key>",
              "event_action": "trigger|acknowledge|resolve",
              "dedup_key": "<deduplication-key>",
              "payload": {
                "summary": "Certificate expires in N days",
                "source": "TokenTimer",
                "severity": "critical|error|warning|info",
                "timestamp": "ISO8601",
                "custom_details": { "token_id": "...", "expiration": "..." }
              }
            }
      received: []
    notes: |
      PagerDuty Events API v2 for triggering/acknowledging/resolving incidents. Uses
      routing key authentication. Supports deduplication via dedup_key. Worker manages
      incident lifecycle with retry logic and parent alert reconciliation.
    sources:
      - url: https://developer.pagerduty.com/docs/changelog
        type: changelog
        description: PagerDuty API Changelog
      - url: https://support.pagerduty.com/main/docs/webhooks
        type: webhook
        description: PagerDuty Generic Webhooks
