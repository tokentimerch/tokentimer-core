      - path: apps/worker/src/auto-sync-providers.js
        constants: [CORE_AUTO_SYNC_PROVIDERS]
      - path: apps/dashboard/src/components/imports/ImportGitLabForm.jsx
        description: GitLab integration UI
    base_urls:
      - https://gitlab.com
    endpoints:
      - pattern: /api/v4/user
        method: GET
        description: Get authenticated user
      - pattern: /api/v4/user/keys
        method: GET
        description: List SSH keys
      - pattern: /api/v4/personal_access_tokens
