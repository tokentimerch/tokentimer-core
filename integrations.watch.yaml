    id: microsoft-teams
    name: Microsoft Teams
    description: Microsoft Teams webhook notifications for certificate expiration alerts
    code_locations:
      - path: apps/worker/src/notify/webhooks.js
        functions: [formatTeamsPayload, teamsThemeForSeverity]
    base_urls:
      - https://<org>.webhook.office.com
    endpoints:
      - pattern: /webhookb2/{guid}@{tenant}/IncomingWebhook/{channel}/{connector}
        method: POST
        description: Office 365 Connector webhook (legacy, deprecated)
      - pattern: /workflows/{workflow-id}/triggers/manual/paths/invoke
        method: POST
        description: Power Automate workflow (new)
    api_version: null
    version_headers: []
    auth_method: Webhook URL secret
    sdks:
      - name: axios
        version: 1.20.0
        language: JavaScript
        location: apps/worker/package.json
    webhook_formats:
      sent:
        - type: Office 365 MessageCard (legacy)
          format: |
            {
              "@type": "MessageCard",
              "@context": "https://schema.org/extensions",
              "summary": "Summary text",
              "themeColor": "FF0000",
              "sections": [{
                "activityTitle": "Title",
                "facts": [{ "name": "Key", "value": "Value" }],
                "markdown": true
              }],
              "potentialAction": [{
                "@type": "OpenUri",
                "name": "Button text",
                "targets": [{ "os": "default", "uri": "https://..." }]
              }]
            }
        - type: Adaptive Card (new format for Power Automate)
          format: JSON (adaptive card schema)
      received: []
    notes: |
      Microsoft Teams webhooks. Office 365 Connectors are deprecated (retirement
      announced 2024, extended to 2025). Migration to Power Automate workflows or
      Adaptive Cards via bot framework is ongoing. Current implementation uses legacy
      MessageCard format but should be updated to Adaptive Cards. Changes are tracked
      via concurrent agent work (mentioned in task description).
