  twilio-whatsapp:
    id: twilio-whatsapp
    name: Twilio WhatsApp
    description: WhatsApp notifications via Twilio API for certificate expiration alerts
    code_locations:
      - path: apps/worker/src/notify/whatsapp.js
        functions: [sendWhatsApp, normalizeWhatsAppTo]
    base_urls:
      - https://api.twilio.com
    endpoints:
      - pattern: /2010-04-01/Accounts/{AccountSid}/Messages.json
        method: POST
        description: Send WhatsApp message
    api_version: 2010-04-01
    version_headers: []
    auth_method: HTTP Basic Auth (Account SID + Auth Token)
    sdks:
      - name: axios
        version: 1.20.0
        language: JavaScript
        location: apps/worker/package.json
    webhook_formats:
      sent:
        - type: Twilio Message request
          format: |
            POST /2010-04-01/Accounts/{AccountSid}/Messages.json
            application/x-www-form-urlencoded
            {
              "To": "whatsapp:+1234567890",
              "From": "whatsapp:+0987654321",
              "Body": "Message text",
              "ContentSid": "HX...",
              "ContentVariables": "{...}"
            }
      received: []
    notes: |
      Twilio WhatsApp API for sending messages. Supports both plain text (Body) and
      templated messages (ContentSid + ContentVariables). Credentials can be provided
      via environment variables or encrypted database settings. Idempotency-Key header
      supported for retry safety.
    sources:
      - url: https://www.twilio.com/docs/whatsapp/api
        type: api-policy
        description: Twilio WhatsApp API
      - url: https://www.twilio.com/docs/whatsapp/tutorial/send-whatsapp-notification-messages-templates
        type: api-policy
        description: WhatsApp Template Messages
      - url: https://www.twilio.com/changelog
        type: changelog
        description: Twilio Changelog
