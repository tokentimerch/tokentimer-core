# Standalone Prometheus configuration example, NOT TokenTimer Helm values.
# Merge the scrape_configs entry into the existing Prometheus configuration.
# Prometheus Operator users can supply the entry via additionalScrapeConfigs.
# See docs/AUTO_SYNC_MONITORING.md for Helm rule integration and limitations.
global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - auto-sync-created.rules.yaml

scrape_configs:
  - job_name: tokentimer-auto-sync-metrics
    metrics_path: /metrics
    scrape_interval: 30s
    scrape_timeout: 10s
    static_configs:
      # One stable Service target per TokenTimer database. All API replicas must
      # expose the new counter and use the same primary database.
      # Assumes Helm release=tokentimer, namespace=tokentimer, API port=4000.
      - targets: [tokentimer-api.tokentimer.svc.cluster.local:4000]
        labels:
          deployment: tokentimer-production
          instance: tokentimer-production-auto-sync
    metric_relabel_configs:
      # Keep per-process metrics on the existing per-pod API ServiceMonitor.
      # Prometheus-generated up/scrape metrics remain available for this job.
      - source_labels: [__name__]
        regex: auto_sync_items_created_total
        action: keep
