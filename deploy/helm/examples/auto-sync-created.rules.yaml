# Prometheus rule file, NOT TokenTimer Helm values.
# Load with rule_files, or merge this groups list into the TokenTimer chart's
# monitoring.prometheusRules.groups and enable/select its PrometheusRule.
# Selectors must match prometheus-auto-sync-created.yaml after customization.
groups:
  - name: tokentimer.auto-sync-created
    interval: 30s
    rules:
      - alert: TokenTimerAutoSyncCreated
        expr: >-
          increase(auto_sync_items_created_total{
            job="tokentimer-auto-sync-metrics",
            deployment="tokentimer-production",
            provider="gitlab"
          }[15m]) > 0
        labels:
          severity: info
        annotations:
          summary: "GitLab auto-sync added TokenTimer inventory"
          description: >-
            The persistent GitLab creation counter increased in the last
            15 minutes. Review auto-sync run history for details. This alert
            covers all workspaces in this installation and can combine
            discoveries from several runs.

      - alert: TokenTimerAutoSyncMetricsUnavailable
        expr: >-
          up{
            job="tokentimer-auto-sync-metrics",
            deployment="tokentimer-production"
          } == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "TokenTimer auto-sync metrics cannot be collected"
          description: >-
            The dedicated API metrics scrape has failed for two minutes.
            Check API availability, database-backed collection, network access,
            and ENABLE_METRICS. Discovery alerts may miss activity while
            monitoring is unavailable.

      - alert: TokenTimerAutoSyncMetricsMissing
        expr: >-
          absent_over_time(auto_sync_items_created_total{
            job="tokentimer-auto-sync-metrics",
            deployment="tokentimer-production",
            provider="gitlab"
          }[5m])
        labels:
          severity: warning
        annotations:
          summary: "TokenTimer GitLab creation counter is missing"
          description: >-
            No GitLab creation-counter sample has been collected for five
            minutes. Check the dedicated scrape job, its labels and metric
            filter, API versions, and ENABLE_METRICS. A zero-valued series
            should be present even before the first creation.
