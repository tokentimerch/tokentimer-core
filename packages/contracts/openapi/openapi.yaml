        "422":
          description: Request rejected because it contained private key material
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: Private key material is not accepted in CertOps requests
                code: PRIVATE_KEY_MATERIAL_REJECTED
        "503":
          description: The security audit sink was unavailable while recording a private-key-material rejection. The endpoint fails closed; the payload is neither persisted nor echoed and no executor-event side effects occur.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: CertOps security audit is temporarily unavailable
                code: CERTOPS_SECURITY_AUDIT_UNAVAILABLE
        "429":
          description: CertOps machine-token rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: CertOps machine-token rate limit exceeded
                code: CERTOPS_MACHINE_RATE_LIMITED
        "500":
          $ref: "#/components/responses/InternalError"
