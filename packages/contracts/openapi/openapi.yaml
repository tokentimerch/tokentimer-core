                  maxLength: 1024
                  description: Optional attributable justification stored in the decision ledger.
      responses:
        "200":
          description: Job rejected; status moves to rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CertOpsJobApprovalDecisionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Caller lacks the manager role or uses non-session credentials
