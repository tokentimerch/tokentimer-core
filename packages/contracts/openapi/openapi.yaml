    CertOpsAgentBootstrapToken:
      type: object
      additionalProperties: false
      description: Public agent bootstrap-token metadata. Plaintext ttboot_ tokens, token hashes, Authorization headers, and credential material are never returned by metadata/list/revoke responses.
      required:
        - id
        - workspaceId
        - name
        - tokenPrefix
        - status
        - expiresAt
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        workspaceId:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 128
        tokenPrefix:
          type: string
          pattern: "^ttboot_[a-f0-9]{16}$"
          description: Public lookup prefix only; not sufficient to authenticate.
        status:
          type: string
          enum: [active, used, revoked, expired]
          description: Single-use lifecycle. A token flips to used after a successful agent registration; expired is derived from expiresAt.
        expiresAt:
          type: string
          format: date-time
          description: Required future expiry, capped at 30 days from creation.
        usedAt:
          type: string
          format: date-time
          nullable: true
        usedByAgentId:
          type: string
          nullable: true
        revokedAt:
          type: string
          format: date-time
          nullable: true
        revokedBy:
          type: integer
          nullable: true
        createdBy:
          type: integer
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
          nullable: true
        downtimeAlertsEnabled:
          type: boolean
          nullable: true
          description: Alert configuration to copy onto the agent record created when this token is consumed (the agent row does not exist yet at token-creation time). Null on tokens created before this setting existed; registration then defaults the created agent to enabled, matching the certops_agents column default.
        contactGroupId:
          type: string
          nullable: true
          description: Contact group to copy onto the agent record created when this token is consumed. Null means "use the workspace default contact group".
    CertOpsAgentBootstrapTokenListResponse:
      type: object
      additionalProperties: false
      required: [items, pagination]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CertOpsAgentBootstrapToken"
        pagination:
          $ref: "#/components/schemas/CertOpsUnboundedListPagination"
    CertOpsAgentBootstrapTokenCreateRequest:
      type: object
      additionalProperties: false
      required: [name, expiresAt]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
          description: Public label. Must not contain a raw ttboot_/ttagent_ credential, token hash, bearer credential, or private-key material.
        expiresAt:
          type: string
          format: date-time
          description: Required. Must be in the future and within 30 days of creation.
        downtimeAlertsEnabled:
          type: boolean
          description: Whether the agent registered with this token should have downtime alerts enabled. Defaults to true.
        contactGroupId:
          type: string
          nullable: true
          description: Contact group for the agent's downtime alerts. Validated against the workspace's configured contact groups; null uses the workspace default.
    CertOpsAgentBootstrapTokenCreateResponse:
      type: object
      additionalProperties: false
      description: Bootstrap-token creation response. plaintextToken is returned once at creation only; only the hash is persisted, so it can never be shown again.
      required: [token, plaintextToken]
      properties:
        token:
          $ref: "#/components/schemas/CertOpsAgentBootstrapToken"
        plaintextToken:
          type: string
          pattern: "^ttboot_[a-f0-9]{16}_[a-f0-9]{64}$"
          description: One-time plaintext bootstrap token shown only by the create response.
    CertOpsAgentBootstrapTokenRevokeResponse:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          $ref: "#/components/schemas/CertOpsAgentBootstrapToken"
    CertOpsWorkspaceAgent:
      type: object
      additionalProperties: false
      description: Public agent fleet metadata. Credential hashes and bearer credentials never leave the service layer.
      required:
        - id
        - agentId
        - agentVersion
        - protocolVersion
        - status
        - createdAt
      properties:
        id:
          type: string
          format: uuid
          description: Internal agent record id used by the retire route.
        agentId:
          type: string
          description: Stable protocol-level agent identifier.
        name:
          type: string
          nullable: true
        hostname:
          type: string
          nullable: true
        platform:
          type: string
          nullable: true
          description: Raw `process.platform` value reported at registration (e.g. win32, linux, darwin). The dashboard maps this to a friendly OS label; unrecognized values render as-is rather than falling back to a placeholder.
        agentVersion:
          type: string
        protocolVersion:
          type: string
        status:
          type: string
          enum: [active, offline, retired]
        agentKind:
          type: string
          enum: [normal, diagnostic]
          description: Server-assigned at creation and never client-settable. A "diagnostic" agent can only ever be offered protocol_smoke jobs, regardless of what it declares in its capabilities (ADR-0012 decision 7).
        lastSeenAt:
          type: string
          format: date-time
          nullable: true
        clockOffsetMs:
          type: integer
          nullable: true
        livenessState:
          type: string
          nullable: true
          enum: [live, stale, retired, null]
          description: Computed live on every read from the same 10-minute offline threshold the worker's stale-agent sweep uses (agentLiveness.js), so this can catch an agent that stopped heartbeating before the next sweep persists `status = 'offline'`. Distinct from `status`, which only changes on the agent's own heartbeat/claim calls or the periodic sweep.
        downtimeAlertsEnabled:
          type: boolean
          description: Whether an agent_health down/recovered alert is sent when this agent crosses the 10-minute offline threshold. Defaults to true for every agent, including agents registered before this setting existed.
        contactGroupId:
          type: string
          nullable: true
          description: Contact group used for this agent's downtime alerts. Null means "use the workspace default contact group".
        dependentAutoRenewCertificateCount:
          type: integer
          minimum: 0
          description: >-
            Number of auto-renew certificates whose renewal path currently
            depends on this agent (as either the sole required executor or a
            redundant one) - NOT a count of every certificate this agent has
            ever observed. Present on the agent-list response only.
        createdAt:
          type: string
          format: date-time
        retiredAt:
          type: string
          format: date-time
          nullable: true
        retireReason:
          type: string
          nullable: true
    CertOpsWorkspaceAgentListResponse:
      type: object
      additionalProperties: false
      required: [items, pagination]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CertOpsWorkspaceAgent"
        pagination:
          $ref: "#/components/schemas/CertOpsUnboundedListPagination"
    CertOpsWorkspaceAgentRetireRequest:
      type: object
      additionalProperties: false
      properties:
        force:
          type: boolean
          default: false
          description: Retire even when the agent holds actively leased jobs. Requires reason.
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: Attributable justification. Required exactly when force is true; recorded in audit metadata after generic-secret redaction.
    CertOpsWorkspaceAgentRetireResponse:
      type: object
      additionalProperties: false
      required: [agent]
      properties:
        agent:
          $ref: "#/components/schemas/CertOpsWorkspaceAgent"
    CertOpsDiagnosticBootstrapRequest:
      type: object
      additionalProperties: false
      required: [requestId]
      properties:
        requestId:
          type: string
          minLength: 1
          maxLength: 128
          description: Caller-chosen idempotency key. The same requestId can only ever succeed once; every retry after the first fails with diagnostic_bootstrap_already_consumed rather than replaying the original agent/credential/job.
    CertOpsDiagnosticBootstrapResponse:
      type: object
      additionalProperties: false
      required: [agentId, credential, protocolVersion, job]
      properties:
        agentId:
          type: string
          description: Stable protocol-level agent identifier for the new diagnostic agent.
        credential:
          type: string
          description: Plaintext bearer credential for the diagnostic agent. Returned exactly once; the server stores only its hash and cannot recover it later.
        protocolVersion:
          type: string
        signingKeyId:
          type: string
          nullable: true
        signingPublicKeyPem:
          type: string
          nullable: true
        job:
          type: object
          additionalProperties: false
          required: [id, operation, mode, status]
          properties:
            id:
              type: string
            operation:
              type: string
              enum: [protocol_smoke]
            mode:
              type: string
              enum: [dry_run]
            status:
              type: string
    CertOpsAgentProtocolEnvelope:
      type: object
      description: Agent-protocol message envelope. Mirrors packages/contracts/certops/agent-protocol.schema.json (the authoritative schema, additionalProperties false there); the per-messageType body is constrained in the operation-specific request schemas below. Messages never carry private key material.
      required:
        - schemaVersion
        - protocolVersion
        - messageType
        - agentId
        - sentAt
      properties:
        schemaVersion:
          type: integer
          enum: [1]
        protocolVersion:
          type: string
          minLength: 1
          maxLength: 32
          pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"
          description: Agent protocol semver the agent speaks (version negotiation).
        messageType:
          type: string
          enum: [register, heartbeat, claim, result, evidence]
        agentId:
          type: string
          minLength: 1
          maxLength: 128
          pattern: "^[A-Za-z0-9_.:-]+$"
          description: Stable agent identifier. For messageType register this is a client-generated candidate id echoed back by the control plane.
        workspaceId:
          type: string
          format: uuid
          nullable: true
        sentAt:
          type: string
          format: date-time
        clockOffsetMs:
          type: integer
          nullable: true
          description: Agent-reported offset vs control-plane time, used for clock-drift detection.
        body:
          type: object
          nullable: true
          description: Message-type-specific payload; see the operation-specific request schemas.
    CertOpsAgentRegisterRequest:
      allOf:
        - $ref: "#/components/schemas/CertOpsAgentProtocolEnvelope"
        - type: object
          required: [body]
          properties:
            messageType:
              type: string
              enum: [register]
            body:
              type: object
              description: agent-protocol registerBody. The raw bootstrap token travels as the bearer credential, never as a body field; bootstrapTokenId is an opaque non-secret correlation reference.
              required: [bootstrapTokenId, agentVersion]
              properties:
                bootstrapTokenId:
                  type: string
                  minLength: 1
                  maxLength: 128
                  pattern: "^[A-Za-z0-9_.:-]+$"
                agentVersion:
                  type: string
                  minLength: 1
                  maxLength: 32
                hostname:
                  type: string
                  maxLength: 255
                  nullable: true
                platform:
                  type: string
                  enum: [linux, darwin, win32]
                  nullable: true
                nodeVersion:
                  type: string
                  maxLength: 32
                  nullable: true
                declaredTargetSelectors:
                  type: array
                  maxItems: 64
                  items:
                    type: string
                    minLength: 1
                    maxLength: 256
                declaredCommandProfileNames:
                  type: array
                  maxItems: 64
                  items:
                    type: string
                    minLength: 1
                    maxLength: 128
                    pattern: "^[A-Za-z0-9_.:-]+$"
    CertOpsAgentRegisterResponse:
      type: object
      description: Registration result. credential is the raw per-agent bearer credential, returned exactly once and never retrievable again. signingPublicKeyPem is PUBLIC key material only.
      required: [agentId, credential, protocolVersion]
      properties:
        agentId:
          type: string
          description: Control-plane-confirmed agent identifier (source of truth after registration).
        credential:
          type: string
          description: Raw per-agent credential (ttagent_ prefix), shown exactly once.
        protocolVersion:
          type: string
          description: Negotiated agent protocol version recorded for this agent.
        signingKeyId:
          type: string
          nullable: true
          description: Active job-signing key id for signature pinning.
        signingPublicKeyPem:
          type: string
          nullable: true
          description: Active Ed25519 job-signing PUBLIC key (PEM). Never private material.
    CertOpsAgentHeartbeatRequest:
      allOf:
        - $ref: "#/components/schemas/CertOpsAgentProtocolEnvelope"
        - type: object
          required: [body]
          properties:
            messageType:
              type: string
              enum: [heartbeat]
            body:
              type: object
              description: agent-protocol heartbeatBody.
              required: [agentVersion]
              properties:
                agentVersion:
                  type: string
                  minLength: 1
                  maxLength: 32
                ntpSynced:
                  type: boolean
                  nullable: true
                uptimeSeconds:
                  type: integer
                  minimum: 0
                  nullable: true
                pinnedSigningKeyId:
                  type: string
                  maxLength: 128
                  pattern: "^[A-Za-z0-9_.:-]+$"
                  nullable: true
    CertOpsAgentHeartbeatResponse:
      type: object
      description: Heartbeat acknowledgment with the active job-signing key announcement so agents can detect rotation overlap.
      required: [ok, status, lastSeenAt]
      properties:
        ok:
          type: boolean
        status:
          type: string
          description: Agent status after the heartbeat (an offline agent that calls in flips back to active).
        lastSeenAt:
          type: string
          format: date-time
        signingKeyId:
          type: string
          nullable: true
        signingPublicKeyPem:
          type: string
          nullable: true
          description: Active Ed25519 job-signing PUBLIC key (PEM). Never private material.
    CertOpsAgentClaimRequest:
      allOf:
        - $ref: "#/components/schemas/CertOpsAgentProtocolEnvelope"
        - type: object
          properties:
            messageType:
              type: string
              enum: [claim]
            body:
              type: object
              nullable: true
              description: agent-protocol claimBody; poll preferences only, never a specific job selection.
              properties:
                maxJobs:
                  type: integer
                  minimum: 1
                  maximum: 16
                  default: 1
                supportedActions:
                  type: array
                  maxItems: 16
                  items:
                    type: string
                    enum: [renew, deploy, reload, revoke, noop, protocol_smoke]
    CertOpsAgentClaimResponse:
      type: object
      description: Signed claimed jobs. Each job is the signed dispatch payload the agent verifies before execution.
      required: [jobs]
      properties:
        jobs:
          type: array
          items:
            type: object
            additionalProperties: true
            description: Job-payload fields (job-payload.schema.json) plus jobId, workspaceId, action, claimId, attemptId, leaseExpiresAt, attemptCount, and the Ed25519 dispatch-integrity fields below.
            required:
              - jobId
              - nonce
              - issuedAt
              - expiresAt
              - signingKeyId
              - signature
            properties:
              jobId:
                type: string
              workspaceId:
                type: string
                format: uuid
              action:
                type: string
              claimId:
                type: string
                description: Claim identifier the agent must echo back with the result (ownership re-proof).
              attemptId:
                type: string
                description: Server-assigned attempt id mirroring claimId, so a schema-minimal result report (attemptId only) still re-proves claim ownership.
              leaseExpiresAt:
                type: string
                format: date-time
              attemptCount:
                type: integer
              nonce:
                type: string
                description: Single-use dispatch nonce consumed when the result is reported (replay ledger).
              issuedAt:
                type: string
                format: date-time
              expiresAt:
                type: string
                format: date-time
              signingKeyId:
                type: string
              signature:
                type: string
                description: Base64 Ed25519 signature over the canonical job payload (excluding this field).
    CertOpsAgentLeaseRequest:
      type: object
      additionalProperties: false
      required: [claimId]
      description: Lean lease-renew body (not an agent-protocol envelope). See COORDINATION-B6.md.
      properties:
        claimId:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[A-Za-z0-9_.:-]+$'
          description: Claim id from the signed dispatch payload.
        sequence:
          type: integer
          minimum: 1
          description: Optional per-agent monotonic sequence (same semantics as heartbeat/claim/result).
    CertOpsAgentLeaseResponse:
      type: object
      additionalProperties: false
      required: [ok, jobId, status, claimId, leaseExpiresAt]
      properties:
        ok:
          type: boolean
          enum: [true]
        jobId:
          type: string
        status:
          type: string
          enum: [running]
        claimId:
          type: string
        leaseExpiresAt:
          type: string
          format: date-time
        leaseRenewedAt:
          type: string
          format: date-time
          nullable: true
        nonceExpiresAt:
          type: string
          format: date-time
          nullable: true
          description: Extended dispatch-nonce expiry after this renew (B7).
    CertOpsAgentResultRequest:
      allOf:
        - $ref: "#/components/schemas/CertOpsAgentProtocolEnvelope"
        - type: object
          required: [body]
          properties:
            messageType:
              type: string
              enum: [result, evidence]
              description: The server dispatches on the envelope messageType; this route accepts both result and evidence messages.
            body:
              type: object
              description: agent-protocol resultBody (jobId, attemptId, status required; claimId/nonce ride alongside for ownership re-proof and single-use nonce consumption) or evidenceBody (evidenceItems required; jobId required by this route because evidence persistence is job-scoped).
              properties:
                jobId:
                  type: string
                  maxLength: 128
                  pattern: "^[A-Za-z0-9_.:-]+$"
                attemptId:
                  type: string
                  maxLength: 128
                  pattern: "^[A-Za-z0-9_.:-]+$"
                  description: Result messages only. Doubles as the claimId when claimId is omitted.
                status:
                  type: string
                  enum: [succeeded, failed, rejected, blocked, dry_run_complete, orphaned_unknown_effect]
                  description: Result messages only.
                rejectionReason:
                  type: string
                  nullable: true
                  enum:
                    - job_integrity_failed
                    - job_replay_rejected
                    - target_out_of_scope
                    - command_not_allowlisted
                    - path_not_allowlisted
                    - ca_endpoint_not_allowlisted
                    - dns_zone_not_allowlisted
                    - dns_provider_not_allowlisted
                    - key_export_requested
                    - clock_drift_suspected
                keyRotated:
                  type: boolean
                  nullable: true
                errorMessage:
                  type: string
                  maxLength: 1024
                  nullable: true
                claimId:
                  type: string
                  maxLength: 128
                nonce:
                  type: string
                  maxLength: 128
                  description: Single-use dispatch nonce from the signed job payload.
                evidenceItems:
                  type: array
                  minItems: 1
                  maxItems: 16
                  description: Evidence messages only.
                  items:
                    type: object
                    required: [eventType, observedAt]
                    properties:
                      eventType:
                        type: string
                        enum:
                          - certificate.observed
                          - deployment.checked
                          - deployment.updated
                          - validation.passed
                          - validation.failed
                          - policy.checked
                      observedAt:
                        type: string
                        format: date-time
                      fingerprintSha256:
                        type: string
                        pattern: "^[a-f0-9]{64}$"
                        nullable: true
                      summary:
                        type: string
                        maxLength: 1024
                        nullable: true
                      metadata:
                        type: array
                        maxItems: 32
                        items:
                          type: object
                          required: [name, value]
                          properties:
                            name:
                              type: string
                            value:
                              nullable: true
    CertOpsAgentResultResponse:
      type: object
      description: Acknowledgment. Result messages return ok/jobId/status/errorCode/completedAt after the terminal transition; evidence messages return ok/evidenceCount.
      required: [ok]
      properties:
        ok:
          type: boolean
        jobId:
          type: string
          description: Result messages only.
        status:
          type: string
          description: Terminal job status after ingestion (result messages only).
        errorCode:
          type: string
          nullable: true
          description: Persisted error_code for terminal failures (result messages only).
        completedAt:
          type: string
          format: date-time
          nullable: true
          description: Result messages only.
        evidenceCount:
          type: integer
          description: Number of evidence items appended (evidence messages only).
