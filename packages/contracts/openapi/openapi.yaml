  /api/v1/certops/executor/observations:
    post:
      tags: [CertOps Controller]
      summary: Report a public cert-manager observation
      operationId: createCertOpsControllerObservation
      description: >-
        Additive controller transport, not the agent protocol. Requires
        `certops:observations:write` and a token immutable controllerClusterId
        binding. Workspace and cluster provenance are derived from that token;
        body values must match. Private material is audited and rejected before
        rollout, extension, or scope denial. The passive route remains available
        while a workspace is paused. Idempotency is semantic and excludes only
        retry diagnostic observationId and observedAt fields.
      security:
        - certOpsTokenAuth: []
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
            pattern: "^[a-f0-9]{64}$"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CertOpsControllerObservationRequest"
      responses:
        "201":
          description: Observation accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CertOpsControllerObservationResponse"
        "200":
          description: Exact idempotent replay
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CertOpsControllerObservationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >-
            Idempotency key conflicts with a different semantic observation
            (CERTOPS_CONTROLLER_OBSERVATION_CONFLICT)
        "422":
          description: Request rejected because it contained private key material
        "429":
          description: CertOps machine-token rate limit exceeded
        "500":
          description: >-
            Observation could not be persisted after acceptance
            (CERTOPS_CONTROLLER_OBSERVATION_PERSIST_FAILED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Security audit sink unavailable while rejecting private material
  /api/v1/certops/executor/provisioning-commands/next:
    post:
      tags: [CertOps Controller]
      summary: Fetch one narrow cert-manager provisioning command
      operationId: nextCertOpsControllerProvisioningCommand
      description: >-
        Controller-specific command transport. Requires exactly
        `certops:provision:execute` and immutable controller cluster binding.
        It is not agent polling or claim protocol. Non-terminal work may be
        redelivered after a bounded throttle; no Secrets or private material are
        returned.
      security:
        - certOpsTokenAuth: []
      responses:
        "200":
          description: One cluster-bound provisioning command
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CertOpsProvisioningCommandResponse" }
        "204": { description: No work assigned to the authenticated cluster }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Workspace CertOps is paused }
        "422": { description: Request rejected because it contained private key material }
        "429": { description: CertOps machine-token rate limit exceeded }
        "500":
          description: >-
            Command dispatch failed after selection
            (CERTOPS_CONTROLLER_PROVISIONING_COMMAND_FAILED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/certops/executor/provisioning-commands/{jobId}/authorize-mutation:
    post:
      tags: [CertOps Controller]
      summary: Reauthorize one controller provisioning mutation
      operationId: authorizeCertOpsControllerProvisioningMutation
      description: >-
        Narrow controller authorization check called immediately before each
        Kubernetes Certificate create or patch. Requires
        `certops:provision:execute`, immutable controller cluster binding, an
        active server-owned provisioning job, the deployment-wide CertOps
        rollout gate, and an unpaused workspace. Retries recheck the same
        authoritative state. This is not an agent claim, lease, heartbeat, or
        agent-protocol operation.
      security:
        - certOpsTokenAuth: []
      parameters:
        - in: path
          name: jobId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Mutation remains authorized immediately before execution }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Workspace paused or command no longer mutation-authorized }
        "422": { description: Request rejected because it contained private key material }
        "429": { description: CertOps machine-token rate limit exceeded }
        "500":
          description: >-
            Reauthorization check failed
            (CERTOPS_CONTROLLER_PROVISIONING_AUTHORIZATION_FAILED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/certops/executor/events:
    post:
      tags: [CertOps Agent]
      summary: Report executor events
      operationId: createCertOpsExecutorEvent
      description: >-
        Aggregate executor ingestion endpoint for normalized job and public
        evidence events. Lifecycle events require `certops:events:write`;
        evidence-bearing events additionally require `certops:evidence:write`.
        The route is hidden with 404 when `certops.enabled` is disabled.
        `eventId` is idempotent within a workspace and job: exact retries return
        202 without repeating logs, evidence, audit rows, or status side effects,
        while a different sanitized envelope using the same key returns 409. Late
        lifecycle events are recorded in the job log but cannot regress or reopen
        a terminal job. Payloads containing private key material are rejected with
        422. Generic secret material in metadata and bounded evidence output is
        redacted to `[REDACTED]` before persistence. Per-job event/evidence routes
        are narrow machine-token aliases that reuse the same hardened ingestion behavior.
      security:
        - certOpsTokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CertOpsExecutorEventRequest"
      responses:
        "202":
          description: Event accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CertOpsExecutorEventAcceptedResponse"
        "400":
          description: >-
            Executor event body failed schema/idempotency validation
            (CERTOPS_EXECUTOR_EVENT_INVALID, CERTOPS_EXECUTOR_EVENT_TYPE_INVALID,
            CERTOPS_EXECUTOR_EVENT_STATUS_MISMATCH, CERTOPS_JOB_STATUS_INVALID,
            or CERTOPS_EVIDENCE_INVALID for evidence-bearing events)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: >-
            Caller lacks the required scope for this event type
            (CERTOPS_API_TOKEN_SCOPE_DENIED), or the token's workspace does not
            match the event's workspaceId (CERTOPS_EXECUTOR_WORKSPACE_MISMATCH)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: Request rejected because it contained private key material
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: Private key material is not accepted in CertOps requests
                code: PRIVATE_KEY_MATERIAL_REJECTED
        "503":
          description: The security audit sink was unavailable while recording a private-key-material rejection. The endpoint fails closed; the original payload is neither persisted nor echoed and no executor-event side effects occur.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: CertOps security audit is temporarily unavailable
                code: CERTOPS_SECURITY_AUDIT_UNAVAILABLE
        "409":
          description: >-
            Executor event idempotency key conflicts with a different
            sanitized payload (CERTOPS_EXECUTOR_EVENT_CONFLICT); the event
            conflicts with the job's current status
            (CERTOPS_JOB_STATUS_TRANSITION_INVALID); or a terminal status
            does not match the job's mode, e.g. a dry_run job completing as
            succeeded instead of dry_run_complete (CERTOPS_JOB_MODE_TERMINAL_INVALID);
            or the job is currently claimed by a CertOps agent and the event
            carries a terminal status (CERTOPS_EXECUTOR_JOB_AGENT_CLAIMED). The
            executor and agent lanes share one certificate_jobs table but the
            executor lane holds no lease, so allowing an executor token to end a
            job an agent is still executing would land the agent's side effects
            against a terminal row.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: Executor event idempotency key conflicts with a different payload
                code: CERTOPS_EXECUTOR_EVENT_CONFLICT
        "413":
          description: The executor event body exceeded the dedicated 4 MiB pre-auth boundary (`CERTOPS_EXECUTOR_EVENT_BODY_TOO_LARGE`), or normalized evidence output exceeded 65,536 UTF-8 bytes (`CERTOPS_EVIDENCE_OUTPUT_TOO_LARGE`). The payload is not echoed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: CertOps evidence output is too large
                code: CERTOPS_EVIDENCE_OUTPUT_TOO_LARGE
        "429":
          description: The exact-path executor pre-auth or authenticated machine-token limiter rejected the request. The response never includes bearer-token material or request content.
          headers:
            Retry-After:
              description: Seconds until the caller may retry.
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ErrorResponse"
                  - type: object
                    required: [retryAfterSeconds]
                    properties:
                      retryAfterSeconds:
                        type: integer
                        minimum: 1
              example:
                error: CertOps machine-token rate limit exceeded
                code: CERTOPS_MACHINE_RATE_LIMITED
                retryAfterSeconds: 60
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/certops/agent/register:
    post:
      tags: [CertOps Agent]
      summary: Register an agent
      operationId: createCertOpsAgentRegistration
      description: >-
        Outbound-only agent enrollment using a single-use, hashed, expiring
        bootstrap token (bearer); registration returns the per-agent
        credential exactly once, together with the active job-signing public
        key. Request body is the agent-protocol envelope with messageType
        register (packages/contracts/certops/agent-protocol.schema.json,
        additionalProperties false); that schema remains authoritative for
        body shapes. Unknown, expired, used, and revoked bootstrap tokens all
        return the same generic 401 so callers cannot probe token state.
        Private key material is audited and rejected with 422 before rollout
        gating. Hidden with 404 while certops.enabled is disabled.
      security:
        - agentBootstrapTokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CertOpsAgentRegisterRequest"
      responses:
        "201":
          description: Agent registered; the credential is shown exactly once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CertOpsAgentRegisterResponse"
        "400":
          description: Message envelope or register body failed agent-protocol validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "messageType must be register"
                code: CERTOPS_AGENT_MESSAGE_INVALID
        "401":
          description: Generic bootstrap unauthorized (identical body for unknown, expired, used, and revoked tokens; also returned when the registration lost a single-use race)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: CertOps agent bootstrap authentication required
                code: CERTOPS_AGENT_BOOTSTRAP_UNAUTHORIZED
        "404":
          description: CertOps is disabled deployment-wide (route is hidden)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: Endpoint not found
                code: NOT_FOUND
        "409":
          description: An agent with this agentId already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: An agent with this agentId already exists
                code: CERTOPS_AGENT_REGISTRATION_CONFLICT
        "422":
          description: Request rejected because it contained private key material
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: Private key material is not accepted on CertOps agent routes
                code: PRIVATE_KEY_MATERIAL_REJECTED
        "429":
          description: CertOps machine-token rate limit exceeded
        "503":
          description: Security audit sink unavailable while rejecting private material
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/certops/agent/heartbeat:
    post:
      tags: [CertOps Agent]
      summary: Agent heartbeat
      operationId: createCertOpsAgentHeartbeat
      description: >-
        Steady-state heartbeat authenticated with the per-agent credential
        (bearer). Updates last_seen_at, records the envelope clockOffsetMs and
        body ntpSynced/uptimeSeconds/pinnedSigningKeyId for clock-drift and
        key-rotation fleet monitoring, flips an offline agent back to active,
        and announces the active job-signing public key. Request body is the
        agent-protocol envelope with messageType heartbeat
        (packages/contracts/certops/agent-protocol.schema.json,
        additionalProperties false). A retired agent authenticates but
        receives 410 without any last_seen_at update. Private key material is
        audited and rejected with 422. Hidden with 404 while certops.enabled
        is disabled.
      security:
        - agentCredentialAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CertOpsAgentHeartbeatRequest"
      responses:
        "200":
          description: Heartbeat accepted with signing key announcement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CertOpsAgentHeartbeatResponse"
        "400":
          description: Message envelope or heartbeat body failed agent-protocol validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "messageType must be heartbeat"
                code: CERTOPS_AGENT_MESSAGE_INVALID
        "401":
          description: Per-agent credential missing, unknown, or revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: CertOps agent authentication required
                code: CERTOPS_AGENT_UNAUTHORIZED
        "404":
          description: CertOps is disabled deployment-wide (route is hidden)
        "409":
          description: Message sequence is not greater than the last accepted sequence for this agent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: Message sequence is not greater than the last accepted sequence for this agent
                code: CERTOPS_AGENT_SEQUENCE_REGRESSION
        "410":
          description: Agent is retired; last_seen_at is not updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: CertOps agent is retired
                code: CERTOPS_AGENT_RETIRED
        "422":
          description: Request rejected because it contained private key material
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: Private key material is not accepted on CertOps agent routes
                code: PRIVATE_KEY_MATERIAL_REJECTED
        "429":
          description: CertOps machine-token rate limit exceeded
        "503":
          description: Security audit sink unavailable while rejecting private material
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/certops/agent/jobs/claim:
    post:
      tags: [CertOps Agent]
      summary: Claim pending jobs
      operationId: createCertOpsAgentJobClaim
      description: >-
        Outbound-only claim poll authenticated with the per-agent
        credential (bearer). Request body is the agent-protocol envelope with
        messageType claim (packages/contracts/certops/agent-protocol.schema.json,
        additionalProperties false); the body only expresses poll preferences
        (maxJobs, supportedActions), never a specific job selection. Server
        selects pending workspace jobs with FOR UPDATE SKIP LOCKED, leases
        them, and returns signed dispatch payloads: job-payload fields plus
        claimId, leaseExpiresAt, attemptCount, and the Ed25519 dispatch
        fields nonce, issuedAt, expiresAt, signingKeyId, signature. Dispatch
        is blocked while the workspace kill switch is on (409
        CERTOPS_WORKSPACE_PAUSED); results reporting never is. A retired
        agent receives 410. Hidden with 404 while certops.enabled is
        disabled.
      security:
        - agentCredentialAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CertOpsAgentClaimRequest"
      responses:
        "200":
          description: Zero or more signed claimed jobs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CertOpsAgentClaimResponse"
        "400":
          description: Message envelope or claim body failed agent-protocol validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "messageType must be claim"
                code: CERTOPS_AGENT_MESSAGE_INVALID
        "401":
          description: Per-agent credential missing, unknown, or revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: CertOps agent authentication required
                code: CERTOPS_AGENT_UNAUTHORIZED
        "404":
          description: CertOps is disabled deployment-wide (route is hidden)
        "409":
          description: >-
            Workspace CertOps is paused (CERTOPS_WORKSPACE_PAUSED); message
            sequence regression (CERTOPS_AGENT_SEQUENCE_REGRESSION); agent
            blocked by compatibility policy (CERTOPS_AGENT_COMPATIBILITY_BLOCKED);
            or the deploy public certificate is unavailable
            (CERTOPS_AGENT_DEPLOY_CERT_UNAVAILABLE)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: CertOps is paused for this workspace
                code: CERTOPS_WORKSPACE_PAUSED
        "410":
          description: Agent is retired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: CertOps agent is retired
                code: CERTOPS_AGENT_RETIRED
        "422":
          description: Request rejected because it contained private key material
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: Private key material is not accepted on CertOps agent routes
                code: PRIVATE_KEY_MATERIAL_REJECTED
        "429":
          description: CertOps machine-token rate limit exceeded
        "503":
          description: Security audit sink unavailable while rejecting private material
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/certops/agent/jobs/{jobId}/lease:
    post:
      tags: [CertOps Agent]
      summary: Renew a claimed job lease
      operationId: renewCertOpsAgentJobLease
      description: >-
        Re-proves claim ownership (authenticated agent + claimId), transitions
        claimed→running on first renew, extends lease_expires_at, stamps
        lease_renewed_at, and extends the still-open dispatch nonce so late
        results remain reportable through the reaper hard-grace window. The
        agent must call this before each external side effect (ACME/DNS/deploy/
        reload). See COORDINATION-B6.md. Not an agent-protocol envelope
        messageType: lean JSON body with claimId and optional sequence.
      security:
        - agentCredentialAuth: []
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
            pattern: '^[A-Za-z0-9_.:-]+$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CertOpsAgentLeaseRequest"
      responses:
        "200":
          description: Lease renewed; job is running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CertOpsAgentLeaseResponse"
        "400":
          description: Lease body invalid or job not in a renewable state (CERTOPS_AGENT_MESSAGE_INVALID or CERTOPS_AGENT_LEASE_INVALID)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: claimId is invalid
                code: CERTOPS_AGENT_MESSAGE_INVALID
        "401":
          description: Per-agent credential missing, unknown, or revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: CertOps agent authentication required
                code: CERTOPS_AGENT_UNAUTHORIZED
        "404":
          description: Job not found, or CertOps is disabled deployment-wide
        "409":
          description: >-
            Claim ownership mismatch (CERTOPS_AGENT_CLAIM_OWNERSHIP_MISMATCH)
            or sequence regression (CERTOPS_AGENT_SEQUENCE_REGRESSION)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: Lease renew does not match the current claim for this job
                code: CERTOPS_AGENT_CLAIM_OWNERSHIP_MISMATCH
        "410":
          description: Agent is retired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: CertOps agent is retired
                code: CERTOPS_AGENT_RETIRED
        "422":
          description: Request rejected because it contained private key material
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: Private key material is not accepted on CertOps agent routes
                code: PRIVATE_KEY_MATERIAL_REJECTED
        "429":
          description: CertOps machine-token rate limit exceeded
        "503":
          description: Security audit sink unavailable while rejecting private material
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/certops/agent/jobs/results:
    post:
      tags: [CertOps Agent]
      summary: Report job results and evidence
      operationId: createCertOpsAgentJobResult
      description: >-
        Result/evidence ingestion authenticated with the per-agent
        credential (bearer). Request body is the agent-protocol envelope with
        messageType result or evidence, dispatched on the envelope
        messageType (packages/contracts/certops/agent-protocol.schema.json,
        additionalProperties false). Result ingestion re-proves claim
        ownership (agent + claimId, where attemptId doubles as the claimId),
        consumes the single-use dispatch nonce (replay ledger), and
        transitions the job terminally in one transaction. Evidence messages
        append job-scoped public evidence without any job transition. The
        workspace kill switch never blocks results. A retired agent receives
        410. Payloads containing private key material are rejected with 422.
        Hidden with 404 while certops.enabled is disabled.
      security:
        - agentCredentialAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CertOpsAgentResultRequest"
      responses:
        "200":
          description: Result acknowledged (jobId/status/errorCode/completedAt) or evidence appended (ok/evidenceCount)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CertOpsAgentResultResponse"
        "400":
          description: Invalid envelope, body, or result status (CERTOPS_AGENT_MESSAGE_INVALID or CERTOPS_AGENT_RESULT_STATUS_INVALID)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: Result status is invalid
                code: CERTOPS_AGENT_RESULT_STATUS_INVALID
        "401":
          description: Per-agent credential missing, unknown, or revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: CertOps agent authentication required
                code: CERTOPS_AGENT_UNAUTHORIZED
        "404":
          description: Certificate job not found (CERTOPS_AGENT_JOB_NOT_FOUND), or CertOps disabled deployment-wide (NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: Certificate job not found
                code: CERTOPS_AGENT_JOB_NOT_FOUND
        "409":
          description: Claim ownership mismatch (CERTOPS_AGENT_CLAIM_OWNERSHIP_MISMATCH) or single-use nonce rejected/replayed (CERTOPS_AGENT_RESULT_NONCE_REJECTED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: Result nonce was rejected
                code: CERTOPS_AGENT_RESULT_NONCE_REJECTED
        "410":
          description: Agent is retired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: CertOps agent is retired
                code: CERTOPS_AGENT_RETIRED
        "422":
          description: Request rejected because it contained private key material
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: Private key material is not accepted on CertOps agent routes
                code: PRIVATE_KEY_MATERIAL_REJECTED
        "429":
          description: CertOps machine-token rate limit exceeded
        "503":
          description: Security audit sink unavailable while rejecting private material
        "500":
          $ref: "#/components/responses/InternalError"
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionId
      description: Session cookie authentication used by authenticated API routes.
    certOpsTokenAuth:
      type: http
      scheme: bearer
      description: Scoped CertOps API token (bearer) used by machine routes. Allowed scopes are certops:read, certops:events:write, certops:jobs:read, and certops:evidence:write. certops:read implies certops:jobs:read only, never a write scope. Bearer-only and non-cookie; CSRF-exempt only for the exact planned POST machine routes. Empty required-scope configuration is invalid.
    agentBootstrapTokenAuth:
      type: http
      scheme: bearer
      description: Single-use, hashed, expiring bootstrap enrollment token used only by POST /api/v1/certops/agent/register. Exchanged for a per-agent credential at registration.
    agentCredentialAuth:
      type: http
      scheme: bearer
      description: Per-agent credential (bearer) issued at registration, used for agent heartbeat, job claim, and result/evidence calls. CSRF-exempt. Not valid for registration.
  parameters:
    workspaceIdParam:
      in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid
    tokenIdParam:
      in: path
      name: id
      required: true
      schema:
        type: integer
    userIdParam:
      in: path
      name: userId
      required: true
      schema:
        type: integer
    tokenParam:
      in: path
      name: token
      required: true
      schema:
        type: string
    limitParam:
      in: query
      name: limit
      schema:
        type: integer
        minimum: 1
    offsetParam:
      in: query
      name: offset
      schema:
        type: integer
        minimum: 0
    certOpsReadLimitParam:
      in: query
      name: limit
      description: >-
        Number of items returned. Defaults to 50 when omitted or nonnumeric,
        is limited to 100, and values below 1 are normalized to 1.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    certOpsReadOffsetParam:
      in: query
      name: offset
      description: >-
        Number of items skipped before the page begins. Defaults to 0 when
        omitted or nonnumeric; negative values are normalized to 0.
      schema:
        type: integer
        minimum: 0
        default: 0
    certOpsUnboundedListLimitParam:
      in: query
      name: limit
      description: >-
        Number of items returned, capped at 100. Omitting this parameter returns
        every row in the workspace; there is no implicit page size. A default
        here would page a list that has no paging control, hiding rows from an
        audit with nothing on screen to reveal them.
      schema:
        type: integer
        minimum: 1
        maximum: 100
    certOpsCertificateStatusFilterParam:
      in: query
      name: status
      description: >-
        Restricts the page and its total to one inventory status. A value outside
        the set is rejected with 400 rather than answered with an empty page.
      schema:
        type: string
        enum:
          - discovered
          - provisioning
          - active
          - renewing
          - expiring
          - expired
          - revoked
          - decommissioned
    certOpsCertificateSourceFilterParam:
      in: query
      name: source
      description: >-
        Restricts the page and its total to one discovery or registration source.
        A value outside the set is rejected with 400.
      schema:
        type: string
        enum:
          - manual
          - api
          - import
          - domain_checker
          - endpoint_monitor
          - integration
          - auto_sync
          - cert_manager
          - agent_filesystem
          - agent_issuance
    certOpsCertificateNoRenewalProfileParam:
      in: query
      name: noRenewalProfile
      description: >-
        true selects certificates with no renewal profile attached; false selects
        those with one. This is one of three independent renewal facts, kept
        separate because each has a different remedy and none of them alone means
        a certificate will renew.
      schema:
        type: boolean
    certOpsCertificateRenewalDisabledParam:
      in: query
      name: renewalDisabled
      description: >-
        true selects certificates whose attached profile is disabled or archived,
        an operator decision that is reversible from the profile controls.
      schema:
        type: boolean
    certOpsCertificateKeyNotAgentDeployableParam:
      in: query
      name: keyNotAgentDeployable
      description: >-
        true selects certificates whose key custody is not agent-deployable,
        unknown custody included: no agent holds the private key, so renewal is
        impossible regardless of any profile.
      schema:
        type: boolean
    certOpsCertificateExcludeRetiredParam:
      in: query
      name: excludeRetired
      description: >-
        true excludes certificates in a retired lifecycle status (revoked or
        decommissioned) from the page and its total. Omitted or false returns
        every status, which is what index-building callers (e.g. the token
        detail panel) need since a retired certificate's page must still
        resolve.
      schema:
        type: boolean
    auditSinceParam:
      in: query
      name: since
      description: >-
        Lower bound for occurred_at filtering. Accepts ISO 8601 UTC (recommended),
        YYYY-MM-DD (start of day), or a datetime without timezone
        (YYYY-MM-DDTHH:mm, optional seconds).
      schema:
        type: string
        example: "2026-06-04"
    auditUntilParam:
      in: query
      name: until
      description: >-
        Upper bound for occurred_at filtering. Accepts ISO 8601 UTC (recommended),
        YYYY-MM-DD (end of day), or a datetime without timezone
        (YYYY-MM-DDTHH:mm, optional seconds).
      schema:
        type: string
        example: "2026-06-04"
  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    CertOpsRenewalProfile:
      type: object
      additionalProperties: false
      required: [id, name, status, autoRenewEnabled, editableFields]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        status:
          type: string
          description: Lifecycle status. 'disabled' and 'archived' both stop automatic renewal.
          enum: [active, disabled, archived]
        source:
          type: string
          nullable: true
        autoRenewEnabled:
          type: boolean
          description: Convenience view of status. False means the scheduler will not renew certificates on this profile.
        renewBeforeDays:
          type: integer
          nullable: true
          description: Lead time before expiry. Null means the deployment-wide threshold applies.
        keyMode:
          type: string
          nullable: true
        renewalProfile:
          type: object
          nullable: true
          additionalProperties: true
          description: |
            The stored execution contract. Exposed in full because an operator
            needs to see where a renewal deploys in order to trust it; every
            field is non-secret by the zero-custody rule (no key material, and
            CA/EAB references are opaque identifiers).
        derived:
          type: boolean
          description: True when the profile was generated automatically from a successful issuance rather than authored by hand.
        derivedFrom:
          type: object
          nullable: true
          additionalProperties: true
        certificateCount:
          type: integer
          description: Number of managed certificates currently linked to this profile.
        editableFields:
          type: array
          description: |
            The renewalProfile fields this API permits changing. Travels with the
            record so a client renders the same boundary the server enforces.
          items:
            type: string
        createdAt:
          type: string
          format: date-time
          nullable: true
        updatedAt:
          type: string
          format: date-time
          nullable: true
    CertOpsRenewalProfileList:
      type: object
      additionalProperties: false
      required: [items, total, limit, offset, pagination]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CertOpsRenewalProfile"
        total:
          type: integer
          deprecated: true
          description: Read pagination.total instead. Retained for shipped clients.
        limit:
          type: integer
          deprecated: true
          description: Read pagination.limit instead. Retained for shipped clients.
        offset:
          type: integer
          deprecated: true
          description: Read pagination.offset instead. Retained for shipped clients.
        pagination:
          $ref: "#/components/schemas/CertOpsListPagination"
    CertOpsUpcomingRenewalList:
      type: object
      additionalProperties: false
      required: [items, total, limit, offset, pagination]
      properties:
        items:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [certificateId, commonName, autoRenewEnabled]
            properties:
              certificateId:
                type: string
                format: uuid
              commonName:
                type: string
                nullable: true
              certificateStatus:
                type: string
                nullable: true
                description: Inventory status of the certificate. Non-renewable statuses (revoked, decommissioned) are excluded from this list entirely.
              notAfter:
                type: string
                format: date-time
                nullable: true
              renewsFrom:
                type: string
                format: date-time
                nullable: true
                description: When the scheduler starts attempting this renewal (notAfter minus the effective lead time).
              profileId:
                type: string
                format: uuid
                nullable: true
              profileName:
                type: string
                nullable: true
              autoRenewEnabled:
                type: boolean
                description: True only when the scheduler would actually create a renewal job for this certificate. False whenever anything prevents that, with blockedReason naming the cause.
              blockedReason:
                type: string
                nullable: true
                description: >-
                  Why the scheduler will not renew this certificate, or null when it will.
                  auto_renew_disabled is an operator decision and is reversible from the
                  profile controls; the others are defects that no toggle will fix.
                  not_agent_deployable means no agent holds the private key (typically an
                  externally observed certificate), so renewal is impossible regardless of
                  the profile, and is reported ahead of any profile problem.
                enum:
                  - auto_renew_disabled
                  - no_profile
                  - incomplete_profile
                  - not_agent_deployable
                  - unknown_expiry
              renewBeforeDays:
                type: integer
                description: Effective lead time, falling back to the deployment threshold when the profile does not set one.
              lastRenewJobStatus:
                type: string
                nullable: true
                description: Status of the most recent renewal job for this certificate, if any.
        total:
          type: integer
          deprecated: true
          description: Read pagination.total instead. Retained for shipped clients.
        limit:
          type: integer
          deprecated: true
          description: Read pagination.limit instead. Retained for shipped clients.
        offset:
          type: integer
          deprecated: true
          description: Read pagination.offset instead. Retained for shipped clients.
        pagination:
          $ref: "#/components/schemas/CertOpsListPagination"
    CertOpsListPagination:
      type: object
      additionalProperties: false
      required: [limit, offset, total]
      properties:
        limit:
          type: integer
          minimum: 1
        offset:
          type: integer
          minimum: 0
        total:
          type: integer
          minimum: 0
          description: >-
            Rows matching the request's filters, counted over the same predicate
            as the returned page and ignoring limit and offset. A client knows
            more pages exist when offset + items.length < total.
    CertOpsUnboundedListPagination:
      type: object
      additionalProperties: false
      required: [limit, offset, total]
      properties:
        limit:
          type: integer
          minimum: 1
          nullable: true
          description: >-
            Echo of the requested limit, or null when none was supplied and the
            whole result set was returned.
        offset:
          type: integer
          minimum: 0
        total:
          type: integer
          minimum: 0
          description: >-
            Rows in the workspace, ignoring limit and offset. A client knows more
            pages exist when offset + items.length < total.
    Pagination:
      type: object
      properties:
        limit:
          type: integer
        offset:
          type: integer
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        code:
          type: string
        details:
          oneOf:
            - type: array
              items:
                type: string
            - type: object
              additionalProperties: true
            - type: string
      example:
        error: Invalid request payload
        code: VALIDATION_ERROR
        details:
          - email is required
    CertOpsManagedCertificate:
      type: object
      additionalProperties: false
      description: Public-only CertOps managed certificate inventory record. This schema intentionally excludes private-key custody fields; private key material is rejected at the API boundary.
      required:
        - schemaVersion
        - id
        - workspaceId
        - tokenId
        - profileId
        - status
        - source
        - sourceRef
        - commonName
        - subjectAltNames
        - issuer
        - serialNumber
        - fingerprintSha256
        - spkiFingerprintSha256
        - certificatePem
        - publicKeyAlgorithm
        - publicKeySize
        - signatureAlgorithm
        - notBefore
        - notAfter
        - keyMode
        - keyReference
        - createdAt
        - updatedAt
      properties:
        schemaVersion:
          type: integer
          enum: [1]
        id:
          type: string
          format: uuid
        workspaceId:
          type: string
          format: uuid
        tokenId:
          type: integer
          nullable: true
        profileId:
          type: string
          format: uuid
          nullable: true
        status:
          type: string
          enum:
            - discovered
            - provisioning
            - active
            - renewing
            - expiring
            - expired
            - revoked
            - decommissioned
        source:
          type: string
          nullable: true
          enum:
            - manual
            - api
            - import
            - domain_checker
            - endpoint_monitor
            - integration
            - auto_sync
            - cert_manager
            - null
        sourceRef:
          type: string
          nullable: true
          description: Opaque non-secret source reference.
        commonName:
          type: string
          nullable: true
        subjectAltNames:
          type: array
          items:
            type: string
        issuer:
          type: string
          nullable: true
        serialNumber:
          type: string
          nullable: true
        fingerprintSha256:
          type: string
          nullable: true
          pattern: "^[a-f0-9]{64}$"
          description: Lowercase SHA-256 fingerprint of public certificate material.
        spkiFingerprintSha256:
          type: string
          nullable: true
          pattern: "^[a-f0-9]{64}$"
          description: Lowercase SHA-256 fingerprint of the public SubjectPublicKeyInfo.
        certificatePem:
          type: string
          nullable: true
          description: Public certificate PEM only. Private-key PEM, PFX/PKCS#12, and key-bearing material are rejected.
        publicKeyAlgorithm:
          type: string
          nullable: true
        publicKeySize:
          type: integer
          minimum: 1
          nullable: true
        signatureAlgorithm:
          type: string
          nullable: true
        notBefore:
          type: string
          format: date-time
          nullable: true
        notAfter:
          type: string
          format: date-time
          nullable: true
        keyMode:
          type: string
          nullable: true
          enum:
            - agent-local
            - proxy-agent-local
            - cert-manager-managed
            - appliance-managed
            - hsm-managed
            - vault-managed
            - os-store-managed
            - external-unknown
            - null
          description: Non-secret mode describing where the private key lives outside the control plane.
        keyReference:
          type: string
          nullable: true
          maxLength: 256
          description: Opaque non-secret external reference. Inline secrets, private-key material, PEM markers, and control characters are rejected.
        createdAt:
          type: string
          format: date-time
          nullable: true
        updatedAt:
          type: string
          format: date-time
          nullable: true
        reconciliationReason:
          type: string
          nullable: true
          maxLength: 256
          description: >-
            Machine-readable reason a reconciliation step (issuance promotion
            or post-renewal refresh) could not update this certificate from
            agent evidence, e.g. "no_claim_bound_verify_evidence",
            "verify_evidence_missing_fingerprint",
            "verify_evidence_missing_expiry". Null when the certificate's
            facts are current. Also recorded as a
            CERTOPS_CERTIFICATE_ISSUANCE_UNRECONCILED or
            CERTOPS_CERTIFICATE_RENEWAL_UNRECONCILED audit event when set.
        renewal:
          $ref: "#/components/schemas/CertOpsCertificateRenewalState"
        renewalSetup:
          $ref: "#/components/schemas/CertOpsRenewalSetupState"
        renewalPreflight:
          allOf:
            - $ref: "#/components/schemas/CertOpsRenewalPreflightState"
          description: |
            Present on the certificate detail response only. Lists are paged
            over many certificates and have no use for a per-certificate
            resume action, so the anti-join behind it is not run for them.
        renewalPathState:
          type: string
          nullable: true
          enum:
            - healthy
            - degraded
            - unavailable
            - unknown
            - null
          description: >-
            Derived renewal EXECUTION health: whether a live agent able to run
            this certificate's configured renewal currently exists. A
            SEPARATE axis from `status` (lifecycle) and from `renewal.state`
            above (is auto-renew configured at all) - a certificate can be
            `status: active`, `renewal.state: auto`, and
            `renewalPathState: unavailable` at the same time if the agent
            that would execute the renewal is offline. Null when the
            question does not apply (auto-renew disabled, no renewal
            profile, key custody not agent-deployable, or the certificate is
            retired) rather than a misleading terminal state.
        renewalPathReason:
          type: string
          nullable: true
          enum:
            - all_paths_available
            - partial_location_outage
            - agent_offline
            - all_executors_offline
            - no_execution_target
            - topology_unknown
            - auto_renew_disabled
            - not_agent_deployable
            - no_profile
            - certificate_retired
            - assigned_agent_retired
            - null
          description: Machine-readable reason code for `renewalPathState`.
        renewalPathSummary:
          type: string
          nullable: true
          description: Human-readable one-line explanation of `renewalPathState`, e.g. "The only agent able to renew this certificate is offline."
        dependencies:
          type: array
          description: The resolved set of agents this certificate's renewal path depends on (pinned executor, or every agent declaring the matching deployment-target selector). Empty when `renewalPathState` is null.
          items:
            type: object
            additionalProperties: false
            required: [agentRowId, agentId, required, online]
            properties:
              agentRowId:
                type: string
                description: Internal agent record id (UUID).
              agentId:
                type: string
                nullable: true
                description: Stable protocol-level agent identifier.
              agentName:
                type: string
                nullable: true
              hostname:
                type: string
                nullable: true
              platform:
                type: string
                nullable: true
              required:
                type: boolean
                description: True when this agent is the sole executor (no redundancy); false when it is one of several agents that could equally execute the renewal.
              online:
                type: boolean
                description: Live liveness read using the same 10-minute threshold as the Agent Fleet and the agent-down alert trigger.
    CertOpsCertificateInstance:
      type: object
      additionalProperties: false
      description: >-
        A persistent, historical record of one observed certificate
        location. Rows are never deleted merely because the observing agent
        goes offline - "agent offline" (cannot currently verify) and
        "certificate removed" (a live agent explicitly rescanned and found
        it gone) are deliberately different facts; only the latter ever
        changes `status`.
      required:
        - id
        - workspaceId
        - managedCertificateId
        - targetId
        - status
        - source
        - target
      properties:
        id:
          type: string
          format: uuid
        workspaceId:
          type: string
          format: uuid
        managedCertificateId:
          type: string
          format: uuid
        targetId:
          type: string
          format: uuid
        domainMonitorId:
          type: string
          format: uuid
          nullable: true
        tokenId:
          type: integer
          nullable: true
        status:
          type: string
        source:
          type: string
        sourceRef:
          type: string
          nullable: true
        locationKind:
          type: string
          nullable: true
          enum:
            - filesystem
            - windows_store
            - iis_binding
            - http_sys
            - null
          description: What kind of place this location is. Distinct from `source`, which says who/what reported it. Null on rows written before the generalized observation contract; callers must treat null as unknown unless independent source/reference evidence proves a filesystem location.
        responsibleAgentId:
          type: string
          nullable: true
          description: The protocol-level agentId string of the agent responsible for observing/managing this location, derived server-side from source/sourceRef. Null when no agent owns this location (e.g. cert-manager, domain-checker observations).
        agent:
          type: object
          nullable: true
          additionalProperties: false
          description: >-
            Live connectivity enrichment for `responsibleAgentId`, resolved
            at read time using the same 10-minute liveness threshold as the
            Agent Fleet and the agent-down alert trigger. A SEPARATE axis
            from `status` above (certificate presence, decided by a scan) -
            an offline agent never changes `status`, only this field.
          properties:
            agentId:
              type: string
            name:
              type: string
              nullable: true
            hostname:
              type: string
              nullable: true
            platform:
              type: string
              nullable: true
            livenessState:
              type: string
              enum: [live, stale, retired]
            lastSeenAt:
              type: string
              format: date-time
              nullable: true
        target:
          type: object
          additionalProperties: false
          required:
            - id
            - name
            - targetType
            - hostname
            - locationKind
            - deploymentReference
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            targetType:
              type: string
            hostname:
              type: string
              nullable: true
            locationKind:
              type: string
              nullable: true
              enum:
                - filesystem
                - windows_store
                - iis_binding
                - http_sys
                - null
            deploymentReference:
              type: string
              nullable: true
        observedFingerprintSha256:
          type: string
          pattern: "^[a-f0-9]{64}$"
          nullable: true
        observedSerialNumber:
          type: string
          nullable: true
        observedSubject:
          type: string
          nullable: true
        observedIssuer:
          type: string
          nullable: true
        observedNotBefore:
          type: string
          format: date-time
          nullable: true
        observedNotAfter:
          type: string
          format: date-time
          nullable: true
        deploymentReference:
          type: string
          nullable: true
        observedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
          nullable: true
        updatedAt:
          type: string
          format: date-time
          nullable: true
    CertOpsCertificateRenewalState:
      type: object
      additionalProperties: false
      description: |
        Derived renewal-automation verdict for one certificate, computed from
        the same inputs the renewal scheduler scans with. `auto` is the only
        state in which the scheduler will actually create a renew job; every
        other state names why it will not.
      required:
        - schemaVersion
        - keyMode
        - profileId
        - profileName
        - renewBeforeDays
        - renewsFrom
        - state
        - detail
        - workspacePaused
      properties:
        schemaVersion:
          type: integer
          enum: [1]
        keyMode:
          type: string
          nullable: true
        profileId:
          type: string
          format: uuid
          nullable: true
        profileName:
          type: string
          nullable: true
        renewBeforeDays:
          type: integer
          nullable: true
        renewsFrom:
          type: string
          format: date-time
          nullable: true
          description: When the sweep starts attempting this renewal (notAfter minus the effective lead time). Only set when state is 'auto'.
        state:
          type: string
          enum:
            - auto
            - disabled
            - not-configured
            - not-eligible
            - not-applicable
        detail:
          type: string
          description: Operator-facing explanation of the state.
        workspacePaused:
          type: boolean
          description: |
            True when the workspace's CertOps kill switch is paused, independent
            of `state`. Answers "will this workspace's scheduler act right now",
            a different question from `state`'s "is this profile switched on" -
            a paused workspace can still report `state: auto` because the
            profile itself is genuinely enabled, so callers must check both
            before assuming a certificate will renew unattended.
    CertOpsRenewalSetupState:
      type: object
      additionalProperties: false
      description: |
        Status of the durable profile-derivation intent behind "Set up
        automatic renewal", if one has ever been recorded for this
        certificate. `none` is the ordinary case for a certificate nobody has
        tried to adopt. While `waiting`, the certificate is mid-setup rather
        than genuinely `not-configured`.

        The stored row's own failure text is never exposed: it is a raw
        exception message that can carry driver or constraint detail, so
        `outcomeCode` and `message` are a closed, server-authored vocabulary
        and the raw text stays server-side.
      required:
        - state
        - jobId
        - attempts
        - outcomeCode
        - message
        - intentId
      properties:
        state:
          type: string
          enum:
            - none
            - waiting
            - configured
            - skipped
            - failed
        jobId:
          type: string
          format: uuid
          nullable: true
          description: The renew job the intent was created from.
        attempts:
          type: integer
          minimum: 0
        outcomeCode:
          type: string
          nullable: true
          description: |
            Machine-readable skip or failure reason, never raw error text.
            Set for `skipped` and `failed`, null otherwise.
          enum:
            - already_linked
            - detached
            - dry_run
            - job_never_terminated
            - job_not_found
            - certificate_not_found
            - no_claim_bound_verify_evidence
            - missing_certificate_id
            - missing_job_id
            - profile_operator_owned
            - certificate_link_conflict
            - job_failed
            - job_rejected
            - job_cancelled
            - job_blocked
            - orphaned_unknown_effect
            - renewal_profile_incomplete
            - renewal_profile_invalid
            - derivation_failed
            - unknown
        message:
          type: string
          nullable: true
          description: |
            Operator-facing explanation authored server-side. Set for
            `skipped` and `failed`, null otherwise.
        intentId:
          type: string
          format: uuid
          nullable: true
          description: |
            The outbox event id to pass to the retry route. Non-null only
            while the intent is retryable, so a `skipped` intent (a decision,
            not a failure) never offers one.
    CertOpsRenewalPreflightState:
      type: object
      additionalProperties: false
      description: |
        A completed preflight for this certificate that nothing has been armed
        behind yet, which is what lets the UI offer "Continue setup" after a
        reload. A preflight is an asynchronous dry_run renew job terminating as
        `dry_run_complete`, never `succeeded`, and it is reported here only
        while no adoption intent exists for the certificate.
      required:
        - available
        - jobId
        - completedAt
      properties:
        available:
          type: boolean
        jobId:
          type: string
          format: uuid
          nullable: true
          description: The dry_run job to read the preflight's own result from.
        completedAt:
          type: string
          format: date-time
          nullable: true
    CertOpsRenewalSetupRetryResponse:
      type: object
      additionalProperties: false
      required: [id, eventType, status, attemptCount]
      properties:
        id:
          type: string
          format: uuid
          description: The intent that was reset, matching renewalSetup.intentId.
        eventType:
          type: string
          enum: [profile_derivation_requested]
        status:
          type: string
          enum: [pending]
          description: A reset intent is always returned to the pending queue.
        attemptCount:
          type: integer
          minimum: 0
          description: Zero after a reset, so the retry gets a full attempt budget.
    CertOpsRenewalProfileDetachResponse:
      type: object
      additionalProperties: false
      description: |
        Result of unlinking a certificate from its renewal profile. The profile
        row itself is never deleted, because one profile can cover several
        certificates.
      required: [certificateId, detachedProfileId, invalidatedIntents]
      properties:
        certificateId:
          type: string
          format: uuid
        detachedProfileId:
          type: string
          format: uuid
          nullable: true
          description: The profile the certificate was linked to, for the audit trail.
        invalidatedIntents:
          type: integer
          minimum: 0
          description: |
            Outstanding profile-derivation intents cancelled in the same
            transaction, so a detach cannot be undone by an in-flight setup.
    CertOpsRenewalSetupRequest:
      type: object
      additionalProperties: false
      description: |
        Arms automatic renewal by creating a renew job and, for a real run,
        recording the derivation intent in the same transaction. A dry run is a
        preflight: it records no intent, so it can never configure anything.
      properties:
        dryRun:
          type: boolean
          default: false
          description: Run as a preflight (mode dry_run) instead of arming renewal.
        payload:
          type: object
          additionalProperties: true
          nullable: true
          description: Job payload overrides. Private-key material is rejected.
        assignedAgentId:
          type: string
          format: uuid
          nullable: true
          description: |
            Pin the job to one agent. Left unset, the service pins the agent
            whose discovery recorded the deployment path, since only that host
            has it.
        idempotencyKey:
          type: string
          nullable: true
          maxLength: 200
        requiresApproval:
          type: boolean
          default: false
    CertOpsManagedCertificateListResponse:
      type: object
      additionalProperties: false
      required: [items, pagination]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CertOpsManagedCertificate"
        pagination:
          $ref: "#/components/schemas/CertOpsListPagination"
    CertOpsManagedCertificateDetailResponse:
      type: object
      additionalProperties: false
      required: [certificate]
      properties:
        certificate:
          $ref: "#/components/schemas/CertOpsManagedCertificate"
    CertOpsCertificateRetireRequest:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum:
            - revoked
            - decommissioned
          description: Soft-retire lifecycle status to apply to the managed certificate and linked token.
        reason:
          type: string
          nullable: true
          maxLength: 512
          description: Optional non-secret retirement reason. Private-key material, PEM markers, and secret-looking assignments are rejected.
    CertOpsCertificateWriteResponse:
      type: object
      additionalProperties: false
      required: [items, count]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CertOpsManagedCertificate"
        count:
          type: integer
          minimum: 0
    CertOpsCertificateWriteRequest:
      type: object
      additionalProperties: true
      description: Recognized fields for public certificate import/register operations. Unknown fields are ignored by the current runtime, but the entire request body is scanned and rejected if any field contains private key material.
      anyOf:
        - required: [certificatePem]
        - required: [pem]
        - required: [certificate]
        - required: [chainPem]
        - required: [certificates]
      properties:
        certificatePem:
          type: string
          description: Public certificate PEM or PEM chain. Private key material is rejected with PRIVATE_KEY_MATERIAL_REJECTED.
        pem:
          type: string
          description: Public certificate PEM or PEM chain.
        certificate:
          type: string
          description: Public certificate PEM or PEM chain.
        chainPem:
          type: string
          description: Public certificate PEM chain.
        certificates:
          type: array
          minItems: 1
          items:
            type: string
          description: Public certificate PEM blocks joined by the runtime into a chain.
        sourceRef:
          type: string
          nullable: true
          description: Opaque non-secret source reference.
        name:
          type: string
          nullable: true
        keyMode:
          type: string
          nullable: true
          enum:
            - agent-local
            - proxy-agent-local
            - cert-manager-managed
            - appliance-managed
            - hsm-managed
            - vault-managed
            - os-store-managed
            - external-unknown
            - null
          description: Non-secret mode describing where the private key lives outside the control plane.
        keyReference:
          type: string
          nullable: true
          maxLength: 256
          description: Opaque non-secret external reference. Invalid references return CERTOPS_KEY_REFERENCE_INVALID; private-key material returns PRIVATE_KEY_MATERIAL_REJECTED.
    CertOpsMetadataEntry:
      type: object
      additionalProperties: false
      description: Public metadata only. Names colliding after case/separator normalization with server-owned executor, evidence, lifecycle, or redaction fields are rejected.
      x-certops-reservedMetadataNames: [executorEventId, executorEventType, executorStatus, occurredAt, certificateId, executorId, evidenceId, certificateInstanceId, targetId, source, status, fingerprintSha256, summary, artifactRefs, redactionApplied, redactionCount, redactedFields, redactedSecretCategories, jobStatusTransitionApplied, jobStatusTransitionIgnored, jobStatusTransitionIgnoredReason]
      required: [name, value]
      properties:
        name:
          type: string
          maxLength: 64
          description: Public metadata name. Private-key-bearing names are prohibited. Generic-secret-bearing names are accepted only for server-side redaction and persist under server-owned redacted metadata keys. Names colliding with x-certops-reservedMetadataNames are rejected.
          pattern: "^(?!.*(?:[Pp][Rr][Ii][Vv][Aa][Tt][Ee][-_]?[Kk][Ee][Yy]|[Ee][Nn][Cc][Rr][Yy][Pp][Tt][Ee][Dd][-_]?[Pp][Rr][Ii][Vv][Aa][Tt][Ee][-_]?[Kk][Ee][Yy]|[Kk][Ee][Yy][-_]?[Mm][Aa][Tt][Ee][Rr][Ii][Aa][Ll]|[Pp][Ff][Xx][-_]?[Bb][Ll][Oo][Bb]|[Jj][Kk][Ss][-_]?[Bb][Ll][Oo][Bb]|[Tt][Ll][Ss][-_]?[Kk][Ee][Yy]|[Cc][Aa][-_]?[Pp][Rr][Ii][Vv][Aa][Tt][Ee][-_]?[Kk][Ee][Yy]|[Kk][Ee][Yy][Ss][Tt][Oo][Rr][Ee][-_]?[Pp][Aa][Ss][Ss][Ww][Oo][Rr][Dd]|[Pp][Rr][Ii][Vv][Aa][Tt][Ee][-_]?[Kk][Ee][Yy][-_]?[Pp][Aa][Ss][Ss][Ww][Oo][Rr][Dd]|[Kk][Ee][Yy][-_]?[Pp][Aa][Ss][Ss][Ww][Oo][Rr][Dd]|[Kk][Ee][Yy][-_]?[Pp][Ee][Mm]))[A-Za-z0-9_.:-]{1,64}$"
        value:
          oneOf:
            - type: string
              maxLength: 512
            - type: number
            - type: integer
            - type: boolean
    CertOpsJob:
      type: object
      additionalProperties: false
      description: Public CertOps job summary for dashboard and timeline reads. Payload and result metadata are omitted from list responses.
      required:
        - id
        - workspaceId
        - operation
        - status
        - source
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        workspaceId:
          type: string
          format: uuid
        operation:
          type: string
          enum: [renew, deploy, reload, revoke, noop, issue]
        status:
          type: string
          enum:
            - pending_approval
            - approved
            - rejected
            - pending
            - claimed
            - running
            - succeeded
            - failed
            - blocked
            - cancelled
            - dry_run_complete
            - orphaned_unknown_effect
        source:
          type: string
          enum: [api, executor, system, automation, domain-monitor, endpoint-monitor, control-plane, external, controller_provisioning]
        subjectType:
          type: string
          nullable: true
          enum: [managed_certificate, certificate_instance, certificate_target, token, domain, endpoint, external]
        subjectId:
          type: string
          maxLength: 128
          nullable: true
        requestedByUserId:
          type: integer
          nullable: true
        requestedByApiTokenId:
          type: string
          format: uuid
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        queuedAt:
          type: string
          format: date-time
          nullable: true
        startedAt:
          type: string
          format: date-time
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true
        cancelledAt:
          type: string
          format: date-time
          nullable: true
    CertOpsJobListResponse:
      type: object
      additionalProperties: false
      required: [items, pagination]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CertOpsJob"
        pagination:
          $ref: "#/components/schemas/CertOpsListPagination"
    CertOpsJobCreateRequest:
      type: object
      additionalProperties: false
      required: [operation]
      description: >-
        Manual job creation request. source is always forced to "api" by the
        server and is not accepted from the request body. Operation "issue"
        requests a brand-new certificate for which no managed certificate row
        exists yet: subjectType, subjectId, and payload.certificateId must all
        be omitted, and idempotencyKey is required. For "issue" the server
        creates the managed certificate upfront in the same transaction with
        status "provisioning" and source "agent_issuance", then creates the job
        against that new row and reconciles the certificate to "active" from
        the job's own validation evidence when the job succeeds.
      properties:
        operation:
          type: string
          enum: [renew, deploy, reload, revoke, noop, issue]
          description: >-
            Job operation. "issue" is control-plane-only first-time issuance;
            it is dispatched to agents as action "renew", so the agent-facing
            action values are unchanged.
        subjectType:
          type: string
          enum: [managed_certificate, certificate_instance, certificate_target, token, domain, endpoint, external]
          description: >-
            Subject kind of an already existing subject. Must be omitted for
            operation "issue"; the server sets managed_certificate on the row
            it creates.
        subjectId:
          type: string
          maxLength: 128
          description: >-
            Id of an already existing subject. Must be omitted for operation
            "issue"; the server assigns the id of the managed certificate it
            creates.
        payload:
          allOf:
            - $ref: "#/components/schemas/CertOpsPublicObject"
          description: >-
            Public job payload. For operation "issue", payload.certificateId
            must be omitted because the server assigns it; the name and common
            name of the created certificate come from
            payload.target.reference, and its subject alternative names come
            from payload.sans. The execution
            fields accepted on an "issue" job are exactly the renew set
            (commandRef, caEndpoint, acmeKind, keyRotation, certPath,
            reloadService, verifyHost, verifyPort, dnsZone, dnsProvider); a
            renewalProfile snapshot is not valid on an "issue" job.
        idempotencyKey:
          type: string
          maxLength: 128
          description: >-
            Required for operation "issue", where it makes a retry safe
            instead of creating a duplicate certificate row and is stored as
            the created certificate's source reference. Optional for all other
            operations.
        requiresApproval:
          type: boolean
          default: false
          description: >-
            True creates the job at pending_approval instead of pending, so
            it must be approved by a different user before it becomes
            claimable (see the approval gate on POST .../{jobId}/approve).
    CertOpsBulkRenewRequest:
      type: object
      additionalProperties: false
      required: [certificateIds]
      description: >-
        Bulk renewal request. Each certificate id becomes one renew job
        created through the same manual creation path as POST /jobs; source
        is always forced to "api" by the server.
      properties:
        certificateIds:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items:
            type: string
            format: uuid
        dryRun:
          type: boolean
          default: false
          description: >-
            True validates each certificate and reports per-item outcomes
            without creating any jobs.
        requiresApproval:
          type: boolean
          default: false
          description: >-
            True makes every created job start at pending_approval, matching
            the per-job approval gate of single manual job creation.
        idempotencyKey:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^[A-Za-z0-9._-]{1,64}$'
          description: >-
            Optional request-level idempotency key. Combined with each
            certificateId to derive a per-item key
            (bulk-renew:<idempotencyKey>:<certificateId>), so retrying the
            same bulk request is safe. When omitted, the server derives
            bulk-renew:auto:<certificateId> instead.
        payload:
          allOf:
            - $ref: "#/components/schemas/CertOpsPublicObject"
          description: >-
            Optional shared public payload merged into every created renew
            job, accepting the same optional execution fields as a single
            renew job. The server sets certificateId per item.
    CertOpsJobApprovalDecisionResponse:
      type: object
      additionalProperties: false
      required: [jobId, status]
      description: >-
        Result of an approve/reject decision. approvedByUserId/payloadHash/
        canonicalIntentHash are null on reject (no hash is bound to a
        rejection); approval mirrors the ledger row the server just wrote.
      properties:
        jobId:
          type: string
          format: uuid
        status:
          type: string
          enum: [approved, rejected]
        approvedByUserId:
          type: string
          format: uuid
          nullable: true
        approvedAt:
          type: string
          format: date-time
          nullable: true
        payloadHash:
          type: string
          nullable: true
          description: SHA256 hex of the canonical job payload bound by this decision. Null on reject.
        canonicalIntentHash:
          type: string
          nullable: true
          description: SHA256 hex of the canonical job intent bound by this decision. Null on reject.
        approval:
          type: object
          additionalProperties: false
          required: [id, workspaceId, jobId, decision, createdAt]
          description: The approval-ledger row just written for this decision.
          properties:
            id:
              type: string
              format: uuid
            workspaceId:
              type: string
              format: uuid
            jobId:
              type: string
              format: uuid
            decision:
              type: string
              enum: [approved, rejected]
            approvedByUserId:
              type: string
              format: uuid
              nullable: true
            payloadHash:
              type: string
              nullable: true
            canonicalIntentHash:
              type: string
              nullable: true
            reason:
              type: string
              nullable: true
            createdAt:
              type: string
              format: date-time
    CertOpsBulkRenewResultItem:
      type: object
      additionalProperties: false
      required: [certificateId, ok]
      properties:
        certificateId:
          type: string
          format: uuid
        ok:
          type: boolean
        jobId:
          type: string
          format: uuid
          description: Present only when ok is true and the request was not a dry run.
        errorCode:
          type: string
          description: >-
            Present only when ok is false. Uses the existing CertOps error
            vocabulary (for example CERTOPS_CERTIFICATE_NOT_FOUND,
            CERTOPS_JOB_INVALID, CERTOPS_WORKSPACE_PAUSED).
        message:
          type: string
          description: Present only when ok is false.
    CertOpsBulkRenewResponse:
      type: object
      additionalProperties: false
      required: [summary, results]
      description: >-
        Partial-failure envelope for bulk renewal. Returned with HTTP 200
        even when some or all items fail; consumers must inspect per-item
        results.
      properties:
        summary:
          type: object
          additionalProperties: false
          required: [requested, succeeded, failed]
          properties:
            requested:
              type: integer
              minimum: 1
              maximum: 100
            succeeded:
              type: integer
              minimum: 0
            failed:
              type: integer
              minimum: 0
        dryRun:
          type: boolean
          description: Present and true only for dry-run requests.
        results:
          type: array
          items:
            $ref: "#/components/schemas/CertOpsBulkRenewResultItem"
    CertOpsWorkspacePauseUpdateRequest:
      type: object
      additionalProperties: false
      required: [certOpsPaused]
      properties:
        certOpsPaused:
          type: boolean
          description: True prevents new CertOps side effects in this workspace only.
        reason:
          type: string
          maxLength: 500
          description: Optional bounded operator reason, redacted before transactional audit persistence.
    CertOpsWorkspacePauseState:
      type: object
      additionalProperties: false
      required: [workspaceId, certOpsPaused, certOpsEnabled, certOpsActive]
      properties:
        workspaceId:
          type: string
          format: uuid
        certOpsPaused:
          type: boolean
          description: Stored workspace-local kill-switch state.
        certOpsEnabled:
          type: boolean
          description: Current deployment-wide certops.enabled rollout state.
        certOpsActive:
          type: boolean
          description: True only when certOpsEnabled is true and certOpsPaused is false.
        changed:
          type: boolean
          description: Present on updates; false means the requested state already existed and no transition audit was written.
    CertOpsPublicObject:
      type: object
      additionalProperties: true
      description: Sanitized public metadata object. Runtime rejects private-key material, credentials, token secrets, raw secret dumps, and custody-shaped field names before persistence.
    CertOpsJobDetail:
      type: object
      additionalProperties: false
      required: [id, workspaceId, operation, status, source, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        workspaceId:
          type: string
          format: uuid
        operation:
          type: string
          enum: [renew, deploy, reload, revoke, noop, issue]
        status:
          type: string
          enum:
            - pending_approval
            - approved
            - rejected
            - pending
            - claimed
            - running
            - succeeded
            - failed
            - blocked
            - cancelled
            - dry_run_complete
            - orphaned_unknown_effect
        source:
          type: string
          enum: [api, executor, system, automation, domain-monitor, endpoint-monitor, control-plane, external, controller_provisioning]
        subjectType:
          type: string
          nullable: true
          enum: [managed_certificate, certificate_instance, certificate_target, token, domain, endpoint, external]
        subjectId:
          type: string
          maxLength: 128
          nullable: true
        requestedByUserId:
          type: integer
          nullable: true
        requestedByApiTokenId:
          type: string
          format: uuid
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        queuedAt:
          type: string
          format: date-time
          nullable: true
        startedAt:
          type: string
          format: date-time
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true
        cancelledAt:
          type: string
          format: date-time
          nullable: true
        payload:
          $ref: "#/components/schemas/CertOpsPublicObject"
        resultMetadata:
          $ref: "#/components/schemas/CertOpsPublicObject"
        errorCode:
          type: string
          maxLength: 128
          nullable: true
        errorMessage:
          type: string
          maxLength: 1024
          nullable: true
        claimId:
          type: string
          format: uuid
          nullable: true
          description: |-
            The current lease token an agent must reprove on every renew/report
            call before it can act on this job. Only returned to workspace
            admins/owners; other workspace members (who can still read this
            endpoint) get this field omitted, since the raw value is reusable
            proof of lease ownership for as long as the lease is open.
        claimedByAgentId:
          type: string
          format: uuid
          nullable: true
        claimedByControllerClusterId:
          type: string
          nullable: true
        leaseExpiresAt:
          type: string
          format: date-time
          nullable: true
        leaseRenewedAt:
          type: string
          format: date-time
          nullable: true
        attemptCount:
          type: integer
          minimum: 0
        maxAttempts:
          type: integer
          minimum: 0
        claimedByAgentSigningKeyId:
          type: string
          nullable: true
          description: |-
            Best-effort proxy for "which signing key backed this job's dispatch": the
            claiming agent's *currently* pinned signing key, resolved by the single-job
            GET .../certops/jobs/{jobId} route only (absent on job-creation responses).
            There is no per-attempt signing-key column in the schema, so this reflects
            the agent's key at read time, not necessarily the key pinned at the moment
            of the specific claim being viewed.
    CertOpsJobDetailResponse:
      type: object
      additionalProperties: false
      required: [job]
      properties:
        job:
          $ref: "#/components/schemas/CertOpsJobDetail"
    CertOpsJobLogEntry:
