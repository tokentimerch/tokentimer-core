                      First page of perpetual (never-expiring) assets. Use
                      GET .../control-center/never-expires with an offset to
                      load additional pages.
                  neverExpiresHasMore:
                    type: boolean
                    description: True if more perpetual assets exist beyond this first page.
                  privilegeHighlights:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                    description: >-
                      First page of the scopes/privileges highlight list. Use
                      GET .../control-center/privilege-highlights with an
                      offset to load additional pages.
                  privilegeHighlightsTotal:
                    type: integer
                    description: >-
                      Total count of tokens with recorded scopes/privileges in the
                      workspace. privilegeHighlights is a capped preview list
                      (top matches only), so use this field for the headline count.
                  privilegeHighlightsHasMore:
                    type: boolean
                    description: True if more privilege highlights exist beyond this first page.
                  autoSync:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                  generatedAt:
                    type: string
                    format: date-time
                  isComplete:
                    type: boolean
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
