            $ref: "#/components/schemas/CertOpsEvidenceItem"
        pagination:
          $ref: "#/components/schemas/Pagination"
    CertOpsControllerObservationRequest:
      type: object
      additionalProperties: false
      required: [schemaVersion, observationId, idempotencyKey, workspaceId, clusterId, namespace, certificateName, certificateUid, issuerRef, secretName, certificateRequestRef, dnsNames, conditions, ready, publicCertificate, observationSource, observedAt]
      properties:
        schemaVersion: { type: integer, enum: [1] }
        observationId: { type: string, format: uuid }
        idempotencyKey: { type: string, pattern: "^[a-f0-9]{64}$" }
        workspaceId: { type: string, format: uuid }
        clusterId: { type: string, minLength: 1, maxLength: 63, pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$" }
        namespace: { type: string, minLength: 1, maxLength: 63, pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$" }
        certificateName: { type: string, minLength: 1, maxLength: 253, pattern: "^[a-z0-9](?:[-a-z0-9]{0,61}[a-z0-9])?(?:\\.[a-z0-9](?:[-a-z0-9]{0,61}[a-z0-9])?)*$" }
        certificateUid: { type: string, format: uuid }
        certificateGeneration: { type: integer, minimum: 0 }
        resourceVersion: { type: string, maxLength: 256 }
        issuerRef:
          type: object
          additionalProperties: false
          required: [name]
          properties:
            group: { type: string, maxLength: 253 }
            kind: { type: string, maxLength: 253 }
            name: { type: string, minLength: 1, maxLength: 253, pattern: "^[a-z0-9](?:[-a-z0-9]{0,61}[a-z0-9])?(?:\\.[a-z0-9](?:[-a-z0-9]{0,61}[a-z0-9])?)*$" }
        secretName: { type: string, nullable: true, minLength: 1, maxLength: 253, pattern: "^[a-z0-9](?:[-a-z0-9]{0,61}[a-z0-9])?(?:\\.[a-z0-9](?:[-a-z0-9]{0,61}[a-z0-9])?)*$" }
        certificateRequestRef:
          type: object
          nullable: true
          additionalProperties: false
          required: [name]
          properties:
            name: { type: string, minLength: 1, maxLength: 253, pattern: "^[a-z0-9](?:[-a-z0-9]{0,61}[a-z0-9])?(?:\\.[a-z0-9](?:[-a-z0-9]{0,61}[a-z0-9])?)*$" }
            uid: { type: string, format: uuid }
        dnsNames:
          type: array
          maxItems: 64
          items: { type: string, minLength: 1, maxLength: 253, pattern: "^(\\*\\.)?[a-z0-9](?:[-a-z0-9]{0,61}[a-z0-9])?(?:\\.[a-z0-9](?:[-a-z0-9]{0,61}[a-z0-9])?)*$" }
        revision: { type: integer, minimum: 0 }
        conditions:
          type: array
          maxItems: 16
          items:
            type: object
            additionalProperties: false
            required: [type, status]
            properties:
              type: { type: string, maxLength: 253 }
              status: { type: string, maxLength: 32 }
              reason: { type: string, maxLength: 1024 }
              message: { type: string, maxLength: 1024 }
              lastTransitionTime: { type: string, format: date-time }
        ready: { type: boolean }
        failureReason: { type: string, maxLength: 1024 }
        failureMessage: { type: string, maxLength: 1024 }
        notBefore: { type: string, format: date-time }
        notAfter: { type: string, format: date-time }
        renewalTime: { type: string, format: date-time }
        publicCertificate:
          type: object
          nullable: true
          additionalProperties: false
          properties:
            fingerprintSha256: { type: string, pattern: "^[a-f0-9]{64}$" }
            serialNumber: { type: string, maxLength: 1024 }
            subject: { type: string, maxLength: 1024 }
            issuer: { type: string, maxLength: 1024 }
            subjectAltNames:
              type: array
              maxItems: 64
              items:
                oneOf:
                  - { type: string, minLength: 1, maxLength: 253, pattern: "^(\\*\\.)?[a-z0-9](?:[-a-z0-9]{0,61}[a-z0-9])?(?:\\.[a-z0-9](?:[-a-z0-9]{0,61}[a-z0-9])?)*$" }
                  - { type: string, format: ipv4, maxLength: 253 }
                  - { type: string, format: ipv6, maxLength: 253 }
                  - { type: string, format: uri, maxLength: 253, pattern: "^[A-Za-z][A-Za-z0-9+.-]*:[^\\s]+$" }
                  - { type: string, format: email, maxLength: 253, pattern: "^[A-Za-z0-9.!#$%&'*+/=?^_`{|}~-]+@[a-z0-9]([-a-z0-9]*[a-z0-9])?(\\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$" }
            publicKeyAlgorithm: { type: string, maxLength: 1024 }
            publicKeySize: { type: integer, minimum: 1, maximum: 16384 }
            signatureAlgorithm: { type: string, maxLength: 1024 }
            certificatePem: { type: string, maxLength: 65536 }
        observationSource: { type: string, enum: [cert_manager] }
        observedAt: { type: string, format: date-time }
    CertOpsControllerObservationResponse:
      type: object
      additionalProperties: false
      required: [managedCertificateId, targetId, certificateInstanceId, duplicate]
      properties:
        managedCertificateId: { type: string, format: uuid, nullable: true }
        targetId: { type: string, format: uuid, nullable: true }
        certificateInstanceId: { type: string, format: uuid, nullable: true }
        duplicate: { type: boolean }
    CertOpsProvisionIntentRequest:
