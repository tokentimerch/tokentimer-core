                    error: CertOps agent bootstrap token request is invalid
                    code: CERTOPS_AGENT_BOOTSTRAP_TOKEN_NAME_INVALID
                expiryInvalid:
                  value:
                    error: CertOps agent bootstrap token request is invalid
                    code: CERTOPS_AGENT_BOOTSTRAP_TOKEN_EXPIRY_INVALID
                contactGroupInvalid:
