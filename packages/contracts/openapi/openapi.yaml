                      $ref: "#/components/schemas/CertOpsCertificateInstance"
                  pagination:
                    $ref: "#/components/schemas/Pagination"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Managed certificate not found in this workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: Certificate not found
                code: CERTOPS_CERTIFICATE_NOT_FOUND
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/workspaces/{id}/certops/certificates/{certId}/retire:
    post:
      tags: [CertOps]
      summary: Retire a managed certificate
      operationId: retireCertOpsCertificate
      description: Soft-retires a managed certificate by moving public lifecycle status to revoked or decommissioned. The managed certificate, linked token, and instance history are preserved; request bodies containing private key material are rejected before feature gating.
      parameters:
        - $ref: "#/components/parameters/workspaceIdParam"
        - in: path
          name: certId
          required: true
          schema:
            type: string
            format: uuid
          description: Managed certificate identifier.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CertOpsCertificateRetireRequest"
      responses:
        "200":
          description: Managed certificate retired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CertOpsManagedCertificateDetailResponse"
        "400":
          description: Invalid retire request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                invalidStatus:
                  value:
                    error: Invalid certificate retire status
                    code: CERTOPS_CERTIFICATE_RETIRE_STATUS_INVALID
                invalidReason:
                  value:
                    error: Invalid certificate retire reason
                    code: CERTOPS_CERTIFICATE_RETIRE_REASON_INVALID
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Authenticated user lacks the workspace manager/admin role required for CertOps writes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "Forbidden: insufficient role"
                code: INSUFFICIENT_ROLE
        "404":
          description: CertOps is disabled or the certificate was not found in this workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                certopsDisabled:
                  value:
                    error: Endpoint not found
                    code: NOT_FOUND
                certificateNotFound:
                  value:
                    error: Certificate not found
                    code: CERTOPS_CERTIFICATE_NOT_FOUND
        "422":
          description: Request rejected because it contained private key material
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: Private key material is not accepted in CertOps requests
                code: PRIVATE_KEY_MATERIAL_REJECTED
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/workspaces/{id}/certops/certificates/{certId}/renewal-setup:
    post:
      tags: [CertOps]
      summary: Set up automatic renewal for a managed certificate
      operationId: createCertOpsRenewalSetup
      description: |
        Creates a renew job for the certificate and, in the same transaction,
        records the durable intent that turns the job's verified result into a
        renewal profile. A real run and its intent therefore commit together:
        there is no window in which renewal was requested but nothing was
        recorded.

        `dryRun: true` makes this a preflight instead. It creates a `dry_run`
        renew job (which terminates as `dry_run_complete`, never `succeeded`)
        and records no intent, so a preflight can never configure anything.
        The certificate detail response reports a completed preflight with no
        intent behind it so the operator can resume.

        Refused when the certificate already has a renewal profile, when its
        key mode is not agent-deployable, or when it is deployed in more than
        one location: the schema records a single deployment path, so a second
        location would silently go unrenewed behind a badge reading "auto".
      parameters:
        - $ref: "#/components/parameters/workspaceIdParam"
        - in: path
          name: certId
          required: true
          schema:
            type: string
            format: uuid
          description: Managed certificate identifier.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CertOpsRenewalSetupRequest"
      responses:
        "201":
          description: Renew job created (and, for a real run, the adoption intent recorded)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CertOpsJobDetailResponse"
        "400":
          description: The certificate's stored renewal inputs cannot produce a usable job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                profileIncomplete:
                  value:
                    error: Renewal profile is incomplete
                    code: CERTOPS_RENEWAL_PROFILE_INCOMPLETE
                profileInvalid:
                  value:
                    error: Renewal profile is invalid
                    code: CERTOPS_RENEWAL_PROFILE_INVALID
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Not a session user, or the session user lacks the workspace manager/admin role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                sessionUserRequired:
                  value:
                    error: "Forbidden: session user required"
                    code: INSUFFICIENT_ROLE
                insufficientRole:
                  value:
                    error: "Forbidden: insufficient role"
                    code: INSUFFICIENT_ROLE
        "404":
          description: CertOps is disabled or the certificate was not found in this workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                certopsDisabled:
                  value:
                    error: Endpoint not found
                    code: NOT_FOUND
                certificateNotFound:
                  value:
                    error: Certificate not found
                    code: CERTOPS_CERTIFICATE_NOT_FOUND
        "409":
          description: |
            CertOps is paused for this workspace, or the certificate cannot be
            adopted as it stands.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                workspacePaused:
                  value:
                    error: CertOps is paused for this workspace
                    code: CERTOPS_WORKSPACE_PAUSED
                alreadyConfigured:
                  value:
                    error: This certificate already has a renewal profile
                    code: CERTOPS_RENEWAL_SETUP_ALREADY_CONFIGURED
                multiLocation:
                  value:
                    error: This certificate is deployed in more than one location
                    code: CERTOPS_RENEWAL_SETUP_MULTI_LOCATION
                notAgentDeployable:
                  value:
                    error: This certificate's key mode is not agent-deployable
                    code: CERTOPS_CERTIFICATE_NOT_AGENT_DEPLOYABLE
        "422":
          description: |
            The request carried private key material, or no deployment path an
            agent could write to is recorded for this certificate.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                keyMaterialRejected:
                  value:
                    error: Private key material is not accepted in CertOps requests
                    code: PRIVATE_KEY_MATERIAL_REJECTED
                noDeployedPath:
                  value:
                    error: No deployed certificate path is recorded for this certificate
                    code: CERTOPS_RENEWAL_SETUP_NO_DEPLOYED_PATH
        "429":
          description: The workspace API rate limiter rejected the request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          description: Workspace pause state could not be read; new CertOps work is denied fail-closed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: CertOps workspace state is unavailable
                code: CERTOPS_WORKSPACE_STATE_UNAVAILABLE
  /api/v1/workspaces/{id}/certops/certificates/{certId}/profile:
    delete:
      tags: [CertOps]
      summary: Detach a managed certificate from its renewal profile
      operationId: detachCertOpsRenewalProfile
      description: |
        Nulls the certificate's profile link, writes the audit record, and
        cancels any outstanding profile-derivation intents, all in one
        transaction: without the cancellation, an in-flight setup could
        re-link the certificate moments after the operator detached it.

        The profile row itself is never deleted, because one profile can cover
        several certificates.

        Gated like the profile PATCH: a session user with
        `certops.renewal_profile.manage`, since both change what a privileged
        agent will run on a host.
      parameters:
        - $ref: "#/components/parameters/workspaceIdParam"
        - in: path
          name: certId
          required: true
          schema:
            type: string
            format: uuid
          description: Managed certificate identifier.
      responses:
        "200":
          description: Certificate detached from its renewal profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CertOpsRenewalProfileDetachResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Not a session user, or the session user lacks certops.renewal_profile.manage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                sessionUserRequired:
                  value:
                    error: "Forbidden: session user required"
                    code: INSUFFICIENT_ROLE
                insufficientRole:
                  value:
                    error: "Forbidden: insufficient permissions"
                    code: INSUFFICIENT_PERMISSIONS
        "404":
          description: CertOps is disabled or the certificate was not found in this workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                certopsDisabled:
                  value:
                    error: Endpoint not found
                    code: NOT_FOUND
                certificateNotFound:
                  value:
                    error: Certificate not found
                    code: CERTOPS_CERTIFICATE_NOT_FOUND
        "422":
          description: The certificate is not linked to a renewal profile, so there is nothing to detach
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: This certificate is not linked to a renewal profile
                code: CERTOPS_CERTIFICATE_NOT_PROFILED
        "429":
          description: The workspace API rate limiter rejected the request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/workspaces/{id}/certops/renewal-setup-intents/{outboxId}/retry:
    post:
      tags: [CertOps]
      summary: Retry a failed automatic-renewal setup intent
      operationId: retryCertOpsRenewalSetupIntent
      description: |
        Returns a parked profile-derivation intent to the pending queue with a
        fresh attempt budget.

        Only a `failed` intent can be retried. A `skipped` intent is a
        recorded decision rather than a failure, and the decision this rule
        exists for is `detached`: replaying it would re-link a certificate an
        operator deliberately detached.
      parameters:
        - $ref: "#/components/parameters/workspaceIdParam"
        - in: path
          name: outboxId
          required: true
          schema:
            type: string
            format: uuid
          description: The intent identifier reported as renewalSetup.intentId.
      responses:
        "200":
          description: Intent reset to pending
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CertOpsRenewalSetupRetryResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Not a session user, or the session user lacks the workspace manager/admin role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                sessionUserRequired:
                  value:
                    error: "Forbidden: session user required"
                    code: INSUFFICIENT_ROLE
                insufficientRole:
                  value:
                    error: "Forbidden: insufficient role"
                    code: INSUFFICIENT_ROLE
        "404":
          description: CertOps is disabled or the intent was not found in this workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                certopsDisabled:
                  value:
                    error: Endpoint not found
                    code: NOT_FOUND
                intentNotFound:
                  value:
                    error: Outbox event not found
                    code: CERTOPS_OUTBOX_EVENT_NOT_FOUND
        "422":
          description: |
            The request carried private key material, or the intent is not in a
            retryable state (already succeeded, still pending, or skipped).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                keyMaterialRejected:
                  value:
                    error: Private key material is not accepted in CertOps requests
                    code: PRIVATE_KEY_MATERIAL_REJECTED
                notRetryable:
                  value:
                    error: Only a failed outbox event can be retried; this one is skipped
                    code: CERTOPS_OUTBOX_EVENT_NOT_RETRYABLE
        "429":
          description: The workspace API rate limiter rejected the request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/workspaces/{id}/certops/instances:
    get:
      tags: [CertOps]
      summary: List workspace certificate instances
      operationId: listCertOpsInstances
      description: Returns public, workspace-scoped certificate instance history across all managed certificates (a flat inventory browse, unlike the per-certificate instances route). Private key material, evidence, raw output, and secret fields are never returned.
      parameters:
        - $ref: "#/components/parameters/workspaceIdParam"
        - $ref: "#/components/parameters/limitParam"
        - $ref: "#/components/parameters/offsetParam"
      responses:
        "200":
          description: Workspace certificate instance inventory
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, pagination]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/CertOpsCertificateInstance"
                  pagination:
                    $ref: "#/components/schemas/Pagination"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: CertOps is disabled for this deployment or workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: Endpoint not found
                code: NOT_FOUND
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/workspaces/{id}/certops/profiles:
    get:
      tags: [CertOps]
      summary: List renewal profiles
      operationId: listCertOpsRenewalProfiles
      description: |
        Returns the workspace's renewal profiles. A profile carries the execution
        contract the renewal scheduler uses for a certificate: SAN policy, key
        parameters, CA endpoint, ACME command reference, DNS provider and zone,
        and deployment paths. Profiles never hold key material.

        Profiles are normally derived automatically from the issuance that
        created a certificate, so `derived` is true for most rows and
        `editableFields` lists the subset a caller may change.

        Manager-only. A profile body describes deployment topology (certificate
        and key paths, reload unit, file ownership and modes, ACME command
        reference, CA account reference, DNS zone), so it is gated like the agent
        and machine-token routes rather than like the certificate inventory.
      parameters:
        - $ref: "#/components/parameters/workspaceIdParam"
        - $ref: "#/components/parameters/certOpsReadLimitParam"
        - $ref: "#/components/parameters/certOpsReadOffsetParam"
      responses:
        "200":
          description: Renewal profile inventory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CertOpsRenewalProfileList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: CertOps is disabled for this deployment or workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: Endpoint not found
                code: NOT_FOUND
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/workspaces/{id}/certops/renewals/upcoming:
    get:
      tags: [CertOps]
      summary: List upcoming automatic renewals
      operationId: listCertOpsUpcomingRenewals
      description: |
        Returns every renewable certificate in the workspace, ordered by expiry,
        with the date the renewal scheduler starts attempting each one
        (`renewsFrom`, computed as notAfter minus the effective lead time) and
        whether the scheduler would actually renew it.

        Deliberately NOT restricted to certificates that will renew. A
        certificate with no renewal profile, or with a profile the scheduler
        cannot execute, is exactly the certificate that will silently expire, so
        excluding it would make this endpoint report an all-clear for a workspace
        where nothing renews at all. Every row that will not be renewed carries a
        `blockedReason` naming the cause, distinguishing an operator's deliberate
        switch-off from a defect.

        Manager-only, matching the profile routes: each row carries the profile's
        lead time and identity, and the view exists to be read alongside them.
      parameters:
        - $ref: "#/components/parameters/workspaceIdParam"
        - $ref: "#/components/parameters/certOpsReadLimitParam"
        - $ref: "#/components/parameters/certOpsReadOffsetParam"
      responses:
        "200":
          description: Upcoming renewal schedule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CertOpsUpcomingRenewalList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: CertOps is disabled for this deployment or workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: Endpoint not found
                code: NOT_FOUND
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/workspaces/{id}/certops/profiles/{profileId}:
    get:
      tags: [CertOps]
      summary: Get a renewal profile
      operationId: getCertOpsRenewalProfile
      description: |
        Returns one renewal profile with `editableFields`, the subset a caller may
        change. Manager-only, for the same reason as the list route: the body
        describes deployment topology rather than expiry metadata.
      parameters:
        - $ref: "#/components/parameters/workspaceIdParam"
        - name: profileId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Renewal profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CertOpsRenewalProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Renewal profile not found, or CertOps is disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      tags: [CertOps]
      summary: Update a renewal profile
      operationId: updateCertOpsRenewalProfile
      description: |
        Changes renewal configuration for a profile. Requires the workspace
        admin role (`certops.renewal_profile.manage`) because the stored profile
        determines what a host-privileged agent executes at the next renewal.

        Only the fields listed in the profile's `editableFields` may be changed.
        The fields that decide WHERE a certificate is written and WHAT command
        writes it (`target`, `deploymentTargets`, `acme`, `ca`, `dns`) are
        immutable after issuance and are rejected with
        `CERTOPS_PROFILE_FIELD_IMMUTABLE`; repointing a deployment is a new
        issuance, not an edit.

        Set `autoRenewEnabled` to false to stop automatic renewal for every
        certificate linked to this profile. The certificate then expires unless
        it is renewed manually. Every accepted change writes an audit event in
        the same transaction as the update.
      parameters:
        - $ref: "#/components/parameters/workspaceIdParam"
        - name: profileId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                autoRenewEnabled:
                  type: boolean
                  description: False switches automatic renewal off for certificates using this profile.
                renewBeforeDays:
                  type: integer
                  minimum: 1
                  maximum: 365
                  nullable: true
                  description: Lead time before expiry. Null falls back to the deployment-wide threshold.
                description:
                  type: string
                  nullable: true
                  maxLength: 1024
                renewalProfile:
                  type: object
                  additionalProperties: false
                  description: Partial patch limited to the editable fields.
                  properties:
                    sanPolicy:
                      type: object
                    keyAlgorithm:
                      type: string
                      enum: [rsa, ecdsa]
                    keySize:
                      type: integer
                    keyRotationPolicy:
                      type: object
                    verification:
                      type: object
                    preferredChain:
                      type: string
                      nullable: true
            examples:
              switchOffAutomaticRenewal:
                summary: Stop renewing certificates on this profile
                value:
                  autoRenewEnabled: false
              changeLeadTime:
                summary: Renew 45 days before expiry
                value:
                  renewBeforeDays: 45
      responses:
        "200":
          description: Updated renewal profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CertOpsRenewalProfile"
        "400":
          description: No supported changes were requested
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: No supported changes were requested
                code: CERTOPS_PROFILE_NO_CHANGES
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Renewal profile not found, or CertOps is disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: The requested change is not permitted or fails the profile contract
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ErrorResponse"
                  - type: object
                    properties:
                      fields:
                        type: array
                        items:
                          type: string
              example:
                error: "These renewal-profile fields cannot be changed after issuance: target."
                code: CERTOPS_PROFILE_FIELD_IMMUTABLE
                fields: [target]
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/workspaces/{id}/certops/targets:
    get:
      tags: [CertOps]
