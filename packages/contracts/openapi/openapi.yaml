                code: NOT_FOUND
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/workspaces/{id}/certops/imports:
    post:
      tags: [CertOps]
      summary: Import certificates from public material
      operationId: createCertOpsImport
      description: Imports certificates from PEM/public material. Private key material is rejected before feature gating.
      parameters:
        - $ref: "#/components/parameters/workspaceIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CertOpsCertificateWriteRequest"
      responses:
        "202":
          description: Import accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CertOpsCertificateWriteResponse"
        "400":
          description: Missing certificate material, malformed public certificate input, or invalid key reference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                missingCertificate:
                  value:
                    error: certificatePem is required
                    code: CERTOPS_CERTIFICATE_PEM_REQUIRED
                parseFailed:
                  value:
                    error: Certificate input could not be parsed
                    code: CERTOPS_CERTIFICATE_PARSE_FAILED
                invalidKeyReference:
                  value:
                    error: keyReference must be a non-secret reference
                    code: CERTOPS_KEY_REFERENCE_INVALID
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Authenticated user lacks the workspace manager/admin role required for CertOps writes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "Forbidden: insufficient role"
                code: INSUFFICIENT_ROLE
        "404":
          description: CertOps is disabled for this deployment or workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: Endpoint not found
                code: NOT_FOUND
        "422":
          description: Request rejected because it contained private key material
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: Private key material is not accepted in CertOps requests
                code: PRIVATE_KEY_MATERIAL_REJECTED
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/workspaces/{id}/certops/settings:
    get:
      tags: [CertOps]
      summary: Get workspace CertOps pause state
      operationId: getCertOpsWorkspaceSettings
      description: >-
        Returns the workspace-local CertOps kill-switch state and the effective
        side-effect availability. All authorized workspace members may read it.
        This is a human cookie/session-authenticated workspace surface; internal
        worker bearer credentials are not accepted.
        The stored pause state remains distinct from the deployment-wide
        certops.enabled rollout flag, and this settings endpoint remains
        available when that rollout flag is disabled.
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/workspaceIdParam"
      responses:
        "200":
          description: Workspace CertOps pause state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CertOpsWorkspacePauseState"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      tags: [CertOps]
      summary: Pause or resume new CertOps work for a workspace
      operationId: updateCertOpsWorkspaceSettings
      description: >-
        Changes only the workspace-local kill switch and remains available
        while the deployment-wide rollout flag is disabled. Requires a human
        cookie/session-authenticated workspace admin; internal worker bearer
        credentials are not accepted. A paused workspace rejects new manual jobs and future dispatch or
        provision side effects with 409 CERTOPS_WORKSPACE_PAUSED; inventory,
        status, audit, evidence, and existing-work reporting remain available.
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/workspaceIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CertOpsWorkspacePauseUpdateRequest"
      responses:
        "200":
          description: Stored workspace CertOps pause state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CertOpsWorkspacePauseState"
        "400":
          description: Pause state or reason is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                invalidState:
                  value:
                    error: CertOps workspace pause request is invalid
                    code: CERTOPS_WORKSPACE_PAUSE_STATE_INVALID
                invalidReason:
                  value:
                    error: CertOps workspace pause request is invalid
                    code: CERTOPS_WORKSPACE_PAUSE_REASON_INVALID
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: A human session user with the workspace admin role is required; internal worker bearer credentials are not accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "Forbidden: insufficient role"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: Request rejected because it contained private key material
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: Private key material is not accepted in CertOps requests
                code: PRIVATE_KEY_MATERIAL_REJECTED
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/workspaces/{id}/certops/jobs:
    get:
      tags: [CertOps]
      summary: List CertOps jobs
      operationId: listCertOpsJobs
      description: >-
        Returns paginated public CertOps job summaries for the workspace. Consumers
        must follow pagination.limit and pagination.offset; long job histories can
        require multiple requests. Private key material, raw executor output, token
        hashes, and credentials are never returned.
      parameters:
        - $ref: "#/components/parameters/workspaceIdParam"
        - $ref: "#/components/parameters/certOpsReadLimitParam"
        - $ref: "#/components/parameters/certOpsReadOffsetParam"
        - in: query
          name: status
          schema:
            type: string
            enum: [pending_approval, approved, rejected, pending, claimed, running, succeeded, failed, blocked, cancelled]
        - in: query
          name: operation
          schema:
            type: string
            enum: [renew, deploy, reload, revoke, noop, issue]
        - in: query
          name: source
          schema:
            type: string
            enum: [api, executor, system, automation, domain-monitor, endpoint-monitor, control-plane, external, controller_provisioning]
        - in: query
          name: subjectType
          schema:
            type: string
            enum: [managed_certificate, certificate_instance, certificate_target, token, domain, endpoint, external]
        - in: query
          name: subjectId
          schema:
            type: string
            maxLength: 128
      responses:
        "200":
          description: Job list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CertOpsJobListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: A filter contained private-key or forbidden secret material
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: Private key material is not accepted in CertOps requests
                code: PRIVATE_KEY_MATERIAL_REJECTED
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [CertOps]
      summary: Create a manual CertOps job
      operationId: createCertOpsJob
      description: >-
        Creates a workspace-scoped CertOps job through the manual creation
        surface. This is a session-authenticated exception path for the
        pre-certops-scheduler window (and a break-glass path afterward);
        jobs created this way are always recorded with source "api" and
        cannot be attributed to the executor or automated-scheduler
        pipelines. Requires workspace_manager role or above. Private key or
        secret material in the request body is rejected.
      parameters:
        - $ref: "#/components/parameters/workspaceIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CertOpsJobCreateRequest"
      responses:
        "201":
          description: Job created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CertOpsJobDetailResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >-
            idempotencyKey conflict, workspace CertOps is paused, per-CA renewal
            capacity exceeded, or the subject certificate has no agent-manageable
            key custody.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                idempotencyConflict:
                  value:
                    error: Idempotency key was already used with a different CertOps job request
                    code: CERTOPS_JOB_IDEMPOTENCY_CONFLICT
                workspacePaused:
                  value:
                    error: CertOps is paused for this workspace
                    code: CERTOPS_WORKSPACE_PAUSED
                perCaCapExceeded:
                  value:
                    error: Per-CA renewal capacity exceeded
                    code: CERTOPS_RENEWAL_PER_CA_CAP_EXCEEDED
                certificateNotAgentDeployable:
                  value:
                    error: >-
                      This certificate has no agent-manageable key custody (it
                      was only observed, e.g. via an endpoint or domain monitor)
                      and cannot be assigned an agent-executed renew job
                    code: CERTOPS_CERTIFICATE_NOT_AGENT_DEPLOYABLE
        "422":
          description: The request contained private-key or forbidden secret material
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: Private key material is not accepted in CertOps requests
                code: PRIVATE_KEY_MATERIAL_REJECTED
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          description: Workspace pause state could not be read; new CertOps work is denied fail-closed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: CertOps workspace state is unavailable
                code: CERTOPS_WORKSPACE_STATE_UNAVAILABLE
  /api/v1/workspaces/{id}/certops/jobs/bulk-renew:
    post:
      tags: [CertOps]
      summary: Bulk-create CertOps renewal jobs
      operationId: bulkRenewCertOpsCertificates
      description: >-
        Queues a renew job for up to 100 managed certificates in one request.
        Each certificate goes through the same manual job-creation path as
        POST /jobs (manager role, workspace kill switch, approval gate,
        payload validation), and jobs are always recorded with source "api".
        The response is a partial-failure envelope: per-certificate successes
        and failures are reported item by item and never abort the batch, so
        the request returns 200 even when some or all items fail. Only
        whole-request shape problems (malformed body, more than 100 ids,
        non-UUID or duplicate ids) fail with 400. Private key or secret
        material in the request body is rejected.
      parameters:
        - $ref: "#/components/parameters/workspaceIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CertOpsBulkRenewRequest"
      responses:
        "200":
          description: Partial-failure envelope with per-certificate outcomes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CertOpsBulkRenewResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Workspace CertOps is paused; no items are attempted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: CertOps is paused for this workspace
                code: CERTOPS_WORKSPACE_PAUSED
        "422":
          description: The request contained private-key or forbidden secret material
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: Private key material is not accepted in CertOps requests
                code: PRIVATE_KEY_MATERIAL_REJECTED
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          description: Workspace pause state could not be read; new CertOps work is denied fail-closed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: CertOps workspace state is unavailable
                code: CERTOPS_WORKSPACE_STATE_UNAVAILABLE
  /api/v1/workspaces/{id}/certops/provision-intents:
    post:
      tags: [CertOps Controller]
      summary: Create a cert-manager provisioning intent
      operationId: createCertOpsProvisionIntent
      description: >-
        Manager-only human surface. It creates an idempotent `deploy` job
        with a strict public cert-manager desired state. The route is blocked by
        both CertOps rollout and workspace pause gates and never accepts a
        Kubernetes manifest, Secret data, CSR, or private key material.
      parameters:
        - $ref: "#/components/parameters/workspaceIdParam"
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, minLength: 1, maxLength: 128, pattern: "^[A-Za-z0-9._:-]+$" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CertOpsProvisionIntentRequest"
      responses:
        "201":
          description: Provisioning intent created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CertOpsProvisionIntentResponse" }
        "200":
          description: Exact idempotent replay
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CertOpsProvisionIntentResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            Idempotency conflict (the key was reused with a different body),
            an attempt to reactivate a terminal managed certificate, or a
            paused workspace.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                idempotencyConflict:
                  value:
                    error: Idempotency key was already used with a different CertOps job request
                    code: CERTOPS_JOB_IDEMPOTENCY_CONFLICT
                terminalIdentity:
                  value:
                    error: Provisioning cannot reactivate a terminal managed certificate
                    code: CERTOPS_CONTROLLER_PROVISIONING_TERMINAL_IDENTITY
                workspacePaused:
                  value:
                    error: CertOps is paused for this workspace
                    code: CERTOPS_WORKSPACE_PAUSED
        "422":
          description: Request rejected because it contained private key material
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: Private key material is not accepted in CertOps requests
                code: PRIVATE_KEY_MATERIAL_REJECTED
        "500":
          description: >-
            Provisioning intent could not be created after validation
            (CERTOPS_CONTROLLER_PROVISIONING_CREATE_FAILED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/workspaces/{id}/certops/jobs/{jobId}:
    get:
      tags: [CertOps]
      summary: Get a CertOps job
      operationId: getCertOpsJob
      description: Returns one sanitized CertOps job detail for the authorized workspace.
      parameters:
        - $ref: "#/components/parameters/workspaceIdParam"
        - in: path
          name: jobId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Job detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CertOpsJobDetailResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Job not found in this workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: Certificate job not found
                code: CERTOPS_JOB_NOT_FOUND
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/workspaces/{id}/certops/jobs/{jobId}/approve:
    post:
      tags: [CertOps]
      summary: Approve a pending CertOps job
      operationId: approveCertOpsJob
      description: >-
        Grants the human approval a gated job needs before an agent can claim
        it. Session-only manager surface (internal worker credentials are
        rejected) with a non-requester rule: the user who requested the job
        cannot approve it. The approval is bound to a canonical SHA256 hash of
        the job payload at decision time; if the payload changes afterwards
        the claim path voids the approval and returns the job to
        pending_approval. Available while the workspace kill switch is paused.
      parameters:
        - $ref: "#/components/parameters/workspaceIdParam"
        - in: path
          name: jobId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reason:
                  type: string
                  maxLength: 1024
                  description: Optional attributable justification stored in the decision ledger.
      responses:
        "200":
          description: Job approved; status moves to approved and the payload hash is recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CertOpsJobApprovalDecisionResponse"
