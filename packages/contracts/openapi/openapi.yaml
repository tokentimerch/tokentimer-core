      operationId: rejectCertOpsJob
      description: >-
        Rejects a pending_approval job so it never becomes claimable.
        Session-only manager surface like approve, but without the
        non-requester rule: any authorized member, including the requester,
        may withdraw or reject. The decision is recorded in the attributable
        approval ledger. Available while the workspace kill switch is paused.
      parameters:
        - $ref: "#/components/parameters/workspaceIdParam"
        - in: path
          name: jobId
          required: true
