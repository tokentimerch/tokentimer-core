        "404":
          description: Job not found in this workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Job is not awaiting approval (CERTOPS_APPROVAL_JOB_NOT_PENDING_APPROVAL)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"
