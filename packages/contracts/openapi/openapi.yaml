        duplicate: { type: boolean }
    CertOpsControllerProvisioningCommand:
      type: object
      additionalProperties: false
      required: [schemaVersion, workspaceId, clusterId, jobId, managedCertificateId, namespace, certificateName, secretName, issuerRef, dnsNames]
      properties:
        schemaVersion: { type: integer, enum: [1] }
        workspaceId: { type: string, format: uuid }
        clusterId: { type: string, minLength: 1, maxLength: 63, pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$" }
        jobId: { type: string, format: uuid }
        managedCertificateId: { type: string, format: uuid }
        namespace: { type: string, minLength: 1, maxLength: 63, pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$" }
        certificateName: { type: string, minLength: 1, maxLength: 253 }
        secretName: { type: string, minLength: 1, maxLength: 253 }
        issuerRef:
          type: object
          additionalProperties: false
          required: [group, kind, name]
          properties:
            group: { type: string, minLength: 1, maxLength: 253 }
            kind: { type: string, enum: [Issuer, ClusterIssuer] }
            name: { type: string, minLength: 1, maxLength: 253 }
        dnsNames:
          type: array
          minItems: 1
          maxItems: 100
          items: { type: string, minLength: 1, maxLength: 253, pattern: "^(\\*\\.)?[a-z0-9](?:[-a-z0-9]{0,61}[a-z0-9])?(?:\\.[a-z0-9](?:[-a-z0-9]{0,61}[a-z0-9])?)*$" }
    CertOpsProvisioningCommandResponse:
      type: object
      additionalProperties: false
      required: [command]
      properties:
        command: { $ref: "#/components/schemas/CertOpsControllerProvisioningCommand" }
        eventTimestamps:
          type: object
          additionalProperties: false
          description: First accepted real executor-event times for bounded command redelivery; not an agent attempt or lease record.
          properties:
            started: { type: string, format: date-time }
            completed: { type: string, format: date-time }
            failed: { type: string, format: date-time }
    CertOpsApiTokenScope:
      type: string
      enum:
        - certops:read
        - certops:events:write
        - certops:jobs:read
        - certops:evidence:write
        - certops:observations:write
        - certops:provision:execute
      description: Canonical CertOps API-token scope. Either controller scope requires a controller cluster binding; job-claim and signed-agent scopes remain reserved for signed agent dispatch.
    CertOpsApiToken:
      type: object
      additionalProperties: false
      description: Public CertOps API-token metadata. Plaintext token values, token hashes, Authorization headers, and credential material are never returned by metadata/list/revoke responses.
      required:
        - id
        - workspaceId
        - name
        - tokenPrefix
        - scopes
        - status
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        workspaceId:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 128
        tokenPrefix:
          type: string
          minLength: 1
          maxLength: 64
          pattern: "^ttx_[a-f0-9]{16}$"
          description: Public lookup prefix only; not sufficient to authenticate.
        scopes:
          type: array
          minItems: 1
          maxItems: 8
          uniqueItems: true
          items:
            $ref: "#/components/schemas/CertOpsApiTokenScope"
        controllerClusterId:
          type: string
          nullable: true
          minLength: 1
          maxLength: 63
          pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"
          description: Immutable binding required exactly when scopes includes either controller scope.
        status:
          type: string
          enum: [active, revoked, expired]
        expiresAt:
          type: string
          format: date-time
          nullable: true
        revokedAt:
          type: string
          format: date-time
          nullable: true
        lastUsedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        revokedByUserId:
          type: integer
          nullable: true
        createdByUserId:
          type: integer
          nullable: true
    CertOpsApiTokenListResponse:
      type: object
      additionalProperties: false
      required: [items, pagination]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CertOpsApiToken"
        pagination:
          $ref: "#/components/schemas/CertOpsUnboundedListPagination"
    CertOpsApiTokenCreateRequest:
      type: object
      additionalProperties: false
      required: [name, scopes]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
          description: Public label. Must not contain a raw CertOps token, bearer credential, token hash, private-key material, or generic credential material.
        scopes:
          type: array
          minItems: 1
          maxItems: 8
          uniqueItems: true
          items:
            $ref: "#/components/schemas/CertOpsApiTokenScope"
        expiresAt:
          type: string
          format: date-time
          nullable: true
        controllerClusterId:
          type: string
          nullable: true
          minLength: 1
          maxLength: 63
          pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"
          description: Required exactly when scopes includes either controller scope; creation-only and immutable.
    CertOpsApiTokenCreateResponse:
      type: object
      additionalProperties: false
      description: Token creation response. plaintextToken is returned once at creation only; it is never returned by list/get/revoke responses and is never stored in recoverable form.
      required: [token, plaintextToken]
      properties:
        token:
          $ref: "#/components/schemas/CertOpsApiToken"
        plaintextToken:
          type: string
          minLength: 85
          maxLength: 85
          pattern: "^ttx_[a-f0-9]{16}_[a-f0-9]{64}$"
          description: One-time plaintext token value shown only by the create response.
    CertOpsApiTokenRevokeResponse:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          $ref: "#/components/schemas/CertOpsApiToken"
    CertOpsEvidenceMetadata:
      type: object
      additionalProperties: false
      description: Strict standalone normalized/persisted public evidence metadata. The executor-output store separately keeps bounded executor output after private-key rejection and generic-secret redaction; raw output and key-bearing artifacts are excluded here.
      required:
        - schemaVersion
        - evidenceId
        - jobId
        - workspaceId
        - eventType
        - source
        - observedAt
      properties:
        schemaVersion:
          type: integer
          enum: [1]
        evidenceId:
          type: string
          minLength: 1
          maxLength: 128
          pattern: "^[A-Za-z0-9_.:-]+$"
        jobId:
          type: string
          minLength: 1
          maxLength: 128
          pattern: "^[A-Za-z0-9_.:-]+$"
        workspaceId:
          type: string
          format: uuid
        certificateId:
          type: string
          maxLength: 128
          pattern: "^[A-Za-z0-9_.:-]+$"
          nullable: true
        certificateInstanceId:
          type: string
          maxLength: 128
          pattern: "^[A-Za-z0-9_.:-]+$"
          nullable: true
        targetId:
          type: string
          maxLength: 128
          pattern: "^[A-Za-z0-9_.:-]+$"
          nullable: true
        eventType:
          type: string
          enum:
            - certificate.observed
            - deployment.checked
            - deployment.updated
            - validation.passed
            - validation.failed
            - policy.checked
        source:
          type: string
          enum: [executor, domain-monitor, endpoint-monitor, control-plane, external]
        status:
          type: string
          enum: [accepted, redacted, rejected, failed]
          nullable: true
        observedAt:
          type: string
          format: date-time
          pattern: "^(?:200[0-9]|20[1-9][0-9]|2100)-(?:0[1-9]|1[0-2])-(?:0[1-9]|[12][0-9]|3[01])T(?:[01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9](?:\\.[0-9]+)?(?:Z|[+-](?:(?:0[0-9]|1[0-3]):[0-5][0-9]|14:00))$"
          description: The supplied RFC3339 timestamp must use a year from 2000 through 2100. Runtime normalizes accepted values to UTC milliseconds; offsets may move the normalized instant outside that lexical-year range.
        fingerprintSha256:
          type: string
          pattern: "^[a-f0-9]{64}$"
          nullable: true
        summary:
          type: string
          maxLength: 1024
          nullable: true
        metadata:
          type: array
          maxItems: 32
          items:
            $ref: "#/components/schemas/CertOpsMetadataEntry"
        artifactRefs:
          type: array
          maxItems: 16
          items:
            type: object
            additionalProperties: false
            required: [type, reference]
            properties:
              type:
                type: string
                enum: [log, report, certificate, deployment, external]
              reference:
                type: string
                minLength: 1
                maxLength: 512
              sha256:
                type: string
                pattern: "^[a-f0-9]{64}$"
                nullable: true
        output:
          type: string
          maxLength: 65536
          x-maxBytes: 65536
          nullable: true
          description: Optional executor output, limited to 65,536 UTF-8 bytes. Runtime rejects private key material, redacts generic secrets to [REDACTED], stores only redacted output separately from normalized metadata, and does not return this field from evidence list responses.
        redactionApplied:
          type: boolean
          nullable: true
