  /api/v1/workspaces/{id}/certops/agents:
    get:
      tags: [CertOps]
      summary: List CertOps agents
      operationId: listCertOpsAgents
      description: Returns workspace-scoped agent fleet metadata (hostnames, versions, liveness). Manager-only. Credential hashes and bearer credentials are never returned.
      parameters:
        - $ref: "#/components/parameters/workspaceIdParam"
        - $ref: "#/components/parameters/certOpsUnboundedListLimitParam"
        - $ref: "#/components/parameters/certOpsReadOffsetParam"
      responses:
        "200":
          description: Agent metadata list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CertOpsWorkspaceAgentListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/workspaces/{id}/certops/agents/{agentId}/retire:
    post:
      tags: [CertOps]
      summary: Retire a CertOps agent
      operationId: retireCertOpsAgent
      description: >-
        Retires an agent so its credential stops authenticating (agent protocol
        routes return 410). Retiring an already-retired agent is idempotent. If
        the agent holds actively leased jobs the request is blocked with 409
        unless force is true, in which case an attributable reason is required.
        A forced retire fences the agent's in-flight work immediately rather
        than leaving it to the lease reaper: jobs still at "claimed" are
        cancelled with error_code CERTOPS_AGENT_FORCE_RETIRED, while jobs that
        had reached "running" become orphaned_unknown_effect and are flagged
        needs_operator_reconciliation, because their real-world effect is
        unknown. Both id lists are returned in the response and recorded on the
        CERTOPS_AGENT_RETIRED audit event.
      parameters:
        - $ref: "#/components/parameters/workspaceIdParam"
        - in: path
          name: agentId
          required: true
          schema:
            type: string
            format: uuid
          description: Internal agent record id (UUID), not the protocol agentId string.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CertOpsWorkspaceAgentRetireRequest"
      responses:
        "200":
          description: Agent retired (or already retired)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CertOpsWorkspaceAgentRetireResponse"
        "400":
          description: Agent identifier or retire reason is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                agentIdInvalid:
                  value:
                    error: CertOps agent identifier is invalid
                    code: CERTOPS_AGENT_INVALID
                reasonInvalid:
                  value:
                    error: CertOps agent request is invalid
                    code: CERTOPS_AGENT_RETIRE_REASON_INVALID
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: CertOps is disabled or the agent was not found in this workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                certopsDisabled:
                  value:
                    error: Endpoint not found
                    code: NOT_FOUND
                agentNotFound:
                  value:
                    error: CertOps agent not found
                    code: CERTOPS_AGENT_NOT_FOUND
        "409":
          description: Agent has actively leased jobs and force was not set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: CertOps agent has actively leased jobs
                code: CERTOPS_AGENT_RETIRE_BLOCKED
                dependencies:
                  leasedJobs: 2
        "422":
          description: Request rejected because it contained private key material
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: Private key material is not accepted in CertOps requests
                code: PRIVATE_KEY_MATERIAL_REJECTED
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/workspaces/{id}/certops/agents/{agentId}/alert-settings:
    patch:
      tags: [CertOps]
      summary: Update a CertOps agent's downtime alert settings
      operationId: updateCertOpsAgentAlertSettings
      description: >-
        Edits `downtimeAlertsEnabled` and/or `contactGroupId` for an already
        registered agent. Both fields are independently optional: omit a
        field to leave it unchanged, or send `contactGroupId: null` to
        explicitly clear it back to "use the workspace default contact
        group". At least one field is required. Recorded as a
        CERTOPS_AGENT_ALERT_SETTINGS_UPDATED audit event.
      parameters:
        - $ref: "#/components/parameters/workspaceIdParam"
        - in: path
          name: agentId
          required: true
          schema:
            type: string
            format: uuid
          description: Internal agent record id (UUID), not the protocol agentId string.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                downtimeAlertsEnabled:
                  type: boolean
                contactGroupId:
                  type: string
                  nullable: true
      responses:
        "200":
          description: Agent alert settings updated
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [agent]
                properties:
                  agent:
                    $ref: "#/components/schemas/CertOpsWorkspaceAgent"
        "400":
          description: Request body was empty or contactGroupId does not exist in this workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                emptyBody:
                  value:
                    error: At least one of downtimeAlertsEnabled or contactGroupId is required
                    code: CERTOPS_AGENT_ALERT_SETTINGS_EMPTY
                invalidContactGroup:
                  value:
                    error: Invalid contactGroupId for workspace
                    code: CERTOPS_AGENT_CONTACT_GROUP_INVALID
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: CertOps is disabled or the agent was not found in this workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: CertOps agent not found
                code: CERTOPS_AGENT_NOT_FOUND
        "422":
          description: Request rejected because it contained private key material
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: Private key material is not accepted in CertOps requests
                code: PRIVATE_KEY_MATERIAL_REJECTED
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/workspaces/{id}/certops/agents/diagnostic-bootstrap:
    post:
      tags: [CertOps]
      summary: Bootstrap a CertOps diagnostic agent
      operationId: createCertOpsDiagnosticBootstrap
      description: >-
        Session-authenticated (requires certops.agents.diagnose, admin-only).
        Atomically consumes a single-use requestId, creates an agent with
        agent_kind "diagnostic", and creates its protocol_smoke job, all in
        one transaction. The response's credential is returned exactly once
        and is not recoverable afterward. Retrying with the same requestId
        never replays the original agentId/credential/job; it fails with
        diagnostic_bootstrap_already_consumed. Requests are rate limited per
        workspace. Diagnostic agents that stay inactive for 24 hours are
        retired automatically; retirement revokes the credential in the same
        transaction that marks the agent retired, so a retired diagnostic
        agent's credential fails authentication immediately, not just
        authorization.
      parameters:
        - $ref: "#/components/parameters/workspaceIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CertOpsDiagnosticBootstrapRequest"
      responses:
        "201":
          description: Diagnostic agent and its protocol_smoke job were created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CertOpsDiagnosticBootstrapResponse"
        "400":
          description: requestId is missing or too long
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: requestId is required and must be at most 128 characters
                code: CERTOPS_DIAGNOSTIC_BOOTSTRAP_REQUEST_ID_INVALID
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: CertOps is disabled for this workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: Endpoint not found
                code: NOT_FOUND
        "409":
          description: This exact requestId was already consumed by a prior bootstrap call
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: This diagnostic bootstrap request was already consumed
                code: diagnostic_bootstrap_already_consumed
        "422":
          description: Request rejected because it contained private key material
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: Private key material is not accepted in CertOps requests
                code: PRIVATE_KEY_MATERIAL_REJECTED
        "429":
          description: Diagnostic bootstrap is rate limited for this workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: Diagnostic agent bootstrap is rate limited for this workspace. Please wait before trying again.
                code: CERTOPS_DIAGNOSTIC_BOOTSTRAP_RATE_LIMITED
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/certops/jobs/{jobId}/events:
    post:
      tags: [CertOps Agent]
      summary: Report an event for one CertOps job
      operationId: createCertOpsJobEvent
      description: Machine-token route for reporting lifecycle events scoped to the path jobId. Requires certops:events:write. Workspace identity is derived from the authenticated CertOps API token; body workspaceId cannot override it. The route uses the same private-key rejection, generic-secret redaction, idempotency, audit, and persistence path as POST /api/v1/certops/executor/events.
      security:
        - certOpsTokenAuth: []
      parameters:
        - in: path
          name: jobId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CertOpsPerJobExecutorEventRequest"
      responses:
        "202":
          description: Event accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CertOpsExecutorEventAcceptedResponse"
        "400":
          description: >-
            Event body failed schema/idempotency validation
            (CERTOPS_EXECUTOR_EVENT_INVALID, CERTOPS_EXECUTOR_EVENT_TYPE_INVALID,
            CERTOPS_EXECUTOR_EVENT_STATUS_MISMATCH, or CERTOPS_JOB_STATUS_INVALID)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: >-
            Caller lacks the required events-write scope
            (CERTOPS_API_TOKEN_SCOPE_DENIED), or the token's workspace does
            not match the job's workspace (CERTOPS_EXECUTOR_WORKSPACE_MISMATCH)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: CertOps is disabled or the certificate job was not found in the authenticated workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: >-
            Executor event idempotency key conflicts with a different sanitized
            payload (`CERTOPS_EXECUTOR_EVENT_CONFLICT`), or the job is currently
            claimed by a CertOps agent and the event carries a terminal status
            (`CERTOPS_EXECUTOR_JOB_AGENT_CLAIMED`). The executor and agent lanes
            share one certificate_jobs table but the executor lane holds no
            lease, so allowing an executor token to end a job an agent is still
            executing would land the agent's side effects against a terminal row.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: Executor event idempotency key conflicts with a different payload
                code: CERTOPS_EXECUTOR_EVENT_CONFLICT
        "413":
          description: The machine request body exceeded the dedicated 4 MiB pre-auth boundary (`CERTOPS_EXECUTOR_EVENT_BODY_TOO_LARGE`), or normalized evidence output exceeded 65,536 UTF-8 bytes (`CERTOPS_EVIDENCE_OUTPUT_TOO_LARGE`). The payload is not echoed.
          content:
