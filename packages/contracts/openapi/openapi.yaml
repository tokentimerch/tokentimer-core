        clusterId: { type: string, minLength: 1, maxLength: 63, pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$" }
        namespace: { type: string, minLength: 1, maxLength: 63, pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$" }
        certificateName: { type: string, minLength: 1, maxLength: 253 }
        secretName: { type: string, minLength: 1, maxLength: 253 }
        issuerRef:
          type: object
          additionalProperties: false
          required: [group, kind, name]
          properties:
            group: { type: string, minLength: 1, maxLength: 253 }
            kind: { type: string, enum: [Issuer, ClusterIssuer] }
            name: { type: string, minLength: 1, maxLength: 253 }
        dnsNames:
          type: array
          minItems: 1
          maxItems: 100
          items: { type: string, minLength: 1, maxLength: 253, pattern: "^(\\*\\.)?[a-z0-9](?:[-a-z0-9]{0,61}[a-z0-9])?(?:\\.[a-z0-9](?:[-a-z0-9]{0,61}[a-z0-9])?)*$" }
    CertOpsProvisionIntentResponse:
