# Throwaway ACME test CA for the real-user end-to-end renewal test
# (see plans/certops-post-ship-manual-acceptance-checklist.md, real-user-e2e).
#
# SUPERSEDED for the Windows/IIS E2E test: pebble-challtestsrv's DNS server
# (UDP) cannot be tunneled through a cloudflared quick tunnel (HTTP/TCP only),
# which blocks the agent's own DNS-01 propagation check (dnsPropagation.
# resolvers) from ever reaching it. The Windows E2E run instead cross-compiles
# pebble.exe and pebble-challtestsrv.exe for windows/amd64 and runs both
# directly on the target Windows host as SYSTEM scheduled tasks, so the ACME
# directory, the DNS-01 backend, and the agent's propagation check are all
# reachable over 127.0.0.1 on that host -- no tunnel needed for either. See
# the real-user-e2e checklist entry for the exact cross-compile/deploy steps.
# This compose file remains useful for a Linux-agent DNS-01 E2E test, where
# the agent host can join the same Docker network as pebble-challtestsrv.
#
# Pebble is Let's Encrypt's own test-CA reference implementation and
# pebble-challtestsrv is its companion fake-DNS/HTTP responder. Pebble is
# pointed at challtestsrv for DNS-01 resolution via -dnsserver so it never
# touches real DNS; the agent's pebble-challtestsrv DNS provider
# (src/dns/providers/pebble-challtestsrv.js) drives challtestsrv's
# /set-txt and /clear-txt management endpoints directly, so no real TXT
# records or DNS zone are needed anywhere in this test.
#
# Usage from this directory:
#   docker compose -f docker-compose.pebble.yml up -d
#   docker compose -f docker-compose.pebble.yml down
#
# Exposed on localhost:
#   14000  Pebble ACME directory (HTTPS, self-signed pebble root)
#   15000  Pebble management API (HTTPS, self-signed pebble root)
#   8055   pebble-challtestsrv management API (HTTP, no auth, no TLS)
services:
  pebble:
    image: ghcr.io/letsencrypt/pebble:latest
    command: -config test/config/pebble-config.json -strict -dnsserver 10.30.50.3:8053
    ports:
      - "14000:14000"
      - "15000:15000"
    networks:
      acmenet:
        ipv4_address: 10.30.50.2
  challtestsrv:
    image: ghcr.io/letsencrypt/pebble-challtestsrv:latest
    command: -defaultIPv6 "" -defaultIPv4 10.30.50.3
    ports:
      - "8055:8055"
    networks:
      acmenet:
        ipv4_address: 10.30.50.3

networks:
  acmenet:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 10.30.50.0/24
