name: Publish Images

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Optional refs/heads/... or refs/tags/... to build. Dispatch this workflow from main."
        required: false
        type: string
      push_latest:
        description: "Deprecated. Leave false, manual publication cannot use :latest."
        required: false
        type: boolean
        default: false
      tag_suffix:
        description: "Optional staging-* or debug-* tag (e.g. staging-latest)"
        required: false
        type: string

# Different source refs can still write the same SHA or staging alias.
concurrency:
  group: core-manual-image-publication
  cancel-in-progress: false

permissions: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  validate-tags:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.tags.outputs.sha }}
      ref_tag: ${{ steps.tags.outputs.ref_tag }}
      extra_tag: ${{ steps.tags.outputs.extra_tag }}
    steps:
      - name: Require the reviewed publication workflow
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Dispatch Publish Images from main and use source_ref to select the development source."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate development image tags
        id: tags
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REF: ${{ inputs.source_ref }}
          PUSH_LATEST: ${{ inputs.push_latest }}
          TAG_SUFFIX: ${{ inputs.tag_suffix }}
        run: node scripts/manual-image-tags.cjs

  publish:
    name: Build and Push Images (no tests)
    needs: validate-tags
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-tags.outputs.sha }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: meta
        env:
          OWNER: ${{ github.repository_owner }}
          EXTRA_TAG: ${{ needs.validate-tags.outputs.extra_tag }}
        run: |
          API_REPO="ghcr.io/${OWNER}/tokentimer-core-api"
          DASHBOARD_REPO="ghcr.io/${OWNER}/tokentimer-core-dashboard"
          WORKER_REPO="ghcr.io/${OWNER}/tokentimer-core-worker"
          CONTROLLER_REPO="ghcr.io/${OWNER}/tokentimer-core-k8s-controller"

          echo "api_repo=${API_REPO}" >> $GITHUB_OUTPUT
          echo "dashboard_repo=${DASHBOARD_REPO}" >> $GITHUB_OUTPUT
          echo "worker_repo=${WORKER_REPO}" >> $GITHUB_OUTPUT
          echo "controller_repo=${CONTROLLER_REPO}" >> $GITHUB_OUTPUT

          if [ -n "$EXTRA_TAG" ]; then
            echo "api_extra=${API_REPO}:${EXTRA_TAG}" >> "$GITHUB_OUTPUT"
            echo "dashboard_extra=${DASHBOARD_REPO}:${EXTRA_TAG}" >> "$GITHUB_OUTPUT"
            echo "worker_extra=${WORKER_REPO}:${EXTRA_TAG}" >> "$GITHUB_OUTPUT"
            echo "controller_extra=${CONTROLLER_REPO}:${EXTRA_TAG}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push API
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./deploy/compose/Dockerfile.api
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.meta.outputs.api_repo }}:${{ needs.validate-tags.outputs.sha }}
            ${{ steps.meta.outputs.api_repo }}:${{ needs.validate-tags.outputs.ref_tag }}
            ${{ steps.meta.outputs.api_extra }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Dashboard
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./deploy/compose/Dockerfile.dashboard
          push: true
          platforms: linux/amd64
          build-args: |
            VITE_API_URL=
          tags: |
            ${{ steps.meta.outputs.dashboard_repo }}:${{ needs.validate-tags.outputs.sha }}
            ${{ steps.meta.outputs.dashboard_repo }}:${{ needs.validate-tags.outputs.ref_tag }}
            ${{ steps.meta.outputs.dashboard_extra }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Worker
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./deploy/compose/Dockerfile.worker
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.meta.outputs.worker_repo }}:${{ needs.validate-tags.outputs.sha }}
            ${{ steps.meta.outputs.worker_repo }}:${{ needs.validate-tags.outputs.ref_tag }}
            ${{ steps.meta.outputs.worker_extra }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Kubernetes controller
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./apps/k8s-controller/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.meta.outputs.controller_repo }}:${{ needs.validate-tags.outputs.sha }}
            ${{ steps.meta.outputs.controller_repo }}:${{ needs.validate-tags.outputs.ref_tag }}
            ${{ steps.meta.outputs.controller_extra }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
