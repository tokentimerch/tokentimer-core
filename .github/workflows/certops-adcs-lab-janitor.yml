name: "CertOps / Expired disposable AD CS lab cleanup"
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
concurrency:
  group: certops-retention24h-owned-azure-lifecycle
  cancel-in-progress: false
permissions:
  contents: read
  id-token: write
jobs:
  cleanup:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: certops-adcs-cleanup
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Authenticate isolated lab subscription with OIDC
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: ./infra/certops-adcs/login-oidc.ps1
      - name: Remove only expired owned qualification groups
        shell: pwsh
        run: ./infra/certops-adcs/remove-expired-labs.ps1
