name: "CertOps / Actual elapsed agent-log maintenance"
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: certops-log-maintenance-${{ github.ref }}
  cancel-in-progress: false
jobs:
  log-maintenance:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NODE_ENV: test
      CERTOPS_ENABLED: 'true'
      CERTOPS_CSR_API_URL: http://localhost:4000
      CERTOPS_CSR_DISPOSABLE_STACK: '1'
      CERTOPS_LOG_MAINTENANCE_EXCLUSIVE_STACK: '1'
      CERTOPS_E2E_REQUIRED: '1'
      CERTOPS_QUALIFICATION_STRICT: '1'
      CERTOPS_LOG_MAINTENANCE_REPORT: qualification-results/log-maintenance.json
      CERTOPS_SIGNING_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      CERTOPS_REGISTRATION_ENCRYPTION_KEY: abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789
      DB_HOST: localhost
      DB_PORT: '5432'
      DB_USER: tokentimer
      DB_PASSWORD: password
      DB_NAME: tokentimer
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: ./.github/actions/certops-node-setup
      - name: Start isolated actual API and PostgreSQL
        run: |
          docker compose -f deploy/compose/docker-compose.test.yml up -d --build
          for attempt in $(seq 1 90); do
            if curl -fsS http://localhost:4000/ >/dev/null; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Observe five-minute default grace and actual production log worker
        run: |
          node --test tests/e2e/certops-log-maintenance-e2e.test.js
          node scripts/certops-log-maintenance-report.js qualification-results/log-maintenance.json
      - name: Destroy exclusive disposable stack
        if: always()
        run: docker compose -f deploy/compose/docker-compose.test.yml down -v --remove-orphans
      - name: Preserve only bounded maintenance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: certops-log-maintenance-${{ github.sha }}
          path: qualification-results/log-maintenance.json
          if-no-files-found: error
          retention-days: 14
