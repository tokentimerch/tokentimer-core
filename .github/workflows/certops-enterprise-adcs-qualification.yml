name: "CertOps / Disposable enterprise AD CS native qualification"
on:
  workflow_dispatch:
    inputs:
      qualification_scope:
        description: Comprehensive scenarios or installed operator journey only
        type: choice
        options: ['comprehensive', 'operator-acceptance']
        default: comprehensive
      location:
        description: Azure region available to the lab subscription
        type: string
        default: swedencentral
        required: true
      fault_profile:
        description: Optional observed fault experiment; results remain unqualified
        type: choice
        options: ['none', 'submitting', 'issued', 'installing', 'response-loss']
        default: 'none'
      vm_size:
        description: VM size available to the lab subscription (three two-vCPU machines)
        type: choice
        options: ['Standard_D2s_v5', 'Standard_D2as_v5']
        default: Standard_D2s_v5
      lab_hours:
        description: Maximum resource lifetime in hours
        type: choice
        options: ['4', '8']
        default: '4'
      windows_version:
        description: Domain member Windows Server image to qualify
        type: choice
        options: ['2019', '2022', '2025']
        default: '2022'
      language:
        description: Installed native Windows display language on CA and member
        type: choice
        options: ['en-US', 'de-DE', 'fr-FR']
        default: 'en-US'
      debug_mode:
        description: Diagnostic run (NOT release evidence). Adds redacted failure messages and stack frames to the report and keeps the lab until it expires if the run fails
        type: boolean
        default: false
      continue_on_failure:
        description: Run every independent journey to completion and report all failures; the run still fails
        type: boolean
        default: true
permissions:
  contents: read
  id-token: write
jobs:
  lab:
    if: github.ref == 'refs/heads/main' && vars.CERTOPS_ADCS_LAB_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: certops-adcs-lab
    timeout-minutes: 150
    env:
      LAB_GROUP: tt-certops-${{ github.run_id }}-${{ github.run_attempt }}
      LAB_HOURS: ${{ inputs.lab_hours }}
      LAB_LOCATION: ${{ inputs.location }}
      LAB_VM_SIZE: ${{ inputs.vm_size }}
      WINDOWS_VERSION: ${{ inputs.windows_version }}
      WINDOWS_LANGUAGE: ${{ inputs.language }}
      FAULT_PROFILE: ${{ inputs.fault_profile }}
      QUALIFICATION_SCOPE: ${{ inputs.qualification_scope }}
      DEBUG_MODE: ${{ inputs.debug_mode && '1' || '0' }}
      CONTINUE_ON_FAILURE: ${{ inputs.continue_on_failure && '1' || '0' }}
      CERTOPS_WINDOWS_LANGUAGE_ASSETS: ${{ secrets.CERTOPS_WINDOWS_LANGUAGE_ASSETS }}
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '24'
      - name: Require every AD CS safety fixture family before provisioning
        run: node scripts/certops-adcs-safety-inventory.js
      - name: Authenticate dedicated lab environment with OIDC
        shell: pwsh
        run: ./infra/certops-adcs/login-oidc.ps1
      - name: Provision isolated domain CA control plane and member and execute real scenarios
        shell: pwsh
        run: |
          $responseLoss = if($env:FAULT_PROFILE -eq 'response-loss'){'1'}else{'0'}
          $journalPhase = if($env:FAULT_PROFILE -in @('submitting','issued','installing')){$env:FAULT_PROFILE}else{'none'}
          if($env:FAULT_PROFILE -notin @('none','submitting','issued','installing','response-loss')){throw 'Unknown fault profile'}
          ./infra/certops-adcs/provision-lab.ps1 -ResourceGroup $env:LAB_GROUP -Hours ([int]$env:LAB_HOURS) -WindowsVersion $env:WINDOWS_VERSION -Language $env:WINDOWS_LANGUAGE -Location $env:LAB_LOCATION -VmSize $env:LAB_VM_SIZE -ResponseLossExperiment $responseLoss -JournalPhaseExperiment $journalPhase -QualificationScope $env:QUALIFICATION_SCOPE -DebugMode $env:DEBUG_MODE -ContinueOnFailure $env:CONTINUE_ON_FAILURE
      - name: Assert mandatory native scenarios and candidate source evidence
        if: inputs.qualification_scope == 'comprehensive'
        run: node scripts/certops-qualification-report.js qualification-results/enterprise-adcs-real.json
      - name: Assert installed operator scope and native environment receipts
        if: inputs.qualification_scope == 'operator-acceptance'
        run: node scripts/certops-agent-package.js verify-operator-scope qualification-results/enterprise-adcs-infrastructure.json qualification-results/enterprise-adcs-package-acceptance.json
      - name: Verify production worker startup and graceful drainage
        run: node scripts/certops-adcs-worker-deployment-report.js qualification-results/enterprise-adcs-acceptance-worker.json
      - name: Verify observed journal fault without release promotion
        if: inputs.fault_profile == 'submitting' || inputs.fault_profile == 'issued' || inputs.fault_profile == 'installing'
        run: node scripts/certops-adcs-journal-phase-report.js qualification-results/enterprise-adcs-journal-phase-experimental.json
      - name: Verify lost response without release promotion
        if: inputs.fault_profile == 'response-loss'
        run: node scripts/certops-adcs-response-loss-report.js qualification-results/enterprise-adcs-response-loss-experimental.json
      - name: Mark failed diagnostic run for lab retention
        # failure() is only valid in step conditions, so the decision is handed to teardown through the job env.
        if: failure() && inputs.debug_mode
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_ENV -Value 'HOLD_FOR_DIAGNOSIS=1'
      - name: Destroy owned temporary resources
        # Only a failed diagnostic run keeps its lab; the script verifies the expiry tag so the hourly janitor
        # still removes it. Every other run is torn down.
        if: always()
        shell: pwsh
        run: ./infra/certops-adcs/remove-owned-lab.ps1 -ResourceGroup $env:LAB_GROUP -HoldForDiagnosis $(if($env:HOLD_FOR_DIAGNOSIS -eq '1'){'1'}else{'0'})
      - name: Preserve infrastructure scope receipts only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: disposable-enterprise-adcs-infrastructure
          path: qualification-results/enterprise-adcs-*.json
          if-no-files-found: warn
