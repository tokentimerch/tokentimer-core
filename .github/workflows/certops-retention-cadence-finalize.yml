# Independent short controller; no hosted runner waits through the installed timer.
name: "CertOps / Optional AD CS / Finalize default retention timer"
on:
  workflow_dispatch:
  schedule:
    - cron: "53 * * * *"
# Share serialization with the independent generic expired-lab janitor.
concurrency:
  group: certops-retention24h-owned-azure-lifecycle
  cancel-in-progress: false
permissions:
  contents: read
  actions: read
  id-token: write
jobs:
  finalize:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: certops-adcs-cleanup
    timeout-minutes: 25
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: "24"
      - name: Authenticate independent cleanup identity
        shell: pwsh
        run: ./infra/certops-adcs/login-oidc.ps1
      - name: Independently verify the real timer result and remove the owned lab
        run: node scripts/certops-retention-cadence-azure.js finalize
      - name: Preserve only bounded public composite evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: retention-cadence-final-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            qualification-results/retention-cadence-final-*.json
            qualification-results/retention-cadence-qualification-*.json
            qualification-results/retention-cadence-controller-failure-finalize-*.json
          if-no-files-found: warn
          retention-days: 14
