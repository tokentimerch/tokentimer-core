name: "Core 0.18 / Release preparation (no publication)"

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  packages: read

concurrency:
  group: core-018-preparation-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  CORE_SOURCE_SHA: fcc681c19314b7c2432973ce99d517af36e10238
  ARTIFACT_SOURCE_SHA: 69387d85231f242d00f653bbde94ead373fefe1e

jobs:
  candidate-agent:
    name: Rebuild and scan candidate Windows helpers
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      archive-sha256: ${{ steps.archive.outputs.sha256 }}
    env:
      GOTOOLCHAIN: local
    defaults:
      run:
        working-directory: candidate
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: preparation
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.CORE_SOURCE_SHA }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Verify trusted immutable product checkout
        run: |
          test "$(git rev-parse HEAD)" = "$CORE_SOURCE_SHA"
          git merge-base --is-ancestor "$CORE_SOURCE_SHA" origin/main
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '24'
      - name: Install checksum-pinned patched Go toolchain
        run: |
          curl --fail --silent --show-error --location https://go.dev/dl/go1.26.10.linux-amd64.tar.gz -o "$RUNNER_TEMP/go.tar.gz"
          echo "ccfe7ae822d2c2f41f4fe7c956199967a4dac22d0ee0d2b2bfdb440aab3b20c5  $RUNNER_TEMP/go.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/core-go"
          tar -xzf "$RUNNER_TEMP/go.tar.gz" -C "$RUNNER_TEMP/core-go"
          echo "$RUNNER_TEMP/core-go/go/bin" >> "$GITHUB_PATH"
          echo "GOROOT=$RUNNER_TEMP/core-go/go" >> "$GITHUB_ENV"
      - name: Pack unchanged agent source with patched helpers
        id: archive
        run: |
          test "$(go env GOVERSION)" = go1.26.10
          node --test ../preparation/scripts/verify-agent-native-package.test.js
          node packages/agent/scripts/check-shipped-sources.js
          output="$GITHUB_WORKSPACE/build-agent-release"
          node packages/agent/scripts/pack-release.js --out-dir "$output"
          node ../preparation/scripts/verify-agent-native-package.js --archive "$output/tokentimer-agent-0.18.0.tgz" --go-version 1.26.10 --source-sha "$CORE_SOURCE_SHA" --out "$output/native-provenance.json"
          sha256=$(sha256sum "$output/tokentimer-agent-0.18.0.tgz" | cut -d ' ' -f 1)
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/agent-extracted"
          tar -xzf "$output/tokentimer-agent-0.18.0.tgz" -C "$RUNNER_TEMP/agent-extracted"
          go version -m "$RUNNER_TEMP/agent-extracted/package/bin/"*.exe > "$output/windows-helper-provenance.txt"
          test "$(grep -c ': go1.26.10$' "$output/windows-helper-provenance.txt")" = 6
          git diff --exit-code -- apps packages pnpm-lock.yaml pnpm-workspace.yaml
      - name: Scan actual archive using existing fixed High/Critical policy
        run: |
          curl --fail --silent --show-error --location https://github.com/anchore/grype/releases/download/v0.112.0/grype_0.112.0_linux_amd64.tar.gz -o "$RUNNER_TEMP/grype.tar.gz"
          echo "acb14a030010fe9bdb9594b4ae108d9d14ef2f926d936aa0916dc62c89c058ea  $RUNNER_TEMP/grype.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/core-grype"
          tar -xzf "$RUNNER_TEMP/grype.tar.gz" -C "$RUNNER_TEMP/core-grype" grype
          "$RUNNER_TEMP/core-grype/grype" "dir:$RUNNER_TEMP/agent-extracted" --fail-on high --only-fixed -o json --file "$GITHUB_WORKSPACE/build-agent-release/windows-helper-security.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: core-018-agent-candidate
          path: build-agent-release/
          if-no-files-found: error

  windows-helpers:
    name: Patched Windows helper execution
    needs: candidate-agent
    runs-on: windows-2022
    timeout-minutes: 25
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.CORE_SOURCE_SHA }}
          persist-credentials: false
      - name: Install checksum-pinned patched Windows Go toolchain
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'go.zip'
          Invoke-WebRequest https://go.dev/dl/go1.26.10.windows-amd64.zip -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne '7ecd2d7260e82c59bcbd7f1077a07cee2dea607295b858df67195a1e4e09629b') { throw 'Go archive checksum mismatch' }
          $destination = Join-Path $env:RUNNER_TEMP 'core-go'
          Expand-Archive $archive $destination
          (Join-Path $destination 'go/bin') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          ('GOROOT=' + (Join-Path $destination 'go')) | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: core-018-agent-candidate
          path: candidate-archive
      - name: Execute native helper and service host regression suites
        shell: pwsh
        run: |
          if ((go env GOVERSION) -ne 'go1.26.10') { throw 'Unexpected Go toolchain' }
          New-Item -ItemType Directory -Force helper-results | Out-Null
          foreach ($module in @('reference/adcs-chain', 'reference/adcs-cmc', 'reference/verifier', 'windows-service-host')) {
            $output = Join-Path $env:GITHUB_WORKSPACE ('helper-results/' + $module.Replace('/', '-') + '.jsonl')
            Push-Location "packages/agent/$module"
            try {
              go test -mod=readonly -count=1 -json ./... > $output
              if ($LASTEXITCODE -ne 0) { throw "Native helper tests failed: $module" }
            } finally { Pop-Location }
          }
      - name: Execute the actual packaged CMC helper against signed fixtures
        shell: pwsh
        env:
          EXPECTED_AGENT_SHA256: ${{ needs.candidate-agent.outputs.archive-sha256 }}
        run: |
          $archive = 'candidate-archive/tokentimer-agent-0.18.0.tgz'
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:EXPECTED_AGENT_SHA256) { throw 'Agent archive mismatch' }
          New-Item -ItemType Directory -Force extracted | Out-Null
          tar -xzf $archive -C extracted
          if ($LASTEXITCODE -ne 0) { throw 'Agent extraction failed' }
          $fixtures = 'packages/agent/reference/adcs-cmc/testdata'
          $pin = (Get-Content "$fixtures/ca-key-sha256.txt" -Raw).Trim()
          $response = & './extracted/package/bin/tokentimer-adcs-cmc-amd64.exe' --response "$fixtures/issued.rsp" --ca-key-sha256 $pin --ca-cert "$fixtures/ca.cer"
          if ($LASTEXITCODE -ne 0) { throw 'Packaged CMC signed fixture failed' }
          $result = $response | ConvertFrom-Json
          if ($result.disposition -ne 'issued') { throw 'Expected issued CMC disposition' }
          & './extracted/package/bin/tokentimer-adcs-cmc-amd64.exe' --response "$fixtures/issued.rsp" --ca-key-sha256 ('0' * 64) --ca-cert "$fixtures/ca.cer" 1>$null 2>$null
          if ($LASTEXITCODE -ne 2) { throw 'Packaged CMC did not refuse wrong CA pin' }
          @{sourceSha=$env:CORE_SOURCE_SHA;agentSha256=$env:EXPECTED_AGENT_SHA256;goVersion='go1.26.10';signedFixture='passed';wrongPinRefusal='passed';scope='windows-helper-regression-not-domain-CA'} | ConvertTo-Json | Set-Content helper-results/packaged-helper.json
          $global:LASTEXITCODE = 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: core-018-patched-windows-helpers
          path: helper-results/
          if-no-files-found: error

  upgrade:
    name: Released 0.17.3 to candidate package rehearsal
    needs: candidate-agent
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: preparation
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.CORE_SOURCE_SHA }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Verify trusted immutable product checkout
        run: |
          test "$(git -C candidate rev-parse HEAD)" = "$CORE_SOURCE_SHA"
          git -C candidate merge-base --is-ancestor "$CORE_SOURCE_SHA" origin/main
          cp preparation/scripts/rehearse-core-upgrade.js candidate/scripts/
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '24'
      - name: Exercise rehearsal safety guards
        run: node --test preparation/scripts/rehearse-core-upgrade.test.js
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: core-018-agent-candidate
          path: archives/candidate
      - name: Download the actual published baseline agent
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p archives/baseline
          gh release download v0.17.3 --repo "$GITHUB_REPOSITORY" --pattern tokentimer-agent-0.17.3.tgz --dir archives/baseline
      - uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Run isolated real package upgrade
        run: |
          node candidate/scripts/rehearse-core-upgrade.js \
            --source-sha "$CORE_SOURCE_SHA" \
            --image-source-sha "$ARTIFACT_SOURCE_SHA" \
            --agent-source-sha "$CORE_SOURCE_SHA" \
            --candidate-api ghcr.io/tokentimerch/tokentimer-core-api@sha256:b426671327577936f0666952047553aa7e8e5ec7369a5e5b0cf654127eaa235d \
            --candidate-worker ghcr.io/tokentimerch/tokentimer-core-worker@sha256:5cfe19338693d24eb912e213a19012f3ffc8f066fae49df9bf16d5de4a38f536 \
            --old-agent "$GITHUB_WORKSPACE/archives/baseline/tokentimer-agent-0.17.3.tgz" \
            --candidate-agent "$GITHUB_WORKSPACE/archives/candidate/tokentimer-agent-0.18.0.tgz" \
            --candidate-agent-sha256 '${{ needs.candidate-agent.outputs.archive-sha256 }}' \
            --out "$GITHUB_WORKSPACE/upgrade-results/core-upgrade.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: core-018-package-upgrade
          path: upgrade-results/core-upgrade.json
          if-no-files-found: error

  postgres:
    name: Current source PostgreSQL and real Vault
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: candidate
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.CORE_SOURCE_SHA }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Verify trusted immutable product checkout
        run: |
          test "$(git rev-parse HEAD)" = "$CORE_SOURCE_SHA"
          git merge-base --is-ancestor "$CORE_SOURCE_SHA" origin/main
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: '11.13.0'
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: candidate/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: node scripts/certops-distribution-postgres.js
      - name: Real isolated Vault adapter and ACL regressions
        if: ${{ !cancelled() }}
        run: node scripts/certops-distribution-vault.js
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: distribution-postgres
          path: |
            candidate/qualification-results/distribution-postgres-*/*.jsonl
            candidate/qualification-results/distribution-postgres-*/summary.json
            candidate/qualification-results/distribution-vault-*/*.jsonl
            candidate/qualification-results/distribution-vault-*/summary.json
          if-no-files-found: error

  agent-lab:
    name: Current source distribution (${{ matrix.certificate-mode }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        certificate-mode: [ordinary, san, wildcard]
    defaults:
      run:
        working-directory: candidate
    env:
      LAB_PROJECT: tt-wildcard-ux-ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.certificate-mode }}
      CERTIFICATE_MODE: ${{ matrix.certificate-mode }}
      CERTOPS_DISTRIBUTION_QUALIFICATION: '1'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.CORE_SOURCE_SHA }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Verify trusted immutable product checkout
        run: |
          test "$(git rev-parse HEAD)" = "$CORE_SOURCE_SHA"
          git merge-base --is-ancestor "$CORE_SOURCE_SHA" origin/main
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: '11.13.0'
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: candidate/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Build and start uniquely owned lab
        shell: pwsh
        run: ./tests/wildcard-vault/ux-lab/run.ps1 -Action Up -Project $env:LAB_PROJECT -BasePort 60800 -CertificateMode $env:CERTIFICATE_MODE -BuildImages
      - name: Execute mandatory API, agent and browser phases
        shell: pwsh
        run: ./tests/wildcard-vault/ux-lab/run.ps1 -Action Test -Project $env:LAB_PROJECT
      - name: Verify actual candidate and copy only public evidence
        run: |
          node -e 'const fs=require("node:fs");const {verify}=require("./scripts/certops-distribution-report");console.log(verify(JSON.parse(fs.readFileSync(process.argv[1])),process.env.CORE_SOURCE_SHA));' ".scratch/$LAB_PROJECT/qualification.json"
          mkdir -p qualification-results/distribution
          cp ".scratch/$LAB_PROJECT/qualification.json" qualification-results/distribution/
          cp ".scratch/$LAB_PROJECT/privacy.json" qualification-results/distribution/
          cp ".scratch/$LAB_PROJECT/"distribution-*.png qualification-results/distribution/
      - name: Preserve failed bounded report
        if: always()
        run: |
          mkdir -p qualification-results/distribution
          if test -f ".scratch/$LAB_PROJECT/qualification.json"; then
            cp ".scratch/$LAB_PROJECT/qualification.json" qualification-results/distribution/
          fi
      - name: Stop focused lab before package acceptance
        shell: pwsh
        run: ./tests/wildcard-vault/ux-lab/run.ps1 -Action Stop -Project $env:LAB_PROJECT
      - name: Packaged agent and Vault AppRole operator acceptance
        shell: pwsh
        run: |
          $images=Get-Content ".scratch/$env:LAB_PROJECT/runtime-images.json" -Raw | ConvertFrom-Json
          $env:TT_UX_API_IMAGE=$images.api
          $env:TT_UX_WORKER_IMAGE=$images.worker
          $env:TT_UX_CUSTOMER_IMAGE=$images.customers
          $packageProject="$env:LAB_PROJECT-package"
          ./tests/wildcard-vault/ux-lab/run.ps1 -Action Up -Project $packageProject -BasePort 60800 -CertificateMode $env:CERTIFICATE_MODE -PackageAcceptance
          ./tests/wildcard-vault/ux-lab/run.ps1 -Action Test -Project $packageProject
          node -e 'const fs=require("node:fs");const {verify}=require("./scripts/certops-distribution-report");console.log(verify(JSON.parse(fs.readFileSync(process.argv[1])),process.env.CORE_SOURCE_SHA));' ".scratch/$packageProject/qualification.json"
          if($LASTEXITCODE -ne 0){throw 'Package acceptance report verification failed'}
      - name: Copy only package acceptance public receipts
        if: always()
        run: |
          mkdir -p qualification-results/operator-package
          for file in qualification.json privacy.json agent-package/artifact.json; do
            if test -f ".scratch/$LAB_PROJECT-package/$file"; then
              cp ".scratch/$LAB_PROJECT-package/$file" qualification-results/operator-package/
            fi
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: operator-acceptance-vault-${{ matrix.certificate-mode }}
          path: candidate/qualification-results/operator-package/
          if-no-files-found: warn
      - name: Stop owned package lab
        if: always()
        shell: pwsh
        run: ./tests/wildcard-vault/ux-lab/run.ps1 -Action Stop -Project "$env:LAB_PROJECT-package"
      - name: Stop owned source lab
        if: always()
        shell: pwsh
        run: ./tests/wildcard-vault/ux-lab/run.ps1 -Action Stop -Project $env:LAB_PROJECT
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: distribution-agent-${{ matrix.certificate-mode }}
          path: candidate/qualification-results/distribution/
          if-no-files-found: error

  functional-summary:
    needs: [postgres, agent-lab]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.CORE_SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '24'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: distribution-*
          path: qualification-results/cohorts
      - name: Verify all seven actual-source supporting cohorts
        env:
          POSTGRES_RESULT: ${{ needs.postgres.result }}
          AGENT_LAB_RESULT: ${{ needs.agent-lab.result }}
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const {verify} = require('./scripts/certops-distribution-functional-summary');
          assert.equal(process.env.POSTGRES_RESULT, 'success');
          assert.equal(process.env.AGENT_LAB_RESULT, 'success');
          const report = verify('qualification-results/cohorts', process.env.CORE_SOURCE_SHA);
          fs.writeFileSync('qualification-results/distribution-functional-summary.json', JSON.stringify(report, null, 2) + '\n');
          console.log(JSON.stringify({status: report.status, candidateSha: report.candidateSha, qualificationStatus: report.qualificationStatus}));
          NODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: distribution-functional-summary
          path: qualification-results/distribution-functional-summary.json
          if-no-files-found: error
