# Manual script proof for installed public bind-failure parsers and cleanup guards.
# Dispatch does not install IIS, does not change HTTP.sys bindings, and does not qualify a native host.
name: "CertOps / Installed Windows bind-failure script proof"
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  script-proof:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: '24'
      - name: Validate bind-failure parsers and cleanup guards
        run: node --test scripts/certops-windows-installed-bind-failure.test.js
