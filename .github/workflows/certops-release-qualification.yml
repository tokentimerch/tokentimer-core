name: "CertOps / Collect Certificate release qualification"
on:
  workflow_dispatch:
    inputs:
      profile:
        description: Evidence scope; adcs-native collects runnable native AD CS cells and reports all omitted environments
        type: choice
        default: full
        options: [full, standard-hosted, adcs, adcs-native, extended-adcs, vault-cleanup]
      candidate_sha:
        description: Exact trusted main candidate commit (40 lowercase hexadecimal characters)
        required: true
        type: string
      run_ids:
        description: Unique completed run IDs as JSON; budget grows with committed matrix (absolute maximum 1024)
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  collect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CERTOPS_RELEASE_CANDIDATE: ${{ inputs.candidate_sha }}
      CERTOPS_RELEASE_RUN_IDS: ${{ inputs.run_ids }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify candidate belongs to trusted main history
        shell: bash
        run: |
          [[ "$CERTOPS_RELEASE_CANDIDATE" =~ ^[a-f0-9]{40}$ ]] || exit 1
          git cat-file -e "$CERTOPS_RELEASE_CANDIDATE^{commit}"
          git merge-base --is-ancestor "$CERTOPS_RELEASE_CANDIDATE" origin/main
          git checkout --detach "$CERTOPS_RELEASE_CANDIDATE"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: '11.28.8'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: pnpm
      - name: Install candidate dependencies
        run: pnpm install --frozen-lockfile
      - name: Run collector regression tests
        run: |
          node scripts/run-certops-collector-tests.js
          node --test scripts/certops-release-qualification.test.js scripts/certops-arm64-release.test.js
      - name: Collect explicit trusted candidate runs and verify every matrix slot
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CERTOPS_QUALIFICATION_PROFILE: ${{ inputs.profile }}
        run: python3 scripts/certops-release-collector.py --profile "$CERTOPS_QUALIFICATION_PROFILE"
      - name: Preserve sanitized consolidated verdict
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: certificate-release-qualification-verdict
          path: qualification-results/release-collection/summary.json
          if-no-files-found: warn
          retention-days: 30
