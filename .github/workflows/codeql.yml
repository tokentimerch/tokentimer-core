# CodeQL Advanced setup for GitHub code scanning.
# Default queries. Do not add pull_request: Core CI is push-only.
#
# Languages match this repo:
#   actions                 GitHub Actions workflows
#   go                      nested modules under packages/agent/
#   javascript-typescript   API, dashboard, worker, k8s-controller
#
# Go cannot use autobuild: there is no root go.mod, and
# windows-service-host is entirely //go:build windows, so a Linux
# autobuild compiles nothing. Manual go build with GOOS=windows is
# required for that module.
#
# GitHub stores at most 100 related locations per alert. A JS query that
# finds more still lands in the Security tab; extra locations are dropped.
# That cap cannot be raised from this workflow.
#
# checkout / setup-go are SHA-pinned (repo convention). codeql-action
# stays on the major tag so GitHub can ship CodeQL CLI updates.

name: "CodeQL Advanced"

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: go
            build-mode: manual
          - language: javascript-typescript
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        if: matrix.language == 'go'
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.25.0"
          cache: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Build Go modules for CodeQL
        if: matrix.build-mode == 'manual'
        shell: bash
        run: |
          set -euo pipefail
          # Nested modules, no root go.mod. Autobuild never compiled them.
          # windows-service-host is entirely //go:build windows.
          (
            cd packages/agent/windows-service-host
            GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -o /tmp/tokentimer-agent-host.exe .
          )
          (
            cd packages/agent/reference/verifier
            CGO_ENABLED=0 go build -o /tmp/tokentimer-verify .
          )

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{matrix.language}}"
