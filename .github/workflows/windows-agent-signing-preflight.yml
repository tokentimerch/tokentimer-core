name: Windows agent signing preflight

# This workflow signs a fresh build from trusted main for integration testing.
# It does not produce release assets or authorize release publication.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'tokentimerch/tokentimer-core' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.candidate.outputs.version }}
      amd64: ${{ steps.candidate.outputs.amd64 }}
      arm64: ${{ steps.candidate.outputs.arm64 }}
    env:
      GO_VERSION: '1.26.10'
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Build and verify candidate from this workflow commit
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(go env GOVERSION)" = "go${GO_VERSION}"
          node --test scripts/windows-signing-targets.test.cjs scripts/verify-agent-native-package.test.js
          mkdir -p "$RUNNER_TEMP/node-runtime"
          curl --fail --silent --show-error --location 'https://raw.githubusercontent.com/nodejs/release-keys/481637f813e912c4aa3622d7964ab426c97b8e8d/gpg/pubring.kbx' -o "$RUNNER_TEMP/node-runtime/node-release-keys.kbx"
          echo '610b8d249da3d5733f5a128def2dd0294dbbf5b5713e6ca2529db8db419dee00  '"$RUNNER_TEMP/node-runtime/node-release-keys.kbx" | sha256sum --check
          curl --fail --silent --show-error --location 'https://nodejs.org/dist/v24.18.0/SHASUMS256.txt.asc' -o "$RUNNER_TEMP/node-runtime/SHASUMS256.txt.asc"
          gpgv --keyring "$RUNNER_TEMP/node-runtime/node-release-keys.kbx" --output "$RUNNER_TEMP/node-runtime/SHASUMS256.txt" "$RUNNER_TEMP/node-runtime/SHASUMS256.txt.asc"
          grep -Fx '0ae68406b42d7725661da979b1403ec9926da205c6770827f33aac9d8f26e821  node-v24.18.0-win-x64.zip' "$RUNNER_TEMP/node-runtime/SHASUMS256.txt"
          grep -Fx 'f274669adb93b1fd0fbf8f21fd078609e9dcc84333d4f2718d2dde3f9a161a01  node-v24.18.0-win-arm64.zip' "$RUNNER_TEMP/node-runtime/SHASUMS256.txt"
          for arch in x64 arm64; do
            curl --fail --silent --show-error --location "https://nodejs.org/dist/v24.18.0/node-v24.18.0-win-${arch}.zip" -o "$RUNNER_TEMP/node-runtime/node-v24.18.0-win-${arch}.zip"
          done
          node packages/agent/scripts/pack-release.js --out-dir "$RUNNER_TEMP/agent-dist" --windows-runtime-dir "$RUNNER_TEMP/node-runtime"
          version=$(node -p "require('./packages/agent/package.json').version")
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
          for arch in amd64 arm64; do
            archive="$RUNNER_TEMP/agent-dist/tokentimer-agent-${version}-windows-${arch}.tgz"
            node scripts/verify-agent-native-package.js --archive "$archive" --go-version "$GO_VERSION" --source-sha "$GITHUB_SHA" --out "$RUNNER_TEMP/${arch}.json"
            (cd scripts/agent-release-inventory && TT_PREFLIGHT_ARCHIVE="$archive" go test -count=1 -run '^TestPreflightArchive$' .)
            echo "${arch}=$(sha256sum "$archive" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          done
      - name: Transfer unsigned candidates to the signing job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-signing-preflight-inputs
          path: ${{ runner.temp }}/agent-dist/*-windows-*.tgz
          if-no-files-found: error
          retention-days: 1

  sign:
    needs: build
    # Intentionally disabled until the environment and Azure federation have
    # been independently configured and reviewed; a missing environment can
    # otherwise be created without protection by GitHub Actions.
    # Only workflow_dispatch is enabled above, so this job cannot run yet.
    if: github.event_name == 'workflow_call' && github.repository == 'tokentimerch/tokentimer-core' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 20
    # The environment must restrict deployments to protected main and require
    # reviewers; the Azure federated credential must be restricted to this
    # repository and environment. Neither is created by this workflow.
    environment: windows-agent-signing
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            node: 9a4eb5f1c29c6a2e93852ead46b999e284a6a5ca8bab4d4e241d587d025a52de
          - arch: arm64
            node: c7225670c3f477778e18c43a55867f7a0d76468221245e5981ab80eb953c8102
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-signing-preflight-inputs
          path: ${{ runner.temp }}/agent-input
      - name: Bind transferred archive to the same-run build
        shell: pwsh
        env:
          TT_VERSION: ${{ needs.build.outputs.version }}
          TT_ARCH: ${{ matrix.arch }}
          TT_EXPECTED: ${{ matrix.arch == 'amd64' && needs.build.outputs.amd64 || needs.build.outputs.arm64 }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:TT_VERSION -cnotmatch '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' -or $env:TT_EXPECTED -cnotmatch '^[a-f0-9]{64}$') { throw 'Invalid candidate identity' }
          $archive = Join-Path $env:RUNNER_TEMP "agent-input/tokentimer-agent-$($env:TT_VERSION)-windows-$($env:TT_ARCH).tgz"
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -cne $env:TT_EXPECTED) { throw 'Candidate digest mismatch' }
          $stage = Join-Path $env:RUNNER_TEMP 'agent-stage'
          New-Item -ItemType Directory -Path $stage -ErrorAction Stop | Out-Null
          tar -xzf $archive -C $stage
          if ($LASTEXITCODE -ne 0) { throw 'Candidate extraction failed' }
      - name: Sign and verify the preflight candidate
        uses: ./.github/actions/windows-agent-sign
        with:
          package-root: ${{ runner.temp }}/agent-stage/package
          architecture: ${{ matrix.arch }}
          client-id: ${{ vars.AZURE_SIGNING_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_SIGNING_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SIGNING_SUBSCRIPTION_ID }}
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          profile-eku: ${{ vars.AZURE_SIGNING_PROFILE_EKU }}
          issuer-sha256: ${{ vars.AZURE_SIGNING_ISSUER_SHA256 }}
          node-sha256: ${{ matrix.node }}
