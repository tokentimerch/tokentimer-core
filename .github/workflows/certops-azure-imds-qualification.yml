name: "CertOps / Real Azure IMDS qualification"
on:
  workflow_dispatch:
    inputs:
      package_run_id:
        description: Successful provider qualification run ID
        type: string
        required: true
      package_artifact_id:
        description: Retained universal agent artifact ID from that run
        type: string
        required: true
      package_sha256:
        description: Exact agent archive SHA-256
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: certops-azure-imds-qualification
  cancel-in-progress: false
jobs:
  lab:
    name: IMDS qualification
    if: github.ref == 'refs/heads/main' && vars.CERTOPS_AZURE_IMDS_LAB_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: certops-azure-imds-lab
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      CERTOPS_AZURE_IMDS_LAB_ENABLED: ${{ vars.CERTOPS_AZURE_IMDS_LAB_ENABLED }}
      TT_IMDS_INDEPENDENT_TEARDOWN_READY: ${{ vars.TT_IMDS_INDEPENDENT_TEARDOWN_READY }}
      TT_IMDS_APPROVED_PLAN_SHA256: ${{ vars.TT_IMDS_APPROVED_PLAN_SHA256 }}
      TT_IMDS_PACKAGE_RUN_ID: ${{ inputs.package_run_id }}
      TT_IMDS_PACKAGE_ARTIFACT_ID: ${{ inputs.package_artifact_id }}
      TT_IMDS_PACKAGE_SHA256: ${{ inputs.package_sha256 }}
      GH_TOKEN: ${{ github.token }}
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_CORE_COLLECT_TELEMETRY: 'no'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.22.3'
      - name: Verify the retained package before Azure login
        id: verify-package
        run: |
          set -euo pipefail
          test "$TT_IMDS_INDEPENDENT_TEARDOWN_READY" = true
          [[ "$TT_IMDS_APPROVED_PLAN_SHA256" =~ ^[a-f0-9]{64}$ ]]
          node scripts/certops-final-package-source.cjs \
            "$TT_IMDS_PACKAGE_RUN_ID" "$TT_IMDS_PACKAGE_ARTIFACT_ID" "$TT_IMDS_PACKAGE_SHA256" \
            "$RUNNER_TEMP/tt-imds-candidate-$GITHUB_RUN_ID"
      - name: Authenticate the isolated IMDS lab identity
        shell: pwsh
        run: ./infra/certops-azure-keyvault/login-oidc.ps1
      - name: Run the two probes on the precreated private VMs
        id: launch
        env:
          TT_IMDS_APPROVED_PLAN_B64: ${{ secrets.TT_IMDS_APPROVED_PLAN_B64 }}
        run: |
          node infra/certops-azure-keyvault/imds/launch.cjs launch \
            "$TT_IMDS_APPROVED_PLAN_SHA256" "$RUNNER_TEMP/tt-imds-candidate-$GITHUB_RUN_ID"
      - name: Refresh ARM read access before observing independent teardown
        shell: pwsh
        run: ./infra/certops-azure-keyvault/login-oidc.ps1
      - name: Observe owned teardown and collect the verified profile
        id: collect
        run: |
          node infra/certops-azure-keyvault/imds/launch.cjs collect \
            "$TT_IMDS_APPROVED_PLAN_SHA256" "$RUNNER_TEMP/tt-imds-candidate-$GITHUB_RUN_ID" \
            > "$RUNNER_TEMP/tt-imds-result-$GITHUB_RUN_ID.json"
      - name: Scrub private runner state before exposing the profile
        id: scrub
        if: always()
        env:
          REPORT_READY: ${{ steps.collect.outcome }}
        run: |
          set -euo pipefail
          [[ "$RUNNER_TEMP" = /* && "$RUNNER_TEMP" != / ]]
          [[ "$GITHUB_RUN_ID" =~ ^[1-9][0-9]*$ && "$GITHUB_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          private="$RUNNER_TEMP/tt-kvqual-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          retained="$RUNNER_TEMP/tt-imds-candidate-$GITHUB_RUN_ID"
          report="$RUNNER_TEMP/tt-imds-result-$GITHUB_RUN_ID.json"
          rm -rf -- "$private" "$retained"
          [[ ! -e "$private" && ! -L "$private" && ! -e "$retained" && ! -L "$retained" ]]
          if [ "$REPORT_READY" = success ]; then
            test -s "$report"
            mkdir -p qualification-results
            mv -- "$report" qualification-results/azure-imds-final-package.json
          else
            rm -f -- "$report"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: success() && steps.collect.outcome == 'success' && steps.scrub.outcome == 'success'
        with:
          name: azure-imds-final-package
          path: qualification-results/azure-imds-final-package.json
          if-no-files-found: error
