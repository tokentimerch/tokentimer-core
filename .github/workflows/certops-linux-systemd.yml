name: Real Linux installer and systemd qualification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux-systemd:
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      NODE_ENV: test
      CERTOPS_ENABLED: 'true'
      CERTOPS_PROTOCOL_DISPOSABLE_STACK: '1'
      CERTOPS_LINUX_SYSTEMD_DISPOSABLE_HOST: '1'
      CERTOPS_SIGNING_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      CERTOPS_REGISTRATION_ENCRYPTION_KEY: abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: '11.13.0'
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Provision disposable migrated API database
        run: docker compose -f deploy/compose/docker-compose.test.yml up -d --build
      - name: Wait for migrated API stack
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:4000/ >/dev/null; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Qualify actual local installer and installed service
        run: |
          candidate_node="$(command -v node)"
          sudo env PATH="$PATH" GITHUB_ACTIONS=true GITHUB_SHA="$GITHUB_SHA" RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" RUNNER_TEMP="$RUNNER_TEMP" \
            NODE_ENV=test CERTOPS_ENABLED=true CERTOPS_PROTOCOL_DISPOSABLE_STACK=1 \
            CERTOPS_LINUX_SYSTEMD_DISPOSABLE_HOST=1 \
            CERTOPS_SIGNING_ENCRYPTION_KEY="$CERTOPS_SIGNING_ENCRYPTION_KEY" \
            CERTOPS_REGISTRATION_ENCRYPTION_KEY="$CERTOPS_REGISTRATION_ENCRYPTION_KEY" \
            "$candidate_node" scripts/certops-linux-systemd.js
      - name: Independently clean only receipt-owned host resources
        if: always()
        run: |
          sudo env GITHUB_ACTIONS=true RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" RUNNER_TEMP="$RUNNER_TEMP" CERTOPS_LINUX_SYSTEMD_DISPOSABLE_HOST=1 \
            "$(command -v node)" scripts/certops-linux-systemd-cleanup.js
      - name: Destroy disposable database stack
        if: always()
        run: docker compose -f deploy/compose/docker-compose.test.yml down -v --remove-orphans
      - name: Preserve sanitized qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: real-linux-systemd-${{ matrix.os }}
          path: |
            qualification-results/linux-systemd.jsonl
            qualification-results/linux-systemd-writepath.json
          if-no-files-found: error
