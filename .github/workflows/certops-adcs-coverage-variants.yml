name: "CertOps / AD CS coverage variants"
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  failed-coverage-report:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
      - name: Write failed coverage reports
        run: node -e "const files=['browser-enrollment','install-interruption','lost-submit','uncertain-abandon','cmc-renewal','safety-variants','crash-experiments']; for (const name of files) { const code=require('./scripts/certops-adcs-'+name).main(); if (code!==1) process.exit(1);} process.exit(1);"
      - name: Preserve failed coverage evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: certops-adcs-coverage-variants-failed-evidence
          retention-days: 7
          if-no-files-found: error
          path: |
            qualification-results/adcs-browser-enrollment.json
            qualification-results/adcs-install-interruption.json
            qualification-results/adcs-lost-submit.json
            qualification-results/adcs-uncertain-abandon.json
            qualification-results/adcs-cmc-renewal.json
            qualification-results/adcs-safety-variants.json
            qualification-results/adcs-crash-experiments.json
