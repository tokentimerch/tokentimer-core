name: CertOps stock Windows CNG diagnostic

on:
  push:
    branches: [feat/certops-stock-cng-calibration]
    paths:
      - '.github/workflows/certops-stock-cng-calibration.yml'
      - 'scripts/certops-stock-cng-calibration*.ps1'

permissions:
  contents: read

jobs:
  stock-cng:
    if: github.repository == 'tokentimerch/tokentimer-core'
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Read stock machine-key failure evidence
        shell: powershell
        env:
          TT_STOCK_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: ./scripts/certops-stock-cng-calibration.ps1
      - name: Retain bounded stock diagnostic receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: stock-cng-calibration
          path: qualification-results/stock-cng-calibration.json
          if-no-files-found: ignore
          retention-days: 3
