name: "CertOps / CertOps supporting integration qualification"
on:
  workflow_dispatch:
    inputs:
      group:
        description: Select one group or explicitly all supported values
        type: choice
        default: 'adcs'
        options: ['adcs', 'controller', 'inventory', 'trust', 'identity', 'jobs', 'worker', 'csr', 'import-absence', 'alerts', 'renewal-health', 'all']
permissions:
  contents: read
jobs:
  selection:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: '24'
      - id: select
        name: Validate bounded manual qualification selection
        env:
          CERTOPS_MATRIX_INPUTS_JSON: ${{ toJSON(inputs) }}
        run: node scripts/certops-manual-matrix.js integration
  integration:
    needs: selection
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.selection.outputs.matrix) }}
    env:
      NODE_ENV: test
      CERTOPS_ENABLED: 'true'
      CERTOPS_INTEGRATION_GROUP: ${{ matrix.group }}
      TEST_API_URL: http://localhost:4000
      DB_HOST: localhost
      DB_PORT: '5432'
      DB_NAME: tokentimer
      DB_USER: tokentimer
      DB_PASSWORD: password
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: '11.13.0'
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify catalog and explicit skip ownership
        run: |
          node scripts/certops-qualification-catalog.js
          pnpm run check:certops:skip-qualification
          openssl version
      - run: docker compose -f deploy/compose/docker-compose.test.yml up -d --build
      - name: Require migrated API readiness
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:4000/ >/dev/null; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Execute all selected integration cases without skips
        run: node scripts/certops-integration-qualification.js
      - name: Destroy disposable stack
        if: always()
        run: docker compose -f deploy/compose/docker-compose.test.yml down -v --remove-orphans
      - name: Preserve named sanitized execution evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: certops-integration-${{ matrix.group }}
          path: qualification-results/${{ matrix.group }}-database-integration.json
          if-no-files-found: error
