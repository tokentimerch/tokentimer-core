name: CertOps / Azure Key Vault operator qualification
on:
  workflow_dispatch:
    inputs:
      package_run_id:
        description: Trusted final-package producer run ID
        type: string
        required: true
      package_artifact_id:
        description: Immutable final-package artifact ID
        type: string
        required: true
      package_sha256:
        description: Final agent archive SHA-256
        type: string
        required: true
      location:
        description: Disposable Key Vault region
        type: choice
        options: [swedencentral, westeurope, northeurope]
        default: swedencentral

permissions:
  contents: read

concurrency:
  group: certops-azure-keyvault-provisioning
  cancel-in-progress: false

jobs:
  azure-operator:
    if: github.ref == 'refs/heads/main' && vars.CERTOPS_AZURE_KEYVAULT_LAB_ENABLED == 'true'
    environment: certops-azure-keyvault-lab
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      CERTOPS_AZURE_KEYVAULT_LAB_ENABLED: ${{ vars.CERTOPS_AZURE_KEYVAULT_LAB_ENABLED }}
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_KV_ISSUER_ROLE_ID: ${{ vars.AZURE_KV_ISSUER_ROLE_ID }}
      LAB_LOCATION: ${{ inputs.location }}
      AZURE_CORE_COLLECT_TELEMETRY: 'no'
      GH_TOKEN: ${{ github.token }}
      TT_AZURE_OPERATOR_PACKAGE_RUN_ID: ${{ inputs.package_run_id }}
      TT_AZURE_OPERATOR_PACKAGE_ARTIFACT_ID: ${{ inputs.package_artifact_id }}
      TT_AZURE_OPERATOR_PACKAGE_SHA256: ${{ inputs.package_sha256 }}
      RUN_BINDING: >-
        GITHUB_ACTIONS,GITHUB_REPOSITORY,GITHUB_REPOSITORY_ID,GITHUB_REPOSITORY_OWNER_ID,GITHUB_REF,GITHUB_WORKFLOW_REF,GITHUB_SHA,GITHUB_RUN_ID,GITHUB_RUN_ATTEMPT,GITHUB_ACTOR_ID,GITHUB_EVENT_NAME,RUNNER_ENVIRONMENT,RUNNER_TEMP,CERTOPS_AZURE_KEYVAULT_LAB_ENABLED,TT_AZURE_OPERATOR_PACKAGE_RUN_ID,TT_AZURE_OPERATOR_PACKAGE_ARTIFACT_ID,TT_AZURE_OPERATOR_PACKAGE_SHA256,GH_TOKEN
      AZURE_BINDING: >-
        AZURE_CONFIG_DIR,AZURE_CLIENT_ID,AZURE_TENANT_ID,AZURE_SUBSCRIPTION_ID,AZURE_KV_ISSUER_ROLE_ID,LAB_LOCATION,AZURE_CORE_COLLECT_TELEMETRY
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: '11.28.8'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.22.3'
      - name: Verify approval for the exact retained package
        id: approval
        env:
          TT_AZURE_LAB_SELF_APPROVAL: ${{ secrets.CERTOPS_AZURE_LAB_SELF_APPROVAL }}
        run: node infra/certops-azure-keyvault/lab.js github-approval
      - name: Authenticate the immutable producer and build the candidate images
        run: |
          set -euo pipefail
          umask 077
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node_bin="$(command -v node)"
          identity="$(sudo --non-interactive --preserve-env="$RUN_BINDING" \
            "$node_bin" tests/e2e/azure-keyvault-operator.cjs stage)"
          candidate_sha="$(printf '%s' "$identity" | "$node_bin" -pe 'JSON.parse(require("node:fs").readFileSync(0)).candidateSha')"
          [[ "$candidate_sha" =~ ^[a-f0-9]{40}$ ]]
          git merge-base --is-ancestor "$candidate_sha" "$GITHUB_SHA"
          candidate="$RUNNER_TEMP/operator-candidate"
          (umask 022 && git worktree add --detach "$candidate" "$candidate_sha")
          printf 'TT_AZURE_OPERATOR_CANDIDATE_DIR=%s\n' "$candidate" >> "$GITHUB_ENV"
          cd "$candidate"
          test "$(git rev-parse HEAD)" = "$candidate_sha"
          pnpm install --frozen-lockfile
          pnpm --filter @tokentimer/dashboard build
          for role in API WORKER ROLE; do
            case "$role" in
              API) dockerfile=deploy/compose/Dockerfile.api ;;
              WORKER) dockerfile=deploy/compose/Dockerfile.worker ;;
              ROLE) dockerfile=tests/wildcard-vault/Dockerfile.fixture ;;
            esac
            iid_file="$RUNNER_TEMP/operator-$role.iid"
            docker build --iidfile "$iid_file" --file "$dockerfile" \
              --label "io.tokentimer.certops.source-sha=$candidate_sha" .
            iid="$(cat "$iid_file")"
            [[ "$iid" =~ ^sha256:[a-f0-9]{64}$ ]]
            test "$(docker image inspect --format '{{.Id}}' "$iid")" = "$iid"
            printf 'TT_AZURE_OPERATOR_%s_IMAGE=%s\n' "$role" "$iid" >> "$GITHUB_ENV"
          done
      - name: Authenticate the existing isolated ARM provisioning identity
        id: azure-login
        shell: pwsh
        run: ./infra/certops-azure-keyvault/login-oidc.ps1
      - name: Exercise the public journey and verify owned teardown
        id: operator-journey
        env:
          TT_AZURE_LAB_SELF_APPROVAL: ${{ secrets.CERTOPS_AZURE_LAB_SELF_APPROVAL }}
          TT_AZURE_OPERATOR_APP_ROLES: ${{ secrets.CERTOPS_AZURE_OPERATOR_APP_ROLES }}
          TT_AZURE_OPERATOR_ISSUER_CERT_PEM: ${{ secrets.CERTOPS_AZURE_OPERATOR_ISSUER_CERT_PEM }}
          TT_AZURE_OPERATOR_ISSUER_KEY_PEM: ${{ secrets.CERTOPS_AZURE_OPERATOR_ISSUER_KEY_PEM }}
          TT_AZURE_OPERATOR_CONSUMER_CERT_PEM: ${{ secrets.CERTOPS_AZURE_OPERATOR_CONSUMER_CERT_PEM }}
          TT_AZURE_OPERATOR_CONSUMER_KEY_PEM: ${{ secrets.CERTOPS_AZURE_OPERATOR_CONSUMER_KEY_PEM }}
        run: |
          set -euo pipefail
          sudo --non-interactive --preserve-env="$RUN_BINDING,$AZURE_BINDING,TT_AZURE_LAB_SELF_APPROVAL,TT_AZURE_OPERATOR_CANDIDATE_DIR,TT_AZURE_OPERATOR_API_IMAGE,TT_AZURE_OPERATOR_WORKER_IMAGE,TT_AZURE_OPERATOR_ROLE_IMAGE,TT_AZURE_OPERATOR_APP_ROLES,TT_AZURE_OPERATOR_ISSUER_CERT_PEM,TT_AZURE_OPERATOR_ISSUER_KEY_PEM,TT_AZURE_OPERATOR_CONSUMER_CERT_PEM,TT_AZURE_OPERATOR_CONSUMER_KEY_PEM" \
            "$(command -v node)" tests/e2e/azure-keyvault-operator.cjs run
      - name: Refresh ARM authentication for the independent cleanup
        id: cleanup-login
        if: always() && steps.approval.outcome == 'success' && steps.azure-login.outcome == 'success'
        shell: pwsh
        run: ./infra/certops-azure-keyvault/login-oidc.ps1
      - name: Verify cleanup from the owned lease even after a failed journey
        id: operator-cleanup
        if: always() && steps.cleanup-login.outcome == 'success'
        run: |
          set -euo pipefail
          sudo --non-interactive --preserve-env="$RUN_BINDING,$AZURE_BINDING" \
            "$(command -v node)" tests/e2e/azure-keyvault-operator.cjs cleanup
      - name: Copy only the validated report to the artifact directory
        if: success() && steps.operator-journey.outcome == 'success' && steps.operator-cleanup.outcome == 'success'
        run: |
          set -euo pipefail
          umask 077
          mkdir qualification-results
          report="$RUNNER_TEMP/tt-kvqual-$GITHUB_RUN_ID-1/operator/evidence/azure-operator-final-package.json"
          size="$(sudo --non-interactive stat -c %s -- "$report")"
          (( size > 0 && size < 131072 ))
          sudo --non-interactive cat -- "$report" > qualification-results/azure-operator-final-package.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: success() && steps.operator-journey.outcome == 'success' && steps.operator-cleanup.outcome == 'success'
        with:
          name: azure-operator-final-package
          path: qualification-results/azure-operator-final-package.json
          if-no-files-found: error
