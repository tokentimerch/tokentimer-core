name: CertOps / AD CS and Vault supporting checks
'on':
  push:
    branches:
      - main
    paths:
      - scripts/certops-adcs-*
      - scripts/certops_adcs_*
      - scripts/certops-distribution-*
      - scripts/certops-qualification-*
      - scripts/certops-release-*
      - scripts/certops-stack-*
      - scripts/certops-api-qualification.js
      - scripts/certops-workflow-security*
      - scripts/certops-scoped-inventory.test.js
      - scripts/certops-native-issuer-reassignment*
      - scripts/fixtures/certops-adcs-*
      - scripts/certops-retention*
      - scripts/run-certops-*
      - scripts/ci-guards/certops-*
      - tests/wildcard-vault/**
      - tests/e2e/helpers/certops-adcs-*
      - tests/e2e/certops-adcs-*
      - tests/e2e/certops-enrollment-*
      - tests/e2e/helpers/certops-native-issuer-reassignment.js
      - infra/certops-adcs/**
      - packages/agent/src/windows-adcs/**
      - packages/agent/src/material-store/**
      - docs/certops/qualification-suites.json
      - docs/certops/qualification-suites.json
      - package.json
      - pnpm-lock.yaml
      - .github/workflows/certops-qualification.yml
      - .github/workflows/certops-*adcs*.yml
      - .github/workflows/certops-native-issuer-reassignment.yml
      - .github/workflows/certops-distribution-qualification.yml
  workflow_dispatch:
    inputs:
      lane:
        description: Tooling only, or tooling plus disposable API and database tests
        type: choice
        default: tooling
        options:
          - tooling
          - stack
          - all
permissions:
  contents: read
concurrency:
  group: certops-qualification-${{ github.ref }}
  cancel-in-progress: false
jobs:
  tooling:
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2025
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.13.0
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Expose hosted Git OpenSSL on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $candidates = @(
            'C:\Program Files\Git\usr\bin\openssl.exe',
            'C:\Program Files\Git\mingw64\bin\openssl.exe',
            (Get-Command openssl.exe -ErrorAction SilentlyContinue).Source
          )
          $openssl = $candidates | Where-Object { $_ -and (Test-Path -LiteralPath $_ -PathType Leaf) } | Select-Object -First 1
          if (!$openssl) { throw 'OpenSSL prerequisite missing' }
          & $openssl version
          if ($LASTEXITCODE -ne 0) { throw 'OpenSSL prerequisite unusable' }
          Split-Path -Parent $openssl | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - run: pnpm run test:certops:qualification
      - run: pnpm run test:certops:release-collector
      - name: Validate exact scoped inventories
        run: |
          node scripts/certops-adcs-safety-inventory.js
          node scripts/certops-distribution-inventory.js
          node scripts/certops-integration-inventory.js
          node scripts/certops-qualification-catalog.js
  adcs-api:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.lane != 'tooling'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CERTOPS_ENABLED: 'true'
      CERTOPS_E2E_REQUIRED: '1'
      CERTOPS_CSR_DISPOSABLE_STACK: '1'
      CERTOPS_CSR_API_URL: http://localhost:4000
      CERTOPS_API_REPORTS_DIR: qualification-results/api
      CERTOPS_API_WORKER_FIXTURE_KEY: test-session-secret-key
      CERTOPS_SIGNING_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      CERTOPS_REGISTRATION_ENCRYPTION_KEY: abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789
      NODE_ENV: test
      DB_HOST: localhost
      DB_PORT: '5432'
      DB_NAME: tokentimer
      DB_USER: tokentimer
      DB_PASSWORD: password
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.13.0
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: docker compose -f deploy/compose/docker-compose.test.yml up -d --build
      - name: Require migrated API readiness
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:4000/ >/dev/null; then exit 0; fi
            sleep 2
          done
          exit 1
      - run: node scripts/certops-api-qualification.js
      - name: Destroy only the disposable test stack
        if: always()
        run: docker compose -f deploy/compose/docker-compose.test.yml down -v --remove-orphans
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: certops-adcs-api
          path: qualification-results/api/
          if-no-files-found: error
  integration:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.lane != 'tooling'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      NODE_ENV: test
      CERTOPS_ENABLED: 'true'
      CERTOPS_INTEGRATION_GROUP: adcs
      TEST_API_URL: http://localhost:4000
      DB_HOST: localhost
      DB_PORT: '5432'
      DB_NAME: tokentimer
      DB_USER: tokentimer
      DB_PASSWORD: password
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.13.0
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify catalog and explicit skip ownership
        run: |
          node scripts/certops-qualification-catalog.js
          openssl version
      - run: docker compose -f deploy/compose/docker-compose.test.yml up -d --build
      - name: Require migrated API readiness
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:4000/ >/dev/null; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Execute all selected integration cases without skips
        run: node scripts/certops-integration-qualification.js
      - name: Destroy disposable stack
        if: always()
        run: docker compose -f deploy/compose/docker-compose.test.yml down -v --remove-orphans
      - name: Preserve named sanitized execution evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: certops-integration-adcs
          path: qualification-results/adcs-database-integration.json
          if-no-files-found: error
