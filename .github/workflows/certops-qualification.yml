name: CertOps host qualification

on:
  push:
    branches: [main]
    paths:
      - 'packages/agent/**'
      - 'apps/api/**'
      - 'apps/worker/**'
      - 'tests/e2e/**'
      - 'scripts/qualification/**'
      - 'scripts/certops-*.js'
      - 'tests/qualification/**'
      - 'tests/integration/certops-*.json'
      - 'tests/integration/certops-*.test.js'
      - 'tests/integration/import-cleanup*.test.js'
      - 'packages/shared/**'
      - 'packages/contracts/**'
      - 'docs/certops/**'
      - 'deploy/compose/**'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/certops-qualification.yml'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: certops-qualification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CERTOPS_HOST_TESTS: '1'
      CERTOPS_QUALIFICATION_STRICT: '1'
      CERTOPS_QUALIFICATION_REPORT: qualification-results/windows.json
      CERTOPS_HOST_ARTIFACTS: qualification-results/host
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: '11.13.0'
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate qualification catalog and skip ownership
        run: |
          node scripts/certops-qualification-catalog.js
          pnpm run check:certops:skip-qualification
      - name: Expose shipped Git OpenSSL and fail if missing
        shell: pwsh
        run: |
          $opensslDirectories = @('C:\Program Files\Git\usr\bin', 'C:\Program Files\Git\mingw64\bin')
          $directory = $opensslDirectories | Where-Object { Test-Path (Join-Path $_ 'openssl.exe') } | Select-Object -First 1
          if (-not $directory) { throw 'OpenSSL prerequisite missing from hosted Git installation' }
          $directory | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          & (Join-Path $directory 'openssl.exe') version
          if ($LASTEXITCODE -ne 0) { throw 'OpenSSL prerequisite unusable' }
      - name: Enable hosted IIS without reboot
        shell: pwsh
        run: |
          $result = Install-WindowsFeature Web-Server,Web-Scripting-Tools -IncludeManagementTools
          if (-not $result.Success -or $result.RestartNeeded -ne 'No') {
            throw 'Hosted IIS installation failed or requires reboot; qualification unsupported on this image'
          }
      - name: Real Windows discovery CNG IIS and supporting Go checks
        run: node --test packages/agent/scripts/host/windows-host.test.js
      - name: Assert required host scenarios executed
        run: node scripts/certops-qualification-report.js qualification-results/windows.json
      - name: Preserve execution evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: certops-${{ matrix.os }}
          path: qualification-results/
          if-no-files-found: error
  agent-stack:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CERTOPS_E2E_REQUIRED: '1'
      CERTOPS_PROTOCOL_DISPOSABLE_STACK: '1'
      CERTOPS_ENABLED: 'true'
      CERTOPS_SIGNING_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      CERTOPS_REGISTRATION_ENCRYPTION_KEY: abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789
      NODE_ENV: test
      DB_HOST: localhost
      DB_PORT: '5432'
      DB_NAME: tokentimer
      DB_USER: tokentimer
      DB_PASSWORD: password
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: '11.13.0'
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate qualification catalog and skip ownership
        run: |
          node scripts/certops-qualification-catalog.js
          pnpm run check:certops:skip-qualification
      - run: docker compose -f deploy/compose/docker-compose.test.yml up -d --build
      - name: Wait for migrations and API readiness
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:4000/ >/dev/null; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Execute required agent API and worker journeys
        run: |
          mkdir -p qualification-results
          node --test --test-reporter=junit --test-reporter-destination=qualification-results/agent-stack.xml --test-reporter=./scripts/certops-stack-reporter.js --test-reporter-destination=qualification-results/agent-protocol.jsonl tests/e2e/certops-agent-e2e.test.js
      - name: Assert every mandatory protocol journey ran
        run: node scripts/certops-stack-report.js qualification-results/agent-protocol.jsonl
      - name: Required authenticated Certificate API scenarios
        env:
          CERTOPS_CSR_API_URL: http://localhost:4000
          CERTOPS_CSR_DISPOSABLE_STACK: '1'
          CERTOPS_API_REPORTS_DIR: qualification-results/api
          CERTOPS_API_WORKER_FIXTURE_KEY: test-session-secret-key
        run: node scripts/certops-api-qualification.js
      - name: Linux OpenSSL discovery parser regression prerequisites
        env:
          CERTOPS_REPORT_SCOPE: openssl-discovery-parser-regression
        run: |
          openssl version
          node --test --test-reporter=./scripts/certops-stack-reporter.js --test-reporter-destination=qualification-results/linux-discovery.jsonl packages/agent/src/discovery/windows.test.js
          node scripts/certops-linux-discovery-report.js qualification-results/linux-discovery.jsonl
      - name: Collect stack diagnostics
        if: always()
        run: |
          mkdir -p qualification-results
          docker compose -f deploy/compose/docker-compose.test.yml ps > qualification-results/compose-state.txt
      - name: Destroy disposable stack
        if: always()
        run: docker compose -f deploy/compose/docker-compose.test.yml down -v --remove-orphans
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: certops-agent-stack
          path: qualification-results/
          if-no-files-found: error
