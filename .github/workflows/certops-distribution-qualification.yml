name: "CertOps / Distribution supporting E2E"
on:
  workflow_dispatch:
    inputs:
      native_vault_cleanup:
        description: Run only the installed Linux cleanup restart case
        type: boolean
        default: false
      native_cleanup_provider:
        description: KV v2 provider for the installed cleanup case
        type: choice
        options: [vault-kv2, openbao-kv2]
        default: vault-kv2
      native_linux_staging:
        description: Run only installed Linux staging outside activation
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: certops-distribution-${{ github.ref }}
  cancel-in-progress: false
jobs:
  postgres:
    if: github.ref == 'refs/heads/main' && !inputs.native_vault_cleanup && !inputs.native_linux_staging
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/certops-node-setup
      - run: node scripts/certops-distribution-postgres.js
      - name: Real isolated Vault adapter and ACL regressions
        if: ${{ !cancelled() }}
        run: node scripts/certops-distribution-vault.js
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: distribution-postgres
          path: |
            qualification-results/distribution-postgres-*/*.jsonl
            qualification-results/distribution-postgres-*/summary.json
            qualification-results/distribution-vault-*/*.jsonl
            qualification-results/distribution-vault-*/summary.json
          if-no-files-found: error
  agent-lab:
    if: github.ref == 'refs/heads/main' && !inputs.native_vault_cleanup && !inputs.native_linux_staging
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        certificate-mode: [ordinary, san, wildcard]
    env:
      LAB_PROJECT: tt-wildcard-ux-ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.certificate-mode }}
      CERTIFICATE_MODE: ${{ matrix.certificate-mode }}
      CERTOPS_DISTRIBUTION_QUALIFICATION: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/certops-node-setup
      - run: pnpm exec playwright install --with-deps chromium
      - name: Build and start uniquely owned lab
        shell: pwsh
        run: ./tests/wildcard-vault/ux-lab/run.ps1 -Action Up -Project $env:LAB_PROJECT -BasePort 60800 -CertificateMode $env:CERTIFICATE_MODE -BuildImages
      - name: Execute all mandatory API, agent and browser phases
        shell: pwsh
        run: ./tests/wildcard-vault/ux-lab/run.ps1 -Action Test -Project $env:LAB_PROJECT
      - name: Verify supporting scope and copy only public evidence
        shell: bash
        run: |
          set -euo pipefail
          node scripts/certops-distribution-report.js ".scratch/$LAB_PROJECT/qualification.json"
          mkdir -p qualification-results/distribution
          cp ".scratch/$LAB_PROJECT/qualification.json" qualification-results/distribution/
          cp ".scratch/$LAB_PROJECT/privacy.json" qualification-results/distribution/
          cp ".scratch/$LAB_PROJECT/"distribution-*.png qualification-results/distribution/
      - name: Preserve failed bounded qualification report
        if: always()
        shell: bash
        run: |
          mkdir -p qualification-results/distribution
          if test -f ".scratch/$LAB_PROJECT/qualification.json"; then
            cp ".scratch/$LAB_PROJECT/qualification.json" qualification-results/distribution/
          fi
      - name: Stop focused lab before package acceptance
        shell: pwsh
        run: ./tests/wildcard-vault/ux-lab/run.ps1 -Action Stop -Project $env:LAB_PROJECT
      - name: Run packaged agent and Vault AppRole operator acceptance
        shell: pwsh
        run: |
          $images=Get-Content ".scratch/$env:LAB_PROJECT/runtime-images.json" -Raw | ConvertFrom-Json
          $env:TT_UX_API_IMAGE=$images.api
          $env:TT_UX_WORKER_IMAGE=$images.worker
          $env:TT_UX_CUSTOMER_IMAGE=$images.customers
          $packageProject="$env:LAB_PROJECT-package"
          ./tests/wildcard-vault/ux-lab/run.ps1 -Action Up -Project $packageProject -BasePort 60800 -CertificateMode $env:CERTIFICATE_MODE -PackageAcceptance
          ./tests/wildcard-vault/ux-lab/run.ps1 -Action Test -Project $packageProject
          node scripts/certops-distribution-report.js ".scratch/$packageProject/qualification.json"
          if($LASTEXITCODE -ne 0){throw 'Package acceptance report verification failed'}
      - name: Copy only package acceptance public receipts
        if: always()
        shell: bash
        run: |
          mkdir -p qualification-results/operator-package
          for file in qualification.json privacy.json agent-package/artifact.json; do
            if test -f ".scratch/$LAB_PROJECT-package/$file"; then
              cp ".scratch/$LAB_PROJECT-package/$file" qualification-results/operator-package/
            fi
          done
      - name: Preserve package acceptance public receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: operator-acceptance-vault-${{ matrix.certificate-mode }}
          path: qualification-results/operator-package/
          if-no-files-found: warn
      - name: Stop the owned package lab
        if: always()
        shell: pwsh
        run: ./tests/wildcard-vault/ux-lab/run.ps1 -Action Stop -Project "$env:LAB_PROJECT-package"
      - name: Stop only the owned lab
        if: always()
        shell: pwsh
        run: ./tests/wildcard-vault/ux-lab/run.ps1 -Action Stop -Project $env:LAB_PROJECT
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: distribution-agent-${{ matrix.certificate-mode }}
          path: qualification-results/distribution/
          if-no-files-found: error
  functional-summary:
    needs: [postgres, agent-lab]
    if: ${{ always() && github.ref == 'refs/heads/main' && !inputs.native_vault_cleanup && !inputs.native_linux_staging }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: distribution-*
          path: qualification-results/cohorts
      - name: Require all seven current-candidate supporting cohorts
        if: always()
        env:
          DISTRIBUTION_POSTGRES_RESULT: ${{ needs.postgres.result }}
          DISTRIBUTION_AGENT_LAB_RESULT: ${{ needs.agent-lab.result }}
        run: node scripts/certops-distribution-functional-summary.js qualification-results/cohorts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: distribution-functional-summary
          path: qualification-results/distribution-functional-summary.json
          if-no-files-found: error
  native-vault-cleanup:
    if: github.ref == 'refs/heads/main' && (inputs.native_vault_cleanup || inputs.native_linux_staging)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NATIVE_CLEANUP_STORE: ${{ inputs.native_cleanup_provider == 'openbao-kv2' && 'openbao' || 'vault' }}
      NATIVE_CASE: ${{ inputs.native_linux_staging && 'staging' || (inputs.native_cleanup_provider == 'openbao-kv2' && 'openbao-cleanup' || 'vault-cleanup') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/certops-node-setup
      - name: Build the Linux candidate once
        id: package
        env:
          CLEANUP_SELECTED: ${{ inputs.native_vault_cleanup }}
        run: |
          set -euo pipefail
          if [[ "$NATIVE_CASE" == staging && ( "$CLEANUP_SELECTED" == true || "$NATIVE_CLEANUP_STORE" != vault ) ]]; then
            echo "Select only the Linux staging case and leave its provider at Vault."
            exit 1
          fi
          candidate="$RUNNER_TEMP/certops-linux-$NATIVE_CASE"
          node scripts/certops-agent-package.js "build-linux-$NATIVE_CASE" "$candidate"
          node -p '"sha256=" + require(process.argv[1]).sha256' "$candidate/artifact.json" >> "$GITHUB_OUTPUT"
          cp "$candidate/artifact.json" "$candidate/artifacts/"
      - name: Scan the exact unpacked Linux candidate
        env:
          GRYPE_CHECK_FOR_APP_UPDATE: 'false'
        run: |
          set -euo pipefail
          scan="$(mktemp -d "$RUNNER_TEMP/native-cleanup-scan.XXXXXX")"
          trap 'rm -rf "$scan"' EXIT
          mkdir "$scan/package"
          archive=("$RUNNER_TEMP/certops-linux-$NATIVE_CASE/artifacts/"*.tgz)
          test "${#archive[@]}" = 1
          tar -xzf "${archive[0]}" -C "$scan/package"
          curl -fsSL https://github.com/anchore/grype/releases/download/v0.112.0/grype_0.112.0_linux_amd64.tar.gz -o "$scan/grype.tgz"
          echo "acb14a030010fe9bdb9594b4ae108d9d14ef2f926d936aa0916dc62c89c058ea  $scan/grype.tgz" | sha256sum -c -
          tar -xzf "$scan/grype.tgz" -C "$scan" grype
          "$scan/grype" "dir:$scan/package" --fail-on high --only-fixed -o json --file "$scan/security.json"
      - name: Stage only the verified candidate files
        env:
          EXPECTED_ARCHIVE_SHA256: ${{ steps.package.outputs.sha256 }}
        run: |
          set -euo pipefail
          source="$RUNNER_TEMP/certops-linux-$NATIVE_CASE/artifacts"
          archive=("$source"/*.tgz)
          test "${#archive[@]}" = 1
          test -f "$source/artifact.json" && test ! -L "$source/artifact.json"
          test -f "${archive[0]}" && test ! -L "${archive[0]}"
          test -f "${archive[0]}.sha256" && test ! -L "${archive[0]}.sha256"
          (cd "$source" && sha256sum -c "$(basename "${archive[0]}").sha256")
          node -e 'const fs=require("fs"),crypto=require("crypto"),path=require("path"),assert=require("assert/strict"),file=process.argv[1],receipt=JSON.parse(fs.readFileSync(process.argv[2])); const sha=crypto.createHash("sha256").update(fs.readFileSync(file)).digest("hex"); assert.match(process.env.EXPECTED_ARCHIVE_SHA256,/^[a-f0-9]{64}$/); assert.equal(sha,process.env.EXPECTED_ARCHIVE_SHA256); assert.equal(receipt.sha256,sha); assert.equal(receipt.archive,path.basename(file));' "${archive[0]}" "$source/artifact.json"
          mkdir -p qualification-results
          destination="qualification-results/linux-$NATIVE_CASE-candidate"
          mkdir "$destination"
          cp -- "$source/artifact.json" "${archive[0]}" "${archive[0]}.sha256" "$destination/"
          cmp -- "$source/artifact.json" "$destination/artifact.json"
          cmp -- "${archive[0]}" "$destination/$(basename "${archive[0]}")"
          cmp -- "${archive[0]}.sha256" "$destination/$(basename "${archive[0]}").sha256"
          (cd "$destination" && sha256sum -c "$(basename "${archive[0]}").sha256")
      - name: Retain the immutable Linux candidate
        if: always()
        id: candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: linux-${{ env.NATIVE_CASE }}-candidate
          path: qualification-results/linux-${{ env.NATIVE_CASE }}-candidate/
          if-no-files-found: error
      - name: Run the selected installed restart case
        env:
          TT_CLEANUP_ARTIFACT_ID: ${{ steps.candidate.outputs.artifact-id }}
          TT_CLEANUP_ARTIFACT_SHA256: ${{ steps.package.outputs.sha256 }}
        run: |
          mode="--native-$NATIVE_CLEANUP_STORE-restart"
          if [[ "$NATIVE_CASE" == staging ]]; then mode=--native-staging; fi
          sudo env PATH="$PATH" GITHUB_ACTIONS=true GITHUB_SHA="$GITHUB_SHA" GITHUB_REF="$GITHUB_REF" \
            GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" RUNNER_TEMP="$RUNNER_TEMP" CERTOPS_LINUX_SYSTEMD_DISPOSABLE_HOST=1 \
            TT_CLEANUP_ARTIFACT_ID="$TT_CLEANUP_ARTIFACT_ID" TT_CLEANUP_ARTIFACT_SHA256="$TT_CLEANUP_ARTIFACT_SHA256" \
            "$(command -v node)" scripts/run-cleanup-completion-acceptance.cjs "$mode"
      - name: Verify teardown of only the owned host and containers
        if: always()
        run: |
          mode="--cleanup-native-$NATIVE_CLEANUP_STORE"
          if [[ "$NATIVE_CASE" == staging ]]; then mode=--cleanup-native-staging; fi
          sudo env PATH="$PATH" GITHUB_ACTIONS=true GITHUB_SHA="$GITHUB_SHA" GITHUB_REF="$GITHUB_REF" \
            GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" RUNNER_TEMP="$RUNNER_TEMP" CERTOPS_LINUX_SYSTEMD_DISPOSABLE_HOST=1 \
            "$(command -v node)" scripts/run-cleanup-completion-acceptance.cjs "$mode"
      - name: Preserve the native case receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: linux-${{ env.NATIVE_CASE }}-receipt
          path: qualification-results/linux-${{ env.NATIVE_CASE }}-restart.json
          if-no-files-found: error
      - name: Preserve the bounded native failure report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: linux-${{ env.NATIVE_CASE }}-failure
          path: qualification-results/linux-${{ env.NATIVE_CASE }}-failure.json
          if-no-files-found: warn
