name: "CertOps / Native AD CS issuer reassignment"
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-issuer-reassignment:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      CERTOPS_NATIVE_ISSUER_REASSIGNMENT_REPORT: qualification-results/native-issuer-reassignment.json
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: "24"
      - name: Refuse qualification without an attached disposable forest
        shell: pwsh
        run: node tests/e2e/helpers/certops-native-issuer-reassignment.js
      - name: Require a completed strict native report
        if: always()
        shell: pwsh
        run: node -e "const r=require('./qualification-results/native-issuer-reassignment.json');const {verifyReport}=require('./scripts/certops-qualification-report');const {verifyProof}=require('./tests/e2e/helpers/certops-native-issuer-reassignment');if(r.status!=='passed'||r.cleanup?.status!=='passed'||r.nativeCell==='qualified')throw Error('Native issuer reassignment is not qualified');verifyProof(r.nativeIssuerReassignment);if(verifyReport(r).length)throw Error('Strict qualification report rejected')"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: certops-native-issuer-reassignment
          path: qualification-results/native-issuer-reassignment.json
          if-no-files-found: error
