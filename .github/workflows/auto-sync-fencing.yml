name: Auto-sync PostgreSQL regressions

on:
  push:
    branches: [main, master]
    paths:
      - "apps/api/**"
      - "apps/worker/src/**"
      - "tests/postgres/**"
      - "deploy/prometheus/**"
      - "deploy/helm/examples/values*.yaml"
      - "scripts/test-auto-sync-*.cjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/auto-sync-fencing.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fencing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.4-alpine
        env:
          POSTGRES_DB: tokentimer_issue71_test
          POSTGRES_USER: tokentimer
          POSTGRES_PASSWORD: local-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tokentimer -d tokentimer_issue71_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_USER: tokentimer
      DB_PASSWORD: local-test-only
      DB_NAME: tokentimer_issue71_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: "11.28.8"
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node apps/api/migrations/migrate.js
      - run: pnpm test:auto-sync:postgres
      - run: pnpm test:auto-sync:alerts
