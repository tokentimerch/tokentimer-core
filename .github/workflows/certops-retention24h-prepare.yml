# Explicit cost-bearing native day-long resident test. No hosted runner waits24h.
name: "CertOps / Prepare real native24h retention"
on:
  workflow_dispatch:
# Approval must never occupy the independent cleanup queue. No resources exist
# before approval; the entire 180-minute job ends before its four-hour lease.
concurrency:
  group: certops-retention24h-prepare-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false
permissions:
  contents: read
  actions: read
  id-token: write
jobs:
  prepare:
    if: github.ref == 'refs/heads/main' && vars.CERTOPS_ADCS_LAB_ENABLED == 'true'
    runs-on: ubuntu-24.04
    environment: certops-adcs-lab
    timeout-minutes: 180
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      GH_TOKEN: ${{ github.token }}
      LAB_GROUP: tt-certops-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: "24"
      - name: Check bounded controller and lease contracts before provisioning
        run: node --test scripts/certops-retention24h-contract.test.js scripts/certops-retention24h-azure.test.js
      - name: Create unique owned keeper nonce
        shell: bash
        run: echo "CERTOPS_RETENTION24H_NONCE=$(node -e 'process.stdout.write(require("node:crypto").randomBytes(32).toString("hex"))')" >> "$GITHUB_ENV"
      - name: Authenticate isolated lab identity
        shell: pwsh
        run: ./infra/certops-adcs/login-oidc.ps1
      - name: Prepare actual AD CS cutover and resident SYSTEM collector
        shell: pwsh
        run: ./infra/certops-adcs/provision-lab.ps1 -ResourceGroup $env:LAB_GROUP -Hours 4 -WindowsVersion 2022 -Language en-US -Retention24hPrepare 1 -Retention24hNonce $env:CERTOPS_RETENTION24H_NONCE
      - name: Seal independently verified original four-hour ownership
        run: node scripts/certops-retention24h-azure.js seal
      - name: Upload immutable original receipt before any extension
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: retention24h-original-${{ github.run_attempt }}-${{ env.CERTOPS_RETENTION24H_NONCE }}
          path: qualification-results/retention24h-original.json
          if-no-files-found: error
          retention-days: 7
      - name: Download original artifact and reverify custody before bounded handoff
        run: node scripts/certops-retention24h-azure.js handoff
      - name: Seal immutable controller ownership receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: retention24h-prepare-ownership-${{ github.run_attempt }}-${{ env.CERTOPS_RETENTION24H_NONCE }}
          path: qualification-results/retention24h-ownership.json
          if-no-files-found: error
          retention-days: 7
      - name: Preserve bounded cost and orphan receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: retention24h-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            qualification-results/retention24h-cost.json
            qualification-results/retention24h-controller-failure-abort-*.json
          if-no-files-found: warn
          retention-days: 7
      - name: Destroy owned lab if preparation or artifact handoff fails
        if: failure() || cancelled()
        run: node scripts/certops-retention24h-azure.js abort
