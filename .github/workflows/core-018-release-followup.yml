name: "Core 0.18 / Distribution acceptance follow-up"

on:
  push:
    branches: [release-prep/core-0.18.0-evidence]
    paths:
      - .github/workflows/core-018-release-followup.yml
      - tests/wildcard-vault/ux-lab/compose.yaml
      - tests/wildcard-vault/ux-lab/journey.cjs
      - tests/wildcard-vault/ux-lab/onboarding-redo.cjs
      - docs/certops/qualification-suites.json
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  packages: read

concurrency:
  group: core-018-followup-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  TRUSTED_MAIN_SHA: fcc681c19314b7c2432973ce99d517af36e10238
  CORE_SOURCE_SHA: b1b92cb36de0ef0d8647f1122d18b075d06c17ea
  ARTIFACT_SOURCE_SHA: 69387d85231f242d00f653bbde94ead373fefe1e

jobs:
  dashboard-artifact:
    name: Corrected production dashboard image without publication
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify reviewed dashboard source
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$TRUSTED_MAIN_SHA" origin/main
          git merge-base --is-ancestor "$TRUSTED_MAIN_SHA" "$CORE_SOURCE_SHA"
          git merge-base --is-ancestor "$CORE_SOURCE_SHA" HEAD
          git diff --exit-code "$CORE_SOURCE_SHA" HEAD -- apps/dashboard package.json pnpm-lock.yaml pnpm-workspace.yaml .npmrc .dockerignore deploy/compose
      - name: Build the actual production Dockerfile locally
        run: |
          mkdir -p dashboard-acceptance
          docker build --pull --file deploy/compose/Dockerfile.dashboard --tag "tt-core-018-dashboard:$GITHUB_SHA" .
          docker image inspect --format '{{json .}}' "tt-core-018-dashboard:$GITHUB_SHA" > "$RUNNER_TEMP/dashboard-inspect.json"
          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const raw = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/dashboard-inspect.json'));
          const files = ['deploy/compose/Dockerfile.dashboard', 'deploy/compose/nginx.conf', 'deploy/compose/docker-entrypoint-dashboard.sh', 'apps/dashboard/src/pages/UserPreferences.jsx', 'package.json', 'pnpm-lock.yaml'];
          const sourceFiles = files.map(file => ({file, sha256: crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex')}));
          fs.writeFileSync('dashboard-acceptance/image-provenance.json', JSON.stringify({
            schemaVersion: 1, sourceSha: process.env.GITHUB_SHA, reviewedProductSourceSha: process.env.CORE_SOURCE_SHA,
            runId: Number(process.env.GITHUB_RUN_ID), runAttempt: Number(process.env.GITHUB_RUN_ATTEMPT),
            imageConfigDigest: raw.Id, architecture: raw.Architecture, os: raw.Os,
            rootFsLayers: raw.RootFS.Layers, user: raw.Config.User, sourceFiles,
            published: false, registryManifestDigestClaimed: false
          }, null, 2));
          NODE
      - name: Smoke the owned production container
        run: |
          container="tt-core-018-dashboard-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          docker run --detach --name "$container" --publish 127.0.0.1::8080 "tt-core-018-dashboard:$GITHUB_SHA"
          trap 'docker rm --force "$container" >/dev/null' EXIT
          address="$(docker port "$container" 8080/tcp)"
          curl --fail --silent --show-error --retry 20 --retry-connrefused --retry-delay 1 --max-time 5 "http://$address/" > dashboard-acceptance/index.html
          node <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const html = fs.readFileSync('dashboard-acceptance/index.html', 'utf8');
          const asset = [...html.matchAll(/src="([^"]+)"/g)].map(match => match[1]).find(src => src.startsWith('/assets/') && src.endsWith('.js'));
          assert.ok(asset, 'Production HTML must reference its actual built application');
          fs.writeFileSync('dashboard-acceptance/entry-asset-path.txt', asset);
          NODE
          asset="$(cat dashboard-acceptance/entry-asset-path.txt)"
          curl --fail --silent --show-error "http://$address$asset" > dashboard-acceptance/entry-asset.js
          test -s dashboard-acceptance/entry-asset.js
          sha256sum dashboard-acceptance/index.html dashboard-acceptance/entry-asset.js > dashboard-acceptance/smoke.sha256
      - name: Scan the actual local production image
        env:
          GRYPE_CHECK_FOR_APP_UPDATE: "false"
        run: |
          curl --fail --silent --show-error --location https://github.com/anchore/grype/releases/download/v0.112.0/grype_0.112.0_linux_amd64.tar.gz -o "$RUNNER_TEMP/grype.tar.gz"
          echo "acb14a030010fe9bdb9594b4ae108d9d14ef2f926d936aa0916dc62c89c058ea  $RUNNER_TEMP/grype.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/dashboard-grype"
          tar -xzf "$RUNNER_TEMP/grype.tar.gz" -C "$RUNNER_TEMP/dashboard-grype" grype
          "$RUNNER_TEMP/dashboard-grype/grype" "docker:tt-core-018-dashboard:$GITHUB_SHA" --output json --file dashboard-acceptance/security-all.json
          GRYPE_DB_AUTO_UPDATE=false "$RUNNER_TEMP/dashboard-grype/grype" "docker:tt-core-018-dashboard:$GITHUB_SHA" --fail-on high --only-fixed --output json --file dashboard-acceptance/security-gate.json
      - name: Preserve the exact unpublished image archive
        run: |
          docker save "tt-core-018-dashboard:$GITHUB_SHA" | gzip -n > dashboard-acceptance/dashboard-image.tar.gz
          (cd dashboard-acceptance && sha256sum dashboard-image.tar.gz > dashboard-image.tar.gz.sha256)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: core-018-corrected-dashboard
          path: dashboard-acceptance/
          if-no-files-found: error

  postgres:
    name: Current source PostgreSQL and real Vault
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: candidate
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Verify actual fixture source and unchanged trusted product
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$TRUSTED_MAIN_SHA" origin/main
          git merge-base --is-ancestor "$TRUSTED_MAIN_SHA" "$CORE_SOURCE_SHA"
          git merge-base --is-ancestor "$CORE_SOURCE_SHA" HEAD
          git diff --exit-code "$TRUSTED_MAIN_SHA" "$CORE_SOURCE_SHA" -- apps packages package.json pnpm-lock.yaml pnpm-workspace.yaml .npmrc .dockerignore deploy/compose ':!apps/dashboard/src/pages/UserPreferences.jsx' ':!apps/dashboard/tests/unit/UserPreferences.workspaceReset.test.jsx' ':!packages/agent/windows-service-host/host_test.go' ':!packages/agent/windows-service-host/testdata/mock-agent.js'
          git diff --exit-code "$CORE_SOURCE_SHA" HEAD -- apps packages package.json pnpm-lock.yaml pnpm-workspace.yaml .npmrc .dockerignore deploy/compose deploy/helm
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: '11.13.0'
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: candidate/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Verify report, fixture-source and aggregate guards
        run: node --test scripts/certops-distribution-report.test.js scripts/certops-distribution-functional-summary.test.js
      - run: node scripts/certops-distribution-postgres.js
      - name: Real isolated Vault adapter and ACL regressions
        if: ${{ !cancelled() }}
        run: node scripts/certops-distribution-vault.js
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: distribution-postgres
          path: |
            candidate/qualification-results/distribution-postgres-*/*.jsonl
            candidate/qualification-results/distribution-postgres-*/summary.json
            candidate/qualification-results/distribution-vault-*/*.jsonl
            candidate/qualification-results/distribution-vault-*/summary.json
          if-no-files-found: error

  agent-lab:
    name: Current source distribution (${{ matrix.certificate-mode }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        certificate-mode: [ordinary, san, wildcard]
    defaults:
      run:
        working-directory: candidate
    env:
      LAB_PROJECT: tt-wildcard-ux-ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.certificate-mode }}
      CERTIFICATE_MODE: ${{ matrix.certificate-mode }}
      CERTOPS_DISTRIBUTION_QUALIFICATION: '1'
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Verify actual fixture source and unchanged trusted product
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$TRUSTED_MAIN_SHA" origin/main
          git merge-base --is-ancestor "$TRUSTED_MAIN_SHA" "$CORE_SOURCE_SHA"
          git merge-base --is-ancestor "$CORE_SOURCE_SHA" HEAD
          git diff --exit-code "$TRUSTED_MAIN_SHA" "$CORE_SOURCE_SHA" -- apps packages package.json pnpm-lock.yaml pnpm-workspace.yaml .npmrc .dockerignore deploy/compose ':!apps/dashboard/src/pages/UserPreferences.jsx' ':!apps/dashboard/tests/unit/UserPreferences.workspaceReset.test.jsx' ':!packages/agent/windows-service-host/host_test.go' ':!packages/agent/windows-service-host/testdata/mock-agent.js'
          git diff --exit-code "$CORE_SOURCE_SHA" HEAD -- apps packages package.json pnpm-lock.yaml pnpm-workspace.yaml .npmrc .dockerignore deploy/compose deploy/helm
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: '11.13.0'
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: candidate/pnpm-lock.yaml
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.10'
          cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Build and start uniquely owned lab
        shell: pwsh
        run: ./tests/wildcard-vault/ux-lab/run.ps1 -Action Up -Project $env:LAB_PROJECT -BasePort 60800 -CertificateMode $env:CERTIFICATE_MODE -BuildImages
      - name: Execute mandatory API, agent and browser phases
        shell: pwsh
        run: ./tests/wildcard-vault/ux-lab/run.ps1 -Action Test -Project $env:LAB_PROJECT
      - name: Verify actual candidate and copy only public evidence
        run: |
          node -e 'const fs=require("node:fs");const {verify}=require("./scripts/certops-distribution-report");console.log(verify(JSON.parse(fs.readFileSync(process.argv[1])),process.env.GITHUB_SHA));' ".scratch/$LAB_PROJECT/qualification.json"
          mkdir -p qualification-results/distribution
          cp ".scratch/$LAB_PROJECT/qualification.json" qualification-results/distribution/
          cp ".scratch/$LAB_PROJECT/privacy.json" qualification-results/distribution/
          cp ".scratch/$LAB_PROJECT/onboarding-redo.json" qualification-results/distribution/
          cp ".scratch/$LAB_PROJECT/"distribution-*.png qualification-results/distribution/
      - name: Preserve failed bounded report
        if: always()
        run: |
          mkdir -p qualification-results/distribution
          if test -f ".scratch/$LAB_PROJECT/qualification.json"; then
            cp ".scratch/$LAB_PROJECT/qualification.json" qualification-results/distribution/
          fi
      - name: Stop focused lab before package acceptance
        shell: pwsh
        run: ./tests/wildcard-vault/ux-lab/run.ps1 -Action Stop -Project $env:LAB_PROJECT
      - name: Packaged agent and Vault AppRole operator acceptance
        shell: pwsh
        run: |
          $images=Get-Content ".scratch/$env:LAB_PROJECT/runtime-images.json" -Raw | ConvertFrom-Json
          $env:TT_UX_API_IMAGE=$images.api
          $env:TT_UX_WORKER_IMAGE=$images.worker
          $env:TT_UX_CUSTOMER_IMAGE=$images.customers
          $packageProject="$env:LAB_PROJECT-package"
          ./tests/wildcard-vault/ux-lab/run.ps1 -Action Up -Project $packageProject -BasePort 60800 -CertificateMode $env:CERTIFICATE_MODE -PackageAcceptance
          ./tests/wildcard-vault/ux-lab/run.ps1 -Action Test -Project $packageProject
          node -e 'const fs=require("node:fs");const {verify}=require("./scripts/certops-distribution-report");console.log(verify(JSON.parse(fs.readFileSync(process.argv[1])),process.env.GITHUB_SHA));' ".scratch/$packageProject/qualification.json"
          if($LASTEXITCODE -ne 0){throw 'Package acceptance report verification failed'}
      - name: Copy only package acceptance public receipts
        if: always()
        run: |
          mkdir -p qualification-results/operator-package
          for file in qualification.json privacy.json agent-package/artifact.json onboarding-redo.json distribution-onboarding-redo.png; do
            if test -f ".scratch/$LAB_PROJECT-package/$file"; then
              cp ".scratch/$LAB_PROJECT-package/$file" qualification-results/operator-package/
            fi
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: operator-acceptance-vault-${{ matrix.certificate-mode }}
          path: candidate/qualification-results/operator-package/
          if-no-files-found: warn
      - name: Stop owned package lab
        if: always()
        shell: pwsh
        run: ./tests/wildcard-vault/ux-lab/run.ps1 -Action Stop -Project "$env:LAB_PROJECT-package"
      - name: Stop owned source lab
        if: always()
        shell: pwsh
        run: ./tests/wildcard-vault/ux-lab/run.ps1 -Action Stop -Project $env:LAB_PROJECT
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: distribution-agent-${{ matrix.certificate-mode }}
          path: candidate/qualification-results/distribution/
          if-no-files-found: error

  functional-summary:
    needs: [postgres, agent-lab]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '24'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: distribution-*
          path: qualification-results/cohorts
      - name: Verify all seven actual-source supporting cohorts
        env:
          POSTGRES_RESULT: ${{ needs.postgres.result }}
          AGENT_LAB_RESULT: ${{ needs.agent-lab.result }}
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const {verify} = require('./scripts/certops-distribution-functional-summary');
          assert.equal(process.env.POSTGRES_RESULT, 'success');
          assert.equal(process.env.AGENT_LAB_RESULT, 'success');
          const report = verify('qualification-results/cohorts', process.env.GITHUB_SHA);
          fs.writeFileSync('qualification-results/distribution-functional-summary.json', JSON.stringify(report, null, 2) + '\n');
          console.log(JSON.stringify({status: report.status, candidateSha: report.candidateSha, qualificationStatus: report.qualificationStatus}));
          NODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: distribution-functional-summary
          path: qualification-results/distribution-functional-summary.json
          if-no-files-found: error
