name: "Core 0.18 / Distribution acceptance follow-up"

on:
  push:
    branches: [release-prep/core-0.18.0-evidence]
    paths:
      - .github/workflows/core-018-release-followup.yml
      - tests/wildcard-vault/ux-lab/compose.yaml
      - tests/wildcard-vault/ux-lab/journey.cjs
      - tests/wildcard-vault/ux-lab/onboarding-redo.cjs
      - docs/certops/qualification-suites.json
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  packages: read

concurrency:
  group: core-018-followup-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  CORE_SOURCE_SHA: fcc681c19314b7c2432973ce99d517af36e10238
  ARTIFACT_SOURCE_SHA: 69387d85231f242d00f653bbde94ead373fefe1e

jobs:
  stable-helm:
    name: Preserve validated stable Helm candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.CORE_SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Package the trusted chart without publication
        run: |
          test "$(git rev-parse HEAD)" = "$CORE_SOURCE_SHA"
          git merge-base --is-ancestor "$CORE_SOURCE_SHA" origin/main
          curl --fail --silent --show-error --location https://get.helm.sh/helm-v3.20.1-linux-amd64.tar.gz -o "$RUNNER_TEMP/helm.tar.gz"
          echo "0165ee4a2db012cc657381001e593e981f42aa5707acdd50658326790c9d0dc3  $RUNNER_TEMP/helm.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/helm.tar.gz" -C "$RUNNER_TEMP" linux-amd64/helm
          helm="$RUNNER_TEMP/linux-amd64/helm"
          mkdir -p stable-helm
          "$helm" package deploy/helm --destination stable-helm
          "$helm" lint stable-helm/tokentimer-0.18.0.tgz --set config.adminEmail=ci@example.com
          "$helm" template tokentimer stable-helm/tokentimer-0.18.0.tgz --set config.adminEmail=ci@example.com > stable-helm/rendered.yaml
          "$helm" show chart stable-helm/tokentimer-0.18.0.tgz > stable-helm/chart-metadata.yaml
          (cd stable-helm && sha256sum tokentimer-0.18.0.tgz > tokentimer-0.18.0.tgz.sha256)
          printf '%s\n' "$CORE_SOURCE_SHA" > stable-helm/source-sha.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: core-018-stable-helm
          path: stable-helm/
          if-no-files-found: error

  postgres:
    name: Current source PostgreSQL and real Vault
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: candidate
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Verify actual fixture source and unchanged trusted product
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$CORE_SOURCE_SHA" origin/main
          git diff --exit-code "$CORE_SOURCE_SHA" HEAD -- apps packages package.json pnpm-lock.yaml pnpm-workspace.yaml .npmrc .dockerignore deploy/compose ':!packages/agent/windows-service-host/host_test.go' ':!packages/agent/windows-service-host/testdata/mock-agent.js'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: '11.13.0'
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: candidate/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Verify report, fixture-source and aggregate guards
        run: node --test scripts/certops-distribution-report.test.js scripts/certops-distribution-functional-summary.test.js
      - run: node scripts/certops-distribution-postgres.js
      - name: Real isolated Vault adapter and ACL regressions
        if: ${{ !cancelled() }}
        run: node scripts/certops-distribution-vault.js
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: distribution-postgres
          path: |
            candidate/qualification-results/distribution-postgres-*/*.jsonl
            candidate/qualification-results/distribution-postgres-*/summary.json
            candidate/qualification-results/distribution-vault-*/*.jsonl
            candidate/qualification-results/distribution-vault-*/summary.json
          if-no-files-found: error

  agent-lab:
    name: Current source distribution (${{ matrix.certificate-mode }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        certificate-mode: [ordinary, san, wildcard]
    defaults:
      run:
        working-directory: candidate
    env:
      LAB_PROJECT: tt-wildcard-ux-ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.certificate-mode }}
      CERTIFICATE_MODE: ${{ matrix.certificate-mode }}
      CERTOPS_DISTRIBUTION_QUALIFICATION: '1'
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Verify actual fixture source and unchanged trusted product
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$CORE_SOURCE_SHA" origin/main
          git diff --exit-code "$CORE_SOURCE_SHA" HEAD -- apps packages package.json pnpm-lock.yaml pnpm-workspace.yaml .npmrc .dockerignore deploy/compose ':!packages/agent/windows-service-host/host_test.go' ':!packages/agent/windows-service-host/testdata/mock-agent.js'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: '11.13.0'
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: candidate/pnpm-lock.yaml
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.10'
          cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Build and start uniquely owned lab
        shell: pwsh
        run: ./tests/wildcard-vault/ux-lab/run.ps1 -Action Up -Project $env:LAB_PROJECT -BasePort 60800 -CertificateMode $env:CERTIFICATE_MODE -BuildImages
      - name: Execute mandatory API, agent and browser phases
        shell: pwsh
        run: ./tests/wildcard-vault/ux-lab/run.ps1 -Action Test -Project $env:LAB_PROJECT
      - name: Verify actual candidate and copy only public evidence
        run: |
          node -e 'const fs=require("node:fs");const {verify}=require("./scripts/certops-distribution-report");console.log(verify(JSON.parse(fs.readFileSync(process.argv[1])),process.env.GITHUB_SHA));' ".scratch/$LAB_PROJECT/qualification.json"
          mkdir -p qualification-results/distribution
          cp ".scratch/$LAB_PROJECT/qualification.json" qualification-results/distribution/
          cp ".scratch/$LAB_PROJECT/privacy.json" qualification-results/distribution/
          cp ".scratch/$LAB_PROJECT/onboarding-redo.json" qualification-results/distribution/
          cp ".scratch/$LAB_PROJECT/"distribution-*.png qualification-results/distribution/
      - name: Preserve failed bounded report
        if: always()
        run: |
          mkdir -p qualification-results/distribution
          if test -f ".scratch/$LAB_PROJECT/qualification.json"; then
            cp ".scratch/$LAB_PROJECT/qualification.json" qualification-results/distribution/
          fi
      - name: Stop focused lab before package acceptance
        shell: pwsh
        run: ./tests/wildcard-vault/ux-lab/run.ps1 -Action Stop -Project $env:LAB_PROJECT
      - name: Packaged agent and Vault AppRole operator acceptance
        shell: pwsh
        run: |
          $images=Get-Content ".scratch/$env:LAB_PROJECT/runtime-images.json" -Raw | ConvertFrom-Json
          $env:TT_UX_API_IMAGE=$images.api
          $env:TT_UX_WORKER_IMAGE=$images.worker
          $env:TT_UX_CUSTOMER_IMAGE=$images.customers
          $packageProject="$env:LAB_PROJECT-package"
          ./tests/wildcard-vault/ux-lab/run.ps1 -Action Up -Project $packageProject -BasePort 60800 -CertificateMode $env:CERTIFICATE_MODE -PackageAcceptance
          ./tests/wildcard-vault/ux-lab/run.ps1 -Action Test -Project $packageProject
          node -e 'const fs=require("node:fs");const {verify}=require("./scripts/certops-distribution-report");console.log(verify(JSON.parse(fs.readFileSync(process.argv[1])),process.env.GITHUB_SHA));' ".scratch/$packageProject/qualification.json"
          if($LASTEXITCODE -ne 0){throw 'Package acceptance report verification failed'}
      - name: Copy only package acceptance public receipts
        if: always()
        run: |
          mkdir -p qualification-results/operator-package
          for file in qualification.json privacy.json agent-package/artifact.json onboarding-redo.json distribution-onboarding-redo.png; do
            if test -f ".scratch/$LAB_PROJECT-package/$file"; then
              cp ".scratch/$LAB_PROJECT-package/$file" qualification-results/operator-package/
            fi
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: operator-acceptance-vault-${{ matrix.certificate-mode }}
          path: candidate/qualification-results/operator-package/
          if-no-files-found: warn
      - name: Stop owned package lab
        if: always()
        shell: pwsh
        run: ./tests/wildcard-vault/ux-lab/run.ps1 -Action Stop -Project "$env:LAB_PROJECT-package"
      - name: Stop owned source lab
        if: always()
        shell: pwsh
        run: ./tests/wildcard-vault/ux-lab/run.ps1 -Action Stop -Project $env:LAB_PROJECT
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: distribution-agent-${{ matrix.certificate-mode }}
          path: candidate/qualification-results/distribution/
          if-no-files-found: error

  functional-summary:
    needs: [postgres, agent-lab]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '24'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: distribution-*
          path: qualification-results/cohorts
      - name: Verify all seven actual-source supporting cohorts
        env:
          POSTGRES_RESULT: ${{ needs.postgres.result }}
          AGENT_LAB_RESULT: ${{ needs.agent-lab.result }}
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const {verify} = require('./scripts/certops-distribution-functional-summary');
          assert.equal(process.env.POSTGRES_RESULT, 'success');
          assert.equal(process.env.AGENT_LAB_RESULT, 'success');
          const report = verify('qualification-results/cohorts', process.env.GITHUB_SHA);
          fs.writeFileSync('qualification-results/distribution-functional-summary.json', JSON.stringify(report, null, 2) + '\n');
          console.log(JSON.stringify({status: report.status, candidateSha: report.candidateSha, qualificationStatus: report.qualificationStatus}));
          NODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: distribution-functional-summary
          path: qualification-results/distribution-functional-summary.json
          if-no-files-found: error
