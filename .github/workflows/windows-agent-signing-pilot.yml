name: Qualify the Windows agent signing pilot

on:
  workflow_dispatch:
    inputs:
      expected_main_sha:
        description: Exact reviewed Core main workflow commit
        required: true
        type: string
      reviewed_source_sha:
        description: Exact approved Windows agent source commit
        required: true
        type: string

permissions: {}

concurrency:
  group: windows-agent-signing-pilot
  cancel-in-progress: false

env:
  PILOT_SOURCE: '9c47d07bb7c4e4763e83c0bc1b590fea0e89f924'
  PILOT_VERSION: '0.20.0'
  PILOT_NODE_VERSION: '24.22.3'
  PILOT_GO_VERSION: '1.26.11'
  PILOT_NODE_ZIP_HASH: 'e612af99f626ab415ea225af6bce5c971feb448cb5cae250bb1c3fa50c5f7d9f'
  PILOT_NODE_EXE_HASH: '86fc4785327db5f5c7558dc6156c543b433c313e813a222e088086222ab4afa6'
  GOTOOLCHAIN: local

jobs:
  build:
    if: github.repository == 'tokentimerch/tokentimer-core' && github.ref == 'refs/heads/main' && github.sha == inputs.expected_main_sha && inputs.reviewed_source_sha == '9c47d07bb7c4e4763e83c0bc1b590fea0e89f924'
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      archive_sha256: ${{ steps.package.outputs.sha256 }}
      artifact_id: ${{ steps.artifact.outputs.artifact-id }}
    steps:
      - name: Require the exact signed Core source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/commits/$PILOT_SOURCE" |
            jq -e --arg expected "$PILOT_SOURCE" '.sha == $expected and .commit.verification.verified == true' >/dev/null

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.PILOT_SOURCE }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.PILOT_NODE_VERSION }}
          package-manager-cache: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.PILOT_GO_VERSION }}
          cache: false

      - name: Build the pinned Windows source without production credentials
        id: package
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PILOT_SOURCE"
          test "$(go env GOVERSION)" = "go$PILOT_GO_VERSION"
          test "$(node -p "require('./packages/agent/package.json').version")" = "$PILOT_VERSION"
          runtime="$RUNNER_TEMP/node-runtime"
          mkdir -m 700 "$runtime"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            'https://raw.githubusercontent.com/nodejs/release-keys/481637f813e912c4aa3622d7964ab426c97b8e8d/gpg/pubring.kbx' \
            -o "$runtime/node-release-keys.kbx"
          printf '%s  %s\n' '610b8d249da3d5733f5a128def2dd0294dbbf5b5713e6ca2529db8db419dee00' \
            "$runtime/node-release-keys.kbx" | sha256sum --check
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            "https://nodejs.org/dist/v$PILOT_NODE_VERSION/SHASUMS256.txt.asc" -o "$runtime/SHASUMS256.txt.asc"
          gpgv --keyring "$runtime/node-release-keys.kbx" --output "$runtime/SHASUMS256.txt" "$runtime/SHASUMS256.txt.asc"
          grep -Fx "$PILOT_NODE_ZIP_HASH  node-v$PILOT_NODE_VERSION-win-x64.zip" "$runtime/SHASUMS256.txt"
          grep -Fx "b3cc74a295b39d4f273271e96f58c06dd2b35757ca12abec64c7d0598b434f14  node-v$PILOT_NODE_VERSION-win-arm64.zip" "$runtime/SHASUMS256.txt"
          # The producer prepares both upstream runtime inputs. Only the amd64 output is transferred.
          for arch in x64 arm64; do
            file="node-v$PILOT_NODE_VERSION-win-$arch.zip"
            curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
              "https://nodejs.org/dist/v$PILOT_NODE_VERSION/$file" -o "$runtime/$file"
          done
          node packages/agent/scripts/pack-release.js --out-dir "$RUNNER_TEMP/agent-build" --windows-runtime-dir "$runtime" --windows-store-iis-qualification
          # The full packer also rebuilds these tracked Linux binaries. The pilot
          # transfers the Windows archive only. Restore the unrelated build outputs
          # before the provenance check verifies the unchanged source checkout.
          git restore --source="$PILOT_SOURCE" --worktree -- \
            packages/agent/bin/tokentimer-observed-revocation-linux-amd64 \
            packages/agent/bin/tokentimer-observed-revocation-linux-arm64
          name="tokentimer-agent-$PILOT_VERSION-windows-amd64.tgz"
          output="$RUNNER_TEMP/windows-pilot-unsigned"
          mkdir -m 700 "$output"
          archive="$output/$name"
          mv "$RUNNER_TEMP/agent-build/$name" "$archive"
          # Bind the capability profile before the same-run signing handoff.
          node - "$archive" <<'NODE'
          const assert = require("node:assert/strict");
          const { execFileSync } = require("node:child_process");
          const base = require("./packages/agent/src/capabilities/qualified-capabilities.json").qualified;
          const { renderGeneratedModule } = require("./packages/agent/scripts/build-qualified-capabilities.js");
          const expected = [...base, "windows-store-only-adcs-v1", "windows-store-iis-consumers-v1"];
          function read(name) {
            return execFileSync("tar", ["-xOzf", process.argv[2], "package/src/capabilities/" + name], { encoding: "utf8" });
          }
          assert.deepEqual(JSON.parse(read("qualified-capabilities.json")).qualified, expected);
          assert.equal(read("qualified-capabilities.generated.js"), renderGeneratedModule(expected));
          NODE
          node scripts/verify-agent-native-package.js --archive "$archive" --go-version "$PILOT_GO_VERSION" \
            --source-sha "$PILOT_SOURCE" --out "$output/native-provenance.json"
          digest=$(sha256sum "$archive" | cut -d ' ' -f 1)
          jq -n --arg source "$PILOT_SOURCE" --arg workflow "$GITHUB_SHA" --arg run "$GITHUB_RUN_ID" \
            --arg attempt "$GITHUB_RUN_ATTEMPT" --arg name "$name" --arg sha "$digest" \
            '{sourceCommit:$source,workflowCommit:$workflow,runId:$run,runAttempt:$attempt,archive:$name,sha256:$sha}' \
            > "$output/producer.json"
          echo "sha256=$digest" >> "$GITHUB_OUTPUT"

      - name: Transfer only unsigned amd64 input and provenance
        id: artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-pilot-unsigned-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/windows-pilot-unsigned/tokentimer-agent-0.20.0-windows-amd64.tgz
            ${{ runner.temp }}/windows-pilot-unsigned/producer.json
            ${{ runner.temp }}/windows-pilot-unsigned/native-provenance.json
          if-no-files-found: error
          retention-days: 1

  sign-amd64:
    if: github.repository == 'tokentimerch/tokentimer-core' && github.ref == 'refs/heads/main' && github.sha == inputs.expected_main_sha && inputs.reviewed_source_sha == '9c47d07bb7c4e4763e83c0bc1b590fea0e89f924'
    needs: build
    environment: windows-agent-signing
    permissions:
      contents: read
      id-token: write
    runs-on: windows-2025
    timeout-minutes: 35
    env:
      GOPROXY: 'off'
      PILOT_UNSIGNED_SHA256: ${{ needs.build.outputs.archive_sha256 }}
      PILOT_UNSIGNED_ARTIFACT: ${{ needs.build.outputs.artifact_id }}
      PILOT_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
      PILOT_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
      PILOT_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
      PILOT_PROFILE_EKU: ${{ vars.AZURE_SIGNING_PROFILE_EKU }}
      PILOT_ISSUER_SHA256: ${{ vars.AZURE_SIGNING_ISSUER_SHA256 }}
      PILOT_LAB_RECIPIENT: ${{ vars.WINDOWS_SIGNING_LAB_RECIPIENT }}
    steps:
      # Only reviewed main tooling is checked out on the worker with OIDC.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.PILOT_NODE_VERSION }}
          package-manager-cache: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.PILOT_GO_VERSION }}
          cache: false

      - name: Prepare a private Windows stage with the verified lab recipient
        id: stage
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD) -cne $env:GITHUB_SHA) { throw 'Wrong trusted workflow checkout' }
          $private = & ./scripts/windows-signing-pilot-stage.ps1 -RunnerTemp $env:RUNNER_TEMP
          "path=$private" >> $env:GITHUB_OUTPUT
          "PILOT_STAGE=$private" >> $env:GITHUB_ENV
          & ./scripts/windows-signing-pilot.ps1 -Operation Initialize -Stage $private

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: ${{ steps.stage.outputs.path }}/unsigned
          merge-multiple: true
          digest-mismatch: error

      - name: Bind and extract the exact same-run unsigned archive as data
        shell: pwsh
        run: ./scripts/windows-signing-pilot.ps1 -Operation Extract -Stage $env:PILOT_STAGE

      - name: Sign and verify only the fourteen approved first-party files
        uses: ./.github/actions/windows-agent-sign
        with:
          package-root: ${{ steps.stage.outputs.path }}/files/package
          architecture: amd64
          client-id: ${{ vars.AZURE_SIGNING_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_SIGNING_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SIGNING_SUBSCRIPTION_ID }}
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          profile-eku: ${{ vars.AZURE_SIGNING_PROFILE_EKU }}
          issuer-sha256: ${{ vars.AZURE_SIGNING_ISSUER_SHA256 }}
          node-sha256: ${{ env.PILOT_NODE_EXE_HASH }}

      - name: Build the final archive, SBOM and exact inventory on this worker
        id: inventory
        shell: pwsh
        run: ./scripts/windows-signing-pilot.ps1 -Operation Inventory -Stage $env:PILOT_STAGE

      - name: Sign the exact bound pilot inventory
        shell: pwsh
        env:
          PILOT_INVENTORY_SHA256: ${{ steps.inventory.outputs.sha256 }}
        run: ./scripts/windows-signing-pilot.ps1 -Operation SignInventory -Stage $env:PILOT_STAGE

      - name: Verify CMS and seal all lab files to the protected recipient key
        shell: pwsh
        env:
          PILOT_INVENTORY_SHA256: ${{ steps.inventory.outputs.sha256 }}
        run: ./scripts/windows-signing-pilot.ps1 -Operation Seal -Stage $env:PILOT_STAGE

      - name: Upload only the encrypted lab handoff and its receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-amd64-pilot-sealed-${{ github.run_attempt }}
          path: |
            ${{ steps.stage.outputs.path }}/sealed/windows-amd64-pilot.zip.age
            ${{ steps.stage.outputs.path }}/sealed/receipt.json
          if-no-files-found: error
          retention-days: 1
