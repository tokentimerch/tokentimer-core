# Manual script proof for deterministic interruption recovery.
# This is host-integration evidence. It is not power-loss durability and it is not a real reboot.
# Dispatch does not stop a service, kill a process, or qualify a native host.
name: "CertOps / Installed Windows interruption recovery script proof"
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  script-proof:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - name: Validate interruption recovery guards
        run: node --test scripts/certops-windows-installed-interruption.test.js
