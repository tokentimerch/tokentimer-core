name: "CertOps / Real Azure Key Vault qualification"
on:
  workflow_dispatch:
    inputs:
      location:
        description: Approved lab subscription region (one Standard vault, no VMs)
        type: choice
        options: [swedencentral, westeurope, northeurope]
        default: swedencentral
      final_package:
        description: Qualify one retained universal 0.20.0 package with OpenBao and Azure enabled
        type: boolean
        default: false
      package_sha256:
        description: Expected universal package SHA-256 for final_package or natural_expiry
        type: string
        default: ''
      natural_expiry:
        description: Observe natural Key Vault access-token expiry on the retained provider candidate
        type: boolean
        default: false
      package_run_id:
        description: Successful final-package provider run ID (natural_expiry only)
        type: string
        default: ''
      package_artifact_id:
        description: Immutable universal candidate artifact ID from that run (natural_expiry only)
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: certops-azure-keyvault-provisioning
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    outputs:
      artifact_id: ${{ steps.package.outputs.artifact-id }}
    steps:
      - name: Reject untrusted refs and absent spending opt-in before any credentials
        env:
          OPT_IN: ${{ vars.CERTOPS_AZURE_KEYVAULT_LAB_ENABLED }}
          FINAL_PACKAGE: ${{ inputs.final_package }}
          NATURAL_EXPIRY: ${{ inputs.natural_expiry }}
          PACKAGE_SHA256: ${{ inputs.package_sha256 }}
          PACKAGE_RUN_ID: ${{ inputs.package_run_id }}
          PACKAGE_ARTIFACT_ID: ${{ inputs.package_artifact_id }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main || { echo 'Trusted main required'; exit 1; }
          test "$GITHUB_EVENT_NAME" = workflow_dispatch || exit 1
          test "$OPT_IN" = true || { echo 'Explicit Key Vault lab opt-in required'; exit 1; }
          if [ "$FINAL_PACKAGE" = true ] || [ "$NATURAL_EXPIRY" = true ]; then [[ "$PACKAGE_SHA256" =~ ^[a-f0-9]{64}$ ]]; fi
          if [ "$NATURAL_EXPIRY" = true ]; then
            test "$FINAL_PACKAGE" = false
            [[ "$PACKAGE_RUN_ID" =~ ^[1-9][0-9]{0,15}$ && "$PACKAGE_ARTIFACT_ID" =~ ^[1-9][0-9]{0,15}$ ]]
          else
            test -z "$PACKAGE_RUN_ID" && test -z "$PACKAGE_ARTIFACT_ID"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.3"
      - name: Require independently approved main-only environment and active cleanup
        env:
          GH_TOKEN: ${{ github.token }}
          CERTOPS_AZURE_KEYVAULT_LAB_ENABLED: ${{ vars.CERTOPS_AZURE_KEYVAULT_LAB_ENABLED }}
        run: node infra/certops-azure-keyvault/lab.js github-preflight
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        if: inputs.final_package
        with:
          go-version: '1.26.10'
          cache: false
      - name: Build and verify the universal package before Azure authentication
        if: inputs.final_package
        env:
          GOTOOLCHAIN: local
          GOFLAGS: -buildvcs=false
          CERTOPS_AZURE_KEYVAULT_LAB_ENABLED: ${{ vars.CERTOPS_AZURE_KEYVAULT_LAB_ENABLED }}
          PACKAGE_SHA256: ${{ inputs.package_sha256 }}
        run: |
          set -euo pipefail
          source="$RUNNER_TEMP/azure-release-candidate"
          node scripts/certops-azure-keyvault-package.cjs build "$source" "$PACKAGE_SHA256"
          destination=qualification-results/azure-release-candidate
          mkdir -p "$destination"
          cp "$source/artifacts/artifact.json" "$source/artifacts/"*.tgz "$source/artifacts/"*.sha256 "$destination/"
      - name: Scan the retained candidate for fixed High and Critical advisories
        if: inputs.final_package
        env:
          GRYPE_CHECK_FOR_APP_UPDATE: 'false'
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            https://github.com/anchore/grype/releases/download/v0.112.0/grype_0.112.0_linux_amd64.tar.gz \
            -o "$RUNNER_TEMP/grype.tar.gz"
          echo "acb14a030010fe9bdb9594b4ae108d9d14ef2f926d936aa0916dc62c89c058ea  $RUNNER_TEMP/grype.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/core-grype" "$RUNNER_TEMP/agent-extracted"
          tar -xzf "$RUNNER_TEMP/grype.tar.gz" -C "$RUNNER_TEMP/core-grype" grype
          tar -xzf qualification-results/azure-release-candidate/tokentimer-agent-0.20.0.tgz -C "$RUNNER_TEMP/agent-extracted"
          "$RUNNER_TEMP/core-grype/grype" "dir:$RUNNER_TEMP/agent-extracted" --fail-on high --only-fixed --quiet
      - name: Retain only the verified universal candidate
        id: package
        if: inputs.final_package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: azure-release-candidate
          path: qualification-results/azure-release-candidate/
          if-no-files-found: error
  lab:
    needs: preflight
    if: github.ref == 'refs/heads/main' && vars.CERTOPS_AZURE_KEYVAULT_LAB_ENABLED == 'true' && !inputs.natural_expiry
    runs-on: ubuntu-latest
    environment: certops-azure-keyvault-lab
    timeout-minutes: 90
    outputs:
      evidence_id: ${{ steps.evidence.outputs.artifact-id }}
    permissions:
      contents: read
      actions: read
      id-token: write
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: kvqual
          POSTGRES_PASSWORD: isolated-ci-fixture-only
          POSTGRES_DB: kvqual
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U kvqual" --health-interval 5s --health-retries 12
    env:
      CERTOPS_AZURE_KEYVAULT_LAB_ENABLED: ${{ vars.CERTOPS_AZURE_KEYVAULT_LAB_ENABLED }}
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_KV_ISSUER_ROLE_ID: ${{ vars.AZURE_KV_ISSUER_ROLE_ID }}
      AZURE_KV_ATTRIBUTES_ROLE_ID: ${{ vars.AZURE_KV_ATTRIBUTES_ROLE_ID }}
      LAB_LOCATION: ${{ inputs.location }}
      GH_TOKEN: ${{ github.token }}
      NODE_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_USER: kvqual
      DB_PASSWORD: isolated-ci-fixture-only
      DB_NAME: kvqual
      TT_REAL_AZURE: "1"
      TT_AZURE_QUALIFICATION_REQUIRED: "1"
      TT_AZURE_FINAL_PACKAGE: ${{ inputs.final_package && '1' || '0' }}
      TT_AZURE_PACKAGE_ARTIFACT_ID: ${{ needs.preflight.outputs.artifact_id }}
      TT_AZURE_PACKAGE_SHA256: ${{ inputs.package_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.3"
      - name: Verify the protected approval before Azure authentication
        id: independent-approval
        env:
          TT_AZURE_LAB_SELF_APPROVAL: ${{ secrets.CERTOPS_AZURE_LAB_SELF_APPROVAL }}
        run: node infra/certops-azure-keyvault/lab.js github-approval
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: "11.28.8"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: ${{ !inputs.final_package }}
        with:
          go-version: "1.27.3"
          cache: false
      - run: pnpm install --frozen-lockfile
      - name: Download the exact candidate selected before credentials
        if: inputs.final_package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.preflight.outputs.artifact_id }}
          path: ${{ runner.temp }}/azure-release-candidate/artifacts
          merge-multiple: true
          digest-mismatch: error
      - name: Authenticate isolated provisioning identity using OIDC
        shell: pwsh
        run: ./infra/certops-azure-keyvault/login-oidc.ps1
      - name: Check actual permissions and provision only the run-owned vault and identities
        run: node infra/certops-azure-keyvault/lab.js provision
      - name: Prepare the verified package and real identities
        run: node tests/e2e/azure-keyvault-real.cjs prepare
      - name: Run existing Azure baseline against Microsoft Azure
        run: node --test tests/e2e/material-providers-real.test.js
      - name: Execute mandatory provider and signed agent/PostgreSQL integration campaign
        run: node tests/e2e/azure-keyvault-real.cjs run
      - name: Verify sanitized campaign evidence
        run: node scripts/certops-azure-keyvault-report.js qualification-results/azure-keyvault-evidence.json
      - name: Reauthenticate for cleanup even after cancellation or failed qualification
        if: always() && steps.independent-approval.outcome == 'success'
        shell: pwsh
        run: ./infra/certops-azure-keyvault/login-oidc.ps1
      - name: Remove only verified run-owned resources; never purge
        if: always() && steps.independent-approval.outcome == 'success'
        run: node infra/certops-azure-keyvault/lab.js cleanup
      - name: Remove private local credentials and staging
        if: always()
        run: node tests/e2e/azure-keyvault-real.cjs scrub
      - name: Check evidence allowlist before upload
        id: evidence-check
        if: always()
        run: node scripts/certops-azure-keyvault-report.js --artifact-check qualification-results
      - name: Upload only sanitized evidence, never packages or credential files
        id: evidence
        if: always() && steps.evidence-check.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: azure-keyvault-sanitized-evidence
          path: |
            qualification-results/azure-keyvault-evidence.json
            qualification-results/azure-keyvault-cleanup.json
          if-no-files-found: error

  natural-expiry:
    needs: preflight
    if: github.ref == 'refs/heads/main' && vars.CERTOPS_AZURE_KEYVAULT_LAB_ENABLED == 'true' && inputs.natural_expiry
    runs-on: ubuntu-latest
    environment: certops-azure-keyvault-lab
    timeout-minutes: 125
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      CERTOPS_AZURE_KEYVAULT_LAB_ENABLED: ${{ vars.CERTOPS_AZURE_KEYVAULT_LAB_ENABLED }}
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_KV_ISSUER_ROLE_ID: ${{ vars.AZURE_KV_ISSUER_ROLE_ID }}
      AZURE_KV_ATTRIBUTES_ROLE_ID: ${{ vars.AZURE_KV_ATTRIBUTES_ROLE_ID }}
      LAB_LOCATION: ${{ inputs.location }}
      GH_TOKEN: ${{ github.token }}
      AZURE_CORE_COLLECT_TELEMETRY: 'no'
      TT_AZURE_EXPIRY_PACKAGE_RUN_ID: ${{ inputs.package_run_id }}
      TT_AZURE_EXPIRY_PACKAGE_ARTIFACT_ID: ${{ inputs.package_artifact_id }}
      TT_AZURE_PACKAGE_SHA256: ${{ inputs.package_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.22.3'
      - name: Verify the protected approval for this fresh run
        id: expiry-approval
        env:
          TT_AZURE_LAB_SELF_APPROVAL: ${{ secrets.CERTOPS_AZURE_LAB_SELF_APPROVAL }}
        run: node infra/certops-azure-keyvault/lab.js github-approval
      - name: Verify and extract the retained universal package before Azure authentication
        run: node tests/e2e/azure-keyvault-natural-expiry.cjs stage-package
      - name: Authenticate isolated provisioning identity using OIDC
        shell: pwsh
        run: ./infra/certops-azure-keyvault/login-oidc.ps1
      - name: Provision only the run-owned vault and identities
        run: node infra/certops-azure-keyvault/lab.js provision
      - name: Observe natural expiry and renewal on one pinned Azure secret version
        id: expiry-observation
        run: node tests/e2e/azure-keyvault-natural-expiry.cjs launch
      - name: Reauthenticate for cleanup
        id: expiry-cleanup-auth
        if: always() && steps.expiry-approval.outcome == 'success'
        shell: pwsh
        run: ./infra/certops-azure-keyvault/login-oidc.ps1
      - name: Confirm worker drainage before run-owned no-purge teardown
        id: expiry-cleanup
        if: always() && steps.expiry-cleanup-auth.outcome == 'success'
        run: node tests/e2e/azure-keyvault-natural-expiry.cjs cleanup
      - name: Scrub private state and write evidence only after observed teardown
        if: always()
        run: node tests/e2e/azure-keyvault-natural-expiry.cjs finalize
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: success() && steps.expiry-observation.outcome == 'success' && steps.expiry-cleanup.outcome == 'success'
        with:
          name: azure-natural-expiration-final-package
          path: qualification-results/azure-natural-expiration-final-package.json
          if-no-files-found: error

  collect-final-package:
    needs: [preflight, lab]
    if: github.ref == 'refs/heads/main' && vars.CERTOPS_AZURE_KEYVAULT_LAB_ENABLED == 'true' && inputs.final_package
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    env:
      CERTOPS_AZURE_KEYVAULT_LAB_ENABLED: ${{ vars.CERTOPS_AZURE_KEYVAULT_LAB_ENABLED }}
      TT_AZURE_PACKAGE_ARTIFACT_ID: ${{ needs.preflight.outputs.artifact_id }}
      TT_AZURE_PACKAGE_SHA256: ${{ inputs.package_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.22.3'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.preflight.outputs.artifact_id }}
          path: ${{ runner.temp }}/azure-release-candidate/artifacts
          merge-multiple: true
          digest-mismatch: error
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.lab.outputs.evidence_id }}
          path: ${{ runner.temp }}/azure-final-evidence
          merge-multiple: true
          digest-mismatch: error
      - name: Collect the exact package, all Azure scenarios and owned teardown
        run: |
          node scripts/certops-azure-keyvault-package.cjs collect \
            "$RUNNER_TEMP/azure-release-candidate/artifacts" "$RUNNER_TEMP/azure-final-evidence" \
            qualification-results/azure-keyvault-final-package-verdict.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: azure-keyvault-final-package-verdict
          path: qualification-results/azure-keyvault-final-package-verdict.json
          if-no-files-found: error
