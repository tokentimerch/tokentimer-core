name: "Core 0.18 / Focused Windows boundaries"

on:
  push:
    branches: [release-prep/core-0.18.0-evidence]
    paths:
      - .github/workflows/core-018-windows-boundaries.yml
      - scripts/rehearse-windows-boundaries.js
      - scripts/rehearse-windows-boundaries.test.js
      - packages/agent/windows-service-host/host_test.go
      - packages/agent/windows-service-host/testdata/mock-agent.js
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: core-018-windows-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  CORE_SOURCE_SHA: fcc681c19314b7c2432973ce99d517af36e10238

jobs:
  windows-helpers:
    name: Patched Windows helper execution
    runs-on: windows-2022
    timeout-minutes: 25
    defaults:
      run:
        working-directory: candidate
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: preparation
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.CORE_SOURCE_SHA }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '24'
      - name: Verify trusted product source and use explicit-ready test fixtures
        shell: pwsh
        run: |
          if ((git rev-parse HEAD) -ne $env:CORE_SOURCE_SHA) { throw 'Selected source moved' }
          git merge-base --is-ancestor $env:CORE_SOURCE_SHA origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Product source is not trusted main ancestry' }
          Copy-Item ../preparation/packages/agent/windows-service-host/host_test.go packages/agent/windows-service-host/host_test.go
          Copy-Item ../preparation/packages/agent/windows-service-host/testdata/mock-agent.js packages/agent/windows-service-host/testdata/mock-agent.js
          git diff --exit-code HEAD -- packages/agent ':!packages/agent/windows-service-host/host_test.go' ':!packages/agent/windows-service-host/testdata/mock-agent.js'
          if ($LASTEXITCODE -ne 0) { throw 'Unexpected production-source mutation' }
          $fixtureFiles = @('packages/agent/windows-service-host/host_test.go', 'packages/agent/windows-service-host/testdata/mock-agent.js')
          New-Item -ItemType Directory -Force helper-results | Out-Null
          @{productSource=$env:CORE_SOURCE_SHA;fixtureSource=$env:GITHUB_SHA;files=@($fixtureFiles | ForEach-Object { @{path=$_;sha256=(Get-FileHash $_ -Algorithm SHA256).Hash.ToLowerInvariant()} })} | ConvertTo-Json -Depth 5 | Set-Content helper-results/fixture-provenance.json
      - name: Install checksum-pinned patched Windows Go toolchain
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'go.zip'
          Invoke-WebRequest https://go.dev/dl/go1.26.10.windows-amd64.zip -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne '7ecd2d7260e82c59bcbd7f1077a07cee2dea607295b858df67195a1e4e09629b') { throw 'Go archive checksum mismatch' }
          $destination = Join-Path $env:RUNNER_TEMP 'core-go'
          Expand-Archive $archive $destination
          (Join-Path $destination 'go/bin') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          ('GOROOT=' + (Join-Path $destination 'go')) | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: 40144872189
          name: core-018-agent-candidate
          path: candidate/candidate-archive
      - name: Execute native helper and service host regression suites
        shell: pwsh
        run: |
          if ((go env GOVERSION) -ne 'go1.26.10') { throw 'Unexpected Go toolchain' }
          New-Item -ItemType Directory -Force helper-results | Out-Null
          foreach ($module in @('reference/adcs-chain', 'reference/adcs-cmc', 'reference/verifier', 'windows-service-host')) {
            $output = Join-Path (Join-Path $env:GITHUB_WORKSPACE 'candidate/helper-results') ($module.Replace('/', '-') + '.jsonl')
            Push-Location "packages/agent/$module"
            try {
              go test -mod=readonly -count=1 -json ./... > $output
              if ($LASTEXITCODE -ne 0) { throw "Native helper tests failed: $module" }
            } finally { Pop-Location }
          }
      - name: Restore immutable product checkout after test fixture overlay
        if: always()
        shell: pwsh
        run: |
          git restore --source=$env:CORE_SOURCE_SHA -- packages/agent/windows-service-host/host_test.go packages/agent/windows-service-host/testdata/mock-agent.js
          if ($LASTEXITCODE -ne 0) { throw 'Fixture restoration failed' }
          git diff --exit-code HEAD -- packages/agent
          if ($LASTEXITCODE -ne 0) { throw 'Product checkout is not restored' }
      - name: Execute the actual packaged CMC helper against signed fixtures
        shell: pwsh
        env:
          EXPECTED_AGENT_SHA256: 062f48b1960685b247b0114b2f7086b7accda23f8788895078da627f8844507c
        run: |
          $archive = 'candidate-archive/tokentimer-agent-0.18.0.tgz'
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:EXPECTED_AGENT_SHA256) { throw 'Agent archive mismatch' }
          New-Item -ItemType Directory -Force extracted | Out-Null
          tar -xzf $archive -C extracted
          if ($LASTEXITCODE -ne 0) { throw 'Agent extraction failed' }
          $fixtures = 'packages/agent/reference/adcs-cmc/testdata'
          $pin = (Get-Content "$fixtures/ca-key-sha256.txt" -Raw).Trim()
          $response = & './extracted/package/bin/tokentimer-adcs-cmc-amd64.exe' --response "$fixtures/issued.rsp" --ca-key-sha256 $pin --ca-cert "$fixtures/ca.cer"
          if ($LASTEXITCODE -ne 0) { throw 'Packaged CMC signed fixture failed' }
          $result = $response | ConvertFrom-Json
          if ($result.disposition -ne 'issued') { throw 'Expected issued CMC disposition' }
          & './extracted/package/bin/tokentimer-adcs-cmc-amd64.exe' --response "$fixtures/issued.rsp" --ca-key-sha256 ('0' * 64) --ca-cert "$fixtures/ca.cer" 1>$null 2>$null
          if ($LASTEXITCODE -ne 2) { throw 'Packaged CMC did not refuse wrong CA pin' }
          @{sourceSha=$env:CORE_SOURCE_SHA;agentSha256=$env:EXPECTED_AGENT_SHA256;goVersion='go1.26.10';signedFixture='passed';wrongPinRefusal='passed';scope='windows-helper-regression-not-domain-CA'} | ConvertTo-Json | Set-Content helper-results/packaged-helper.json
          $global:LASTEXITCODE = 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: core-018-patched-windows-helpers
          path: candidate/helper-results/
          if-no-files-found: error

  windows-boundaries:
    name: Actual packaged IIS wildcard and SAN discovery
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: preparation
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.CORE_SOURCE_SHA }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '24'
      - name: Verify trusted source and smoke ownership guards
        shell: pwsh
        run: |
          if ((git -C candidate rev-parse HEAD) -ne $env:CORE_SOURCE_SHA) { throw 'Selected source moved' }
          git -C candidate merge-base --is-ancestor $env:CORE_SOURCE_SHA origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Product source is not trusted main ancestry' }
          node --test preparation/scripts/rehearse-windows-boundaries.test.js
          if ($LASTEXITCODE -ne 0) { throw 'Windows smoke guard tests failed' }
          Copy-Item preparation/scripts/rehearse-windows-boundaries.js candidate/scripts/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: 40144872189
          name: core-018-agent-candidate
          path: candidate-archive
      - name: Enable IIS only on the disposable runner
        shell: powershell
        run: |
          $result = Install-WindowsFeature Web-Server,Web-Static-Content,Web-Scripting-Tools -IncludeManagementTools
          if (-not $result.Success -or $result.RestartNeeded -eq 'Yes') { throw 'IIS features require successful installation without a reboot' }
      - name: Exercise actual packaged native boundaries and owned cleanup
        shell: pwsh
        run: |
          node candidate/scripts/rehearse-windows-boundaries.js --archive "$env:GITHUB_WORKSPACE/candidate-archive/tokentimer-agent-0.18.0.tgz" --archive-sha256 062f48b1960685b247b0114b2f7086b7accda23f8788895078da627f8844507c --source-sha $env:CORE_SOURCE_SHA --out "$env:GITHUB_WORKSPACE/boundary-results/windows-boundaries.json"
          if ($LASTEXITCODE -ne 0) { throw 'Windows native boundary smoke failed' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: core-018-windows-native-boundaries
          path: boundary-results/windows-boundaries.json
          if-no-files-found: error
