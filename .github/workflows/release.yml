name: Release

on:
  push:
    tags:
      - "v*"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  HELM_OCI_REGISTRY: ghcr.io
  HELM_OCI_REPO: ghcr.io/${{ github.repository_owner }}/charts

jobs:
  # Stage 1a: scan both architectures, then publish their unchanged OCI index.
  build-and-push-docker:
    runs-on: ubuntu-latest
    env:
      GRYPE_CHECK_FOR_APP_UPDATE: "false"
      SKOPEO_IMAGE: quay.io/skopeo/stable@sha256:2681eccb8b02c495b013c2669cbf7f41d5c0b0b0e644e7c69bd3ea9bcb20641f # 1.22.3
    permissions:
      packages: write
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - component: api
            dockerfile: deploy/compose/Dockerfile.api
          - component: worker
            dockerfile: deploy/compose/Dockerfile.worker
          - component: dashboard
            dockerfile: deploy/compose/Dockerfile.dashboard
          - component: k8s-controller
            dockerfile: apps/k8s-controller/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve checked-out image source
        id: source_identity
        shell: bash
        run: |
          REVISION="$(git rev-parse --verify HEAD)"
          EVENT_REVISION="$(git rev-parse --verify "${GITHUB_SHA}^{commit}")"
          test "$REVISION" = "$EVENT_REVISION"
          printf 'revision=%s\n' "$REVISION" >> "$GITHUB_OUTPUT"

      - name: Extract version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Set up QEMU for both release architectures
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the multi-platform release archive
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          platforms: linux/amd64,linux/arm64
          outputs: type=oci,dest=${{ runner.temp }}/release-image.tar
          tags: |
            ghcr.io/${{ github.repository_owner }}/tokentimer-core-${{ matrix.component }}:${{ steps.get_version.outputs.VERSION }}
          labels: |
            org.opencontainers.image.revision=${{ steps.source_identity.outputs.revision }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan both release architectures
        env:
          SOURCE_REVISION: ${{ steps.source_identity.outputs.revision }}
          SOURCE_REPOSITORY: https://github.com/${{ github.repository }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            https://github.com/anchore/grype/releases/download/v0.112.0/grype_0.112.0_linux_amd64.tar.gz \
            -o "$RUNNER_TEMP/grype.tar.gz"
          echo "acb14a030010fe9bdb9594b4ae108d9d14ef2f926d936aa0916dc62c89c058ea  $RUNNER_TEMP/grype.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/core-grype"
          tar -xzf "$RUNNER_TEMP/grype.tar.gz" -C "$RUNNER_TEMP/core-grype" grype
          sha256sum "$RUNNER_TEMP/release-image.tar" > "$RUNNER_TEMP/release-image.tar.sha256"
          skopeo_local() {
            docker run --rm --network none --volume "$RUNNER_TEMP:/release" "$SKOPEO_IMAGE" "$@"
          }
          skopeo_local inspect --raw oci-archive:/release/release-image.tar > "$RUNNER_TEMP/release-image.index.json"
          jq --exit-status '[.manifests[].platform | select(.os == "linux") | .architecture] | unique == ["amd64", "arm64"]' \
            "$RUNNER_TEMP/release-image.index.json"
          SCAN_FAILED=0
          for architecture in amd64 arm64; do
            EXPECTED_DIGEST="$(jq --exit-status --raw-output --arg architecture "$architecture" \
              '[.manifests[] | select(.platform.os == "linux" and .platform.architecture == $architecture)] | if length == 1 then .[0].digest else error("Expected exactly one architecture manifest") end' \
              "$RUNNER_TEMP/release-image.index.json")"
            # Grype cannot select a nested OCI index reliably. Copy each exact manifest without rewriting it.
            skopeo_local copy --override-os linux --override-arch "$architecture" \
              --preserve-digests --digestfile "/release/release-image-$architecture.digest" \
              oci-archive:/release/release-image.tar "oci-archive:/release/release-image-$architecture.tar"
            test "$(cat "$RUNNER_TEMP/release-image-$architecture.digest")" = "$EXPECTED_DIGEST"
            skopeo_local inspect --config "oci-archive:/release/release-image-$architecture.tar" | \
              jq --exit-status --arg architecture "$architecture" --arg revision "$SOURCE_REVISION" --arg source "$SOURCE_REPOSITORY" \
                '.architecture == $architecture and .os == "linux" and .config.Labels["org.opencontainers.image.revision"] == $revision and .config.Labels["org.opencontainers.image.source"] == $source'
            if ! "$RUNNER_TEMP/core-grype/grype" "oci-archive:$RUNNER_TEMP/release-image-$architecture.tar" \
              --platform "linux/$architecture" --fail-on high --only-fixed -o json --file "$RUNNER_TEMP/release-image-$architecture.json"; then
              SCAN_FAILED=1
            fi
            jq --exit-status --arg digest "$EXPECTED_DIGEST" \
              '.source.target.manifestDigest == $digest and .descriptor.name == "grype"' \
              "$RUNNER_TEMP/release-image-$architecture.json"
            rm -- "$RUNNER_TEMP/release-image-$architecture.tar"
          done
          test "$SCAN_FAILED" -eq 0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the scanned multi-platform archive
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/tokentimer-core-${{ matrix.component }}:${{ steps.get_version.outputs.VERSION }}
        run: |
          set -euo pipefail
          sha256sum --check "$RUNNER_TEMP/release-image.tar.sha256"
          EXPECTED_DIGEST="sha256:$(sha256sum "$RUNNER_TEMP/release-image.index.json" | cut -d ' ' -f 1)"
          docker run --rm --volume "$RUNNER_TEMP:/release" --volume "$HOME/.docker:/auth:ro" "$SKOPEO_IMAGE" \
            copy --all --preserve-digests --authfile /auth/config.json --digestfile /release/release-image.digest \
            oci-archive:/release/release-image.tar "docker://$IMAGE"
          test "$(cat "$RUNNER_TEMP/release-image.digest")" = "$EXPECTED_DIGEST"
          ACTUAL_DIGEST="$(docker run --rm --volume "$HOME/.docker:/auth:ro" "$SKOPEO_IMAGE" \
            inspect --raw --authfile /auth/config.json "docker://$IMAGE" | sha256sum | cut -d ' ' -f 1)"
          test "$ACTUAL_DIGEST" = "${EXPECTED_DIGEST#sha256:}"

      - name: Retain release image scan and digest evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-image-security-${{ matrix.component }}
          path: |
            ${{ runner.temp }}/release-image-amd64.json
            ${{ runner.temp }}/release-image-arm64.json
            ${{ runner.temp }}/release-image*.digest
            ${{ runner.temp }}/release-image.index.json
            ${{ runner.temp }}/release-image.tar.sha256
          if-no-files-found: error

  sign-images:
    needs: build-and-push-docker
    runs-on: ubuntu-latest

    strategy:
      matrix:
        component:
          - api
          - worker
          - dashboard
          - k8s-controller

    permissions:
      packages: write
      id-token: write

    steps:
      - name: Extract version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image digest
        id: digest
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/tokentimer-core-${{ matrix.component }}:${{ steps.get_version.outputs.VERSION }}"

          DIGEST=$(docker buildx imagetools inspect "$IMAGE" \
            --format '{{json .Manifest.Digest}}' | tr -d '"')

          echo "DIGEST=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "Resolved digest: ${DIGEST}"

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/tokentimer-core-${{ matrix.component }}@${{ steps.digest.outputs.DIGEST }}"

          echo "Signing ${IMAGE}"
          cosign sign --yes "${IMAGE}"

      - name: Verify image
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/tokentimer-core-${{ matrix.component }}@${{ steps.digest.outputs.DIGEST }}"

          cosign verify \
            --certificate-identity-regexp="^https://github\.com/tokentimerch/tokentimer-core/\.github/workflows/release\.yml@refs/tags/v.+$" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            "${IMAGE}"
            

  # Stage 1b: package Helm chart (no OCI publish yet).
  build-helm-chart:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Extract version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Install Helm
        run: |
          curl -fsSLo /tmp/helm.tar.gz https://get.helm.sh/helm-v3.20.1-linux-amd64.tar.gz
          echo "0165ee4a2db012cc657381001e593e981f42aa5707acdd50658326790c9d0dc3  /tmp/helm.tar.gz" | sha256sum -c -
          tar -xzf /tmp/helm.tar.gz -C /tmp linux-amd64/helm
          sudo install -m 0755 /tmp/linux-amd64/helm /usr/local/bin/helm
          helm version

      - name: Update Chart version from tag
        run: |
          cd deploy/helm
          VER='${{ steps.get_version.outputs.VERSION }}'
          sed -i "s/^version:.*/version: \"$VER\"/" Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: \"$VER\"/" Chart.yaml
          sed -i "/repository: tokentimer-core-api\$/,/pullPolicy:/{s/^    tag: .*/    tag: \"$VER\"/}" values.yaml
          sed -i "/repository: tokentimer-core-dashboard\$/,/pullPolicy:/{s/^    tag: .*/    tag: \"$VER\"/}" values.yaml
          sed -i "/repository: tokentimer-core-worker\$/,/pullPolicy:/{s/^    tag: .*/    tag: \"$VER\"/}" values.yaml
          sed -i "/repository: tokentimer-core-k8s-controller\$/,/pullPolicy:/{s/^      tag: .*/      tag: \"$VER\"/}" values.yaml

      - name: Package chart
        run: helm package deploy/helm --destination .helm-pkg

      - name: Lint and template packaged chart
        run: |
          CHART=".helm-pkg/tokentimer-${{ steps.get_version.outputs.VERSION }}.tgz"
          test -f "$CHART"
          # config.adminEmail is a required value (see dashboard-deployment.yaml);
          # this is a packaging smoke test, not a real install, so supply the same
          # placeholder used by scripts/helm-template-verify.sh and ci.yml.
          helm lint "$CHART" --set config.adminEmail=ci@example.com
          helm template tokentimer "$CHART" --set config.adminEmail=ci@example.com >/dev/null

      - name: Upload Helm package artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: helm-chart
          path: .helm-pkg/tokentimer-${{ steps.get_version.outputs.VERSION }}.tgz
          if-no-files-found: error

  # Stage 1c: build agent release tarball + checksum (verified in verify-release).
  pack-agent:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GO_VERSION: "1.26.10"
      GOTOOLCHAIN: local
      GRYPE_CHECK_FOR_APP_UPDATE: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pinned patched Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Pack agent release tarball
        run: |
          test "$(go env GOVERSION)" = "go${GO_VERSION}"
          node packages/agent/scripts/pack-release.js --out-dir agent-dist

      - name: Verify shipped native toolchain and provenance
        run: |
          node --test scripts/verify-agent-native-package.test.js
          archive=(agent-dist/*.tgz)
          test "${#archive[@]}" -eq 1
          node scripts/verify-agent-native-package.js \
            --archive "${archive[0]}" --go-version "$GO_VERSION" \
            --source-sha "$GITHUB_SHA" --out agent-dist/native-provenance.json

      - name: Scan shipped package for fixed High and Critical advisories
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/anchore/grype/releases/download/v0.112.0/grype_0.112.0_linux_amd64.tar.gz \
            -o "$RUNNER_TEMP/grype.tar.gz"
          echo "acb14a030010fe9bdb9594b4ae108d9d14ef2f926d936aa0916dc62c89c058ea  $RUNNER_TEMP/grype.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/core-grype" "$RUNNER_TEMP/agent-extracted"
          tar -xzf "$RUNNER_TEMP/grype.tar.gz" -C "$RUNNER_TEMP/core-grype" grype
          archive=(agent-dist/*.tgz)
          tar -xzf "${archive[0]}" -C "$RUNNER_TEMP/agent-extracted"
          "$RUNNER_TEMP/core-grype/grype" "dir:$RUNNER_TEMP/agent-extracted" \
            --fail-on high --only-fixed -o json --file agent-dist/native-security.json

      - name: Verify agent checksum
        run: |
          cd agent-dist
          ls -la
          sha256sum -c ./*.sha256

      - name: Upload native package verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-native-verification
          path: |
            agent-dist/native-provenance.json
            agent-dist/native-security.json
          if-no-files-found: warn

      - name: Upload agent release artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-release
          path: |
            agent-dist/*.tgz
            agent-dist/*.sha256
          if-no-files-found: error

  # Stage 2: verify all artifacts before Helm OCI publish.
  verify-release:
    runs-on: ubuntu-latest
    needs:
      - build-and-push-docker
      - sign-images
      - build-helm-chart
      - pack-agent
    permissions:
      packages: read
      contents: read
    steps:
      - name: Extract version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify versioned image digests
        run: |
          set -euo pipefail
          VER='${{ steps.get_version.outputs.VERSION }}'
          OWNER='${{ github.repository_owner }}'
          for component in api worker dashboard k8s-controller; do
            IMAGE="ghcr.io/${OWNER}/tokentimer-core-${component}:${VER}"
            echo "Inspecting ${IMAGE}"
            docker buildx imagetools inspect "$IMAGE"
          done

      - name: Install Helm
        run: |
          curl -fsSLo /tmp/helm.tar.gz https://get.helm.sh/helm-v3.20.1-linux-amd64.tar.gz
          echo "0165ee4a2db012cc657381001e593e981f42aa5707acdd50658326790c9d0dc3  /tmp/helm.tar.gz" | sha256sum -c -
          tar -xzf /tmp/helm.tar.gz -C /tmp linux-amd64/helm
          sudo install -m 0755 /tmp/linux-amd64/helm /usr/local/bin/helm
          helm version

      - name: Download Helm package artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: helm-chart
          path: .helm-pkg

      - name: Verify Helm package
        run: |
          set -euo pipefail
          CHART=".helm-pkg/tokentimer-${{ steps.get_version.outputs.VERSION }}.tgz"
          test -f "$CHART"
          # config.adminEmail is a required value (see dashboard-deployment.yaml);
          # this is a packaging smoke test, not a real install, so supply the same
          # placeholder used by scripts/helm-template-verify.sh and ci.yml.
          helm lint "$CHART" --set config.adminEmail=ci@example.com
          helm template tokentimer "$CHART" --set config.adminEmail=ci@example.com >/dev/null

      - name: Download agent release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: agent-release
          path: agent-dist

      - name: Verify agent release artifacts
        run: |
          set -euo pipefail
          cd agent-dist
          test -n "$(ls *.tgz 2>/dev/null)"
          test -n "$(ls *.sha256 2>/dev/null)"
          sha256sum -c ./*.sha256

  # Stage 3a: publish Helm to OCI only after verification (chart refs versioned images).
  publish-helm-chart:
    runs-on: ubuntu-latest
    needs: verify-release
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: deploy/helm/artifacthub-repo.yml
          sparse-checkout-cone-mode: false

      - name: Extract version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Install Helm
        run: |
          curl -fsSLo /tmp/helm.tar.gz https://get.helm.sh/helm-v3.20.1-linux-amd64.tar.gz
          echo "0165ee4a2db012cc657381001e593e981f42aa5707acdd50658326790c9d0dc3  /tmp/helm.tar.gz" | sha256sum -c -
          tar -xzf /tmp/helm.tar.gz -C /tmp linux-amd64/helm
          sudo install -m 0755 /tmp/linux-amd64/helm /usr/local/bin/helm
          helm version

      - name: Download Helm package artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: helm-chart
          path: .helm-pkg

      - name: Log in to OCI registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ${{ env.HELM_OCI_REGISTRY }} -u ${{ github.actor }} --password-stdin

      - name: Push chart to OCI registry
        run: helm push .helm-pkg/tokentimer-${{ steps.get_version.outputs.VERSION }}.tgz oci://${{ env.HELM_OCI_REPO }}

      - name: Install oras
        uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3

      - name: Log in to OCI registry (oras)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | oras login ${{ env.HELM_OCI_REGISTRY }} -u ${{ github.actor }} --password-stdin

      - name: Publish Artifact Hub repository metadata
        # Enables Artifact Hub's verified publisher check. Pushed to the same OCI ref as
        # the chart itself, under the reserved "artifacthub.io" tag Artifact Hub looks for.
        run: |
          oras push ${{ env.HELM_OCI_REPO }}/tokentimer:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            deploy/helm/artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml

  # Stage 3b: create the public GitHub Release with the agent tarball attached.
  # Skipped for pre-release tags so a beta dry-run never gets a public release.
  # `gh release create <tag> <files...>` creates as draft, uploads, then
  # publishes - the only sequence immutable releases (enabled on this org)
  # allow assets to be attached in. Title/body are placeholders; the
  # release-tokentimer-core skill overwrites them via `gh release edit` after.
  create-release:
    runs-on: ubuntu-latest
    needs:
      - verify-release
      - publish-helm-chart
    if: >-
      !contains(github.ref_name, 'alpha') &&
      !contains(github.ref_name, 'beta') &&
      !contains(github.ref_name, 'rc')
    permissions:
      contents: write
    steps:
      - name: Download agent release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: agent-release
          path: agent-dist

      - name: Detect existing GitHub Release for tag
        id: release_lookup
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          if gh release view "$TAG_NAME" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release already exists for ${TAG_NAME}; a re-run of this job has nothing left to do here (immutable assets cannot be re-uploaded once published; the release-tokentimer-core skill owns title/body edits from this point on)."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release with agent tarball attached
        if: steps.release_lookup.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          test -n "$(ls agent-dist/*.tgz 2>/dev/null)"
          test -n "$(ls agent-dist/*.sha256 2>/dev/null)"
          gh release create "$TAG_NAME" \
            --repo "${{ github.repository }}" \
            --title "${TAG_NAME}" \
            --notes "Automated placeholder release for ${TAG_NAME}. See CHANGELOG.md for what changed; finalized release notes are added shortly after this is published." \
            agent-dist/*.tgz agent-dist/*.sha256
