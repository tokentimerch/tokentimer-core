# Dependabot configuration for TokenTimer Core
#
# POLICY & SUPPLY-CHAIN INTEGRITY:
# - Dependabot is enabled ONLY for the 'github-actions' package ecosystem.
# - npm and Docker dependency ecosystems are intentionally disabled and out-of-scope.
# - GitHub Actions references across .github/workflows/*.yml must remain pinned to
#   immutable 40-character commit SHAs with inline release tag comments (# vX.Y.Z).
# - Dependabot preserves commit SHA pinning when opening update PRs.
# - Auto-merging of dependency updates is strictly forbidden.
# - Maintainers must review and validate upstream release notes and diffs before merging.

version: 2
updates:
  # GitHub Actions
  # Proposes updates for GitHub Actions while preserving exact commit SHA pinning.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"

  # ---------------------------------------------------------------------------
  # DISABLED ECOSYSTEMS (Out of scope - see dependency governance policy)
  # Automated updates for npm and Docker remain disabled until dedicated review
  # and qualification policies are established.
