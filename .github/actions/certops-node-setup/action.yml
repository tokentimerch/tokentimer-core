name: CertOps Node setup
description: Shared pinned Node and pnpm installation for Linux qualification jobs.
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      with:
        version: '11.28.8'
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: '24'
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
