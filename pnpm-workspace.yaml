packages:
  - "apps/*"
  - "packages/*"

overrides:
  tar: 7.5.7
  fast-xml-builder: 1.2.0
  fast-xml-parser: 5.7.3
  minimatch: 10.2.5
  brace-expansion: 5.0.12
  path-to-regexp: 8.4.0
  yaml: 1.10.3
  js-yaml: 4.3.2
  nodemailer: 10.0.12
  sharp: 0.35.4
  vitest: 4.1.11
  "@vitest/mocker": 4.1.11
  browserslist: 4.28.7
  baseline-browser-mapping: 2.11.0
  "@humanfs/node": 0.16.8
  rollup: 4.60.0
  flatted: 3.4.2
  serialize-javascript: 7.0.5
  "picomatch@2": 2.3.2
  "picomatch@4": 4.0.4
  "ajv@6": 6.15.0
  lodash: 4.18.1
  follow-redirects: 1.16.0
  postcss: 8.5.26
  nanoid: 3.3.18
  "@babel/core": 7.29.6
  qs: 6.16.0
  ip-address: 10.7.2
  form-data: 4.0.6
  ws: 8.21.0
  body-parser: 2.3.0
  fast-uri: 3.1.8
  proxy-addr: 2.0.8

allowBuilds:
  esbuild: true
  sharp: true
  "@scarf/scarf": true

auditConfig:
  ignoreGhsas:
    # react-router: RSC Mode CSRF Bypass (GHSA-qwww-vcr4-c8h2). Only reachable
    # via the unstable RSC APIs. The dashboard uses Declarative Mode
    # (<BrowserRouter>, apps/dashboard/src/main.jsx) and never touches RSC, so
    # this app is not exploitable. No 7.x patch exists; the fix (8.3.0)
    # requires react@19.2.7+ and drops react-router-dom, which is a breaking
    # upgrade tracked separately. Remove this entry once react-router is
    # upgraded past 8.3.0.
    - GHSA-qwww-vcr4-c8h2
