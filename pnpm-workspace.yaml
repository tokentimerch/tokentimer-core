packages:
  - "apps/*"
  - "packages/*"

overrides:
  tar: 7.5.7
  fast-xml-builder: 1.2.0
  fast-xml-parser: 5.7.3
  minimatch: 10.2.5
  brace-expansion: 5.0.9
  path-to-regexp: 8.4.0
  yaml: 1.10.3
  # Quadratic CPU consumption in !!omap resolution (CVE-2026-59870 /
  # GHSA-5p4m-2wfm-xmqj), fixed 4.3.1. Pin exact per repo policy.
  js-yaml: 4.3.1
  rollup: 4.60.0
  flatted: 3.4.2
  serialize-javascript: 7.0.5
  "picomatch@2": 2.3.2
  "picomatch@4": 4.0.4
  "ajv@6": 6.15.0
  lodash: 4.18.1
  follow-redirects: 1.16.0
  # GHSA-r28c-9q8g-f849 / GHSA-fxqj-rqcc-2cmp: path traversal in previous
  # source map auto-loading (sourceMappingURL) leaks arbitrary .map files;
  # fixed 8.5.18, incomplete-fix follow-up fixed 8.5.23.
  postcss: 8.5.26
  # GHSA-2v37-7h3g-55p8 (size 0, customAlphabet/customRandom, fixed 3.3.18) /
  # GHSA-28wg-ghj8-5hjv (negative size, non-secure module, fixed 3.3.16).
  nanoid: 3.3.18
  # GHSA-4x5r-pxfx-6jf8: arbitrary source map file read via sourceMappingURL
  # comment when compiling untrusted input; fixed 7.29.6.
  "@babel/core": 7.29.6
  # GHSA-x5fp-wj9c-mxmx (arrayLimit bypass on bracket-key comma parse) and
  # GHSA-4mjr-xmp4-gh2g (stringify throw on attacker-controlled isBuffer),
  # both fixed in 6.16.0. express/body-parser pull qs transitively.
  qs: 6.16.0
  ip-address: 10.4.0
  form-data: 4.0.6
  ws: 8.21.0
  # Low-severity DoS when an invalid limit silently disables size enforcement
  # (GHSA-v422-hmwv-36x6). express@5.2.1 allows ^2.2.1; pin the patched release.
  body-parser: 2.3.0
  # AJV pulls fast-uri. 3.1.5 left four later host-confusion / SSRF
  # advisories open (GHSA-5jgf-p345-68v8 / GHSA-f65p-4m7j-42xc /
  # GHSA-fph4-wmhf-6fwf / GHSA-jqff-g426-hqxp); 3.1.6 patched them and
  # 3.1.7 is the current 3.x follow-up. Stay on 3.x so AJV's declared
  # range is not jumped to 4.x by the override.
  fast-uri: 3.1.7

allowBuilds:
  esbuild: true
  sharp: true
  "@scarf/scarf": true

auditConfig:
  ignoreGhsas:
    # react-router: RSC Mode CSRF Bypass (GHSA-qwww-vcr4-c8h2). Only reachable
    # via the unstable RSC APIs. The dashboard uses Declarative Mode
    # (<BrowserRouter>, apps/dashboard/src/main.jsx) and never touches RSC, so
    # this app is not exploitable. No 7.x patch exists; the fix (8.3.0)
    # requires react@19.2.7+ and drops react-router-dom, which is a breaking
    # upgrade tracked separately. Remove this entry once react-router is
    # upgraded past 8.3.0.
    - GHSA-qwww-vcr4-c8h2
